.9 66.4 L 293.0 67.9 L 297.0 69.5 L 300.9 71.3 L 304.8 73.3 L 308.5 75.5 L 312.5 77.3 L 317.5 77.9 L 327.4 73.2 L 327.4 73.2 L 329.5 62.2 L 326.5 56.9 L 322.2 53.3 L 317.3 50.5 L 312.4 48.0 L 307.3 45.6 L 302.2 43.6 L 297.1 41.7 L 291.9 40.1 L 286.6 38.7 L 281.4 37.5 L 276.1 36.6 L 270.9 35.8 L 265.7 35.2 L 260.5 34.8 L 255.3 35.1 L 250.2 37.5 L 245.3 47.3 Z"/><text class="d-label d-label-sm" x="288.2906376519443" y="52.59898651891403">RB</text></g><g class="d-hot" data-part="l5" data-name="Mini bumper (L5)" data-desc="Extra digital input inboard of LB. Ships as a null input and does nothing until it is mapped." tabindex="0" role="img" aria-label="Mini bumper (L5). Extra digital input inboard of LB. Ships as a null input and does nothing until it is mapped."><title>Mini bumper (L5)</title><path class="d-part-2" d="M 177.7 49.1 L 176.3 56.6 L 175.2 58.5 L 174.1 58.9 L 173.1 58.8 L 172.1 58.8 L 171.1 58.7 L 170.1 58.7 L 169.1 58.6 L 168.1 58.6 L 167.1 58.6 L 166.1 58.5 L 165.1 58.5 L 164.2 58.4 L 163.2 58.4 L 162.2 58.4 L 161.2 57.9 L 160.2 55.9 L 159.4 48.3 L 159.4 48.3 L 160.6 40.8 L 161.7 38.8 L 162.7 38.4 L 163.8 38.4 L 164.8 38.5 L 165.9 38.5 L 166.9 38.5 L 168.0 38.6 L 169.0 38.6 L 170.1 38.7 L 171.1 38.7 L 172.1 38.8 L 173.2 38.8 L 174.2 38.9 L 175.2 38.9 L 176.2 39.5 L 177.1 41.5 L 177.7 49.1 Z"/><text class="d-label d-label-xs" x="168.58308239145646" y="48.61268563509664">L5</text></g><g class="d-hot" data-part="r5" data-name="Mini bumper (R5)" data-desc="Extra digital input inboard of RB, mapped the same way as L5." tabindex="0" role="img" aria-label="Mini bumper (R5). Extra digital input inboard of RB, mapped the same way as L5."><title>Mini bumper (R5)</title><path class="d-part-2" d="M 222.3 49.1 L 223.7 56.6 L 224.8 58.5 L 225.9 58.9 L 226.9 58.8 L 227.9 58.8 L 228.9 58.7 L 229.9 58.7 L 230.9 58.6 L 231.9 58.6 L 232.9 58.6 L 233.9 58.5 L 234.9 58.5 L 235.8 58.4 L 236.8 58.4 L 237.8 58.4 L 238.8 57.9 L 239.8 55.9 L 240.6 48.3 L 240.6 48.3 L 239.4 40.8 L 238.3 38.8 L 237.3 38.4 L 236.2 38.4 L 235.2 38.5 L 234.1 38.5 L 233.1 38.5 L 232.0 38.6 L 231.0 38.6 L 229.9 38.7 L 228.9 38.7 L 227.9 38.8 L 226.8 38.8 L 225.8 38.9 L 224.8 38.9 L 223.8 39.5 L 222.9 41.5 L 222.3 49.1 Z"/><text class="d-label d-label-xs" x="231.41691760854354" y="48.61268563509664">R5</text></g><g class="d-hot" data-part="ls" data-name="Left stick" data-desc="Movement axis, and a digital click (LS/L3) when pressed." tabindex="0" role="img" aria-label="Left stick. Movement axis, and a digital click (LS/L3) when pressed."><title>Left stick</title><circle class="d-recess" cx="116.07" cy="115.74" r="28"/><circle class="d-part" cx="116.07" cy="115.74" r="19"/><circle class="d-part-inset" cx="116.07" cy="115.74" r="11"/><text class="d-label d-label-sm" x="116.07" y="116.24">LS</text></g><g class="d-hot" data-part="face" data-name="ABXY face buttons" data-desc="The four primary action buttons." tabindex="0" role="img" aria-label="ABXY face buttons. The four primary action buttons."><title>ABXY face buttons</title><circle class="d-btn d-btn-warn" cx="289.628" cy="86.74" r="11.5"/><text class="d-btn-letter" x="289.628" y="87.24">Y</text><circle class="d-btn d-btn-bad" cx="318.628" cy="115.74" r="11.5"/><text class="d-btn-letter" x="318.628" y="116.24">B</text><circle class="d-btn d-btn-good" cx="289.628" cy="144.74" r="11.5"/><text class="d-btn-letter" x="289.628" y="145.24">A</text><circle class="d-btn d-btn-info" cx="260.628" cy="115.74" r="11.5"/><text class="d-btn-letter" x="260.628" y="116.24">X</text></g><g class="d-hot" data-part="dpad" data-name="D-pad" data-desc="Eight-way directional pad, used for menus and weapon or item wheels." tabindex="0" role="img" aria-label="D-pad. Eight-way directional pad, used for menus and weapon or item wheels."><title>D-pad</title><path class="d-part" d="M 135.75400000000002 152.62599999999998 H 152.13400000000001 V 165.43599999999998 H 164.94400000000002 V 181.81599999999997 H 152.13400000000001 V 194.62599999999998 H 135.75400000000002 V 181.81599999999997 H 122.94400000000002 V 165.43599999999998 H 135.75400000000002 Z"/><g class="d-glyph d-glyph-stroke"><path d="M143.94400000000002 158.71599999999998l-3.04 3.99h6.08zM143.94400000000002 188.53599999999997l-3.04 -3.99h6.08zM129.03400000000002 173.62599999999998l3.99 -3.04v6.08zM158.854 173.62599999999998l-3.99 -3.04v6.08z"/></g></g><g class="d-hot" data-part="rs" data-name="Right stick" data-desc="Camera and aim axis, with a click (RS/R3). Same sensor assembly as the left stick." tabindex="0" role="img" aria-label="Right stick. Camera and aim axis, with a click (RS/R3). Same sensor assembly as the left stick."><title>Right stick</title><circle class="d-recess" cx="254.208" cy="175.68599999999998" r="28"/><circle class="d-part" cx="254.208" cy="175.68599999999998" r="19"/><circle class="d-part-inset" cx="254.208" cy="175.68599999999998" r="11"/><text class="d-label d-label-sm" x="254.208" y="176.18599999999998">RS</text></g><g class="d-hot" data-part="view" data-name="View button" data-desc="Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use." tabindex="0" role="img" aria-label="View button. Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use."><title>View button</title><circle class="d-btn-sm" cx="160.73" cy="103.174" r="10.5"/><g class="d-glyph"><rect x="154.73" y="98.674" width="7.5" height="6" rx="1.2"/><rect x="159.23" y="101.674" width="7.5" height="6" rx="1.2"/></g></g><g class="d-hot" data-part="menu" data-name="Menu button" data-desc="Pause and start. Held with View and the guide button it enters the calibration and reset sequences documented on this page." tabindex="0" role="img" aria-label="Menu button. Pause and start. Held with View and the guide button it enters the calibration and reset sequences documented on this page."><title>Menu button</title><circle class="d-btn-sm" cx="239.27" cy="103.174" r="10.5"/><g class="d-glyph d-glyph-stroke"><path d="M234.27 99.674h10M234.27 103.174h10M234.27 106.674h10"/></g></g><g class="d-hot" data-part="guide" data-name="Xbox guide button" data-desc="Powers the controller and opens the Xbox dashboard. Its indicator also reports connection state, the active profile slot and whether a mode switch succeeded." tabindex="0" role="img" aria-label="Xbox guide button. Powers the controller and opens the Xbox dashboard. Its indicator also reports connection state, the active profile slot and whether a mode switch succeeded."><title>Xbox guide button</title><circle class="d-guide" cx="200" cy="81.544" r="16"/><circle class="d-guide-ring" cx="200" cy="81.544" r="11.5"/><circle class="d-accent-fill" cx="200" cy="81.544" r="4.6"/></g><g class="d-hot" data-part="share" data-name="Share button" data-desc="Captures a screenshot or a clip. Also used in the combinations that switch the controller between GIP and XInput." tabindex="0" role="img" aria-label="Share button. Captures a screenshot or a clip. Also used in the combinations that switch the controller between GIP and XInput."><title>Share button</title><circle class="d-btn-sm" cx="200" cy="120.684" r="8.5"/><g class="d-glyph d-glyph-stroke"><rect x="195" y="117.084" width="10" height="7.2" rx="1.4"/><path d="M198.2 117.084v-1.6h3.6v1.6"/></g></g><g class="d-hot" data-part="mode" data-name="M (Mode) button" data-desc="The on-controller modifier. Held with another control it remaps the rear buttons, switches profile, toggles hair triggers and changes vibration strength without any software running." tabindex="0" role="img" aria-label="M (Mode) button. The on-controller modifier. Held with another control it remaps the rear buttons, switches profile, toggles hair triggers and changes vibration strength without any software running."><title>M (Mode) button</title><circle class="d-btn-sm" cx="200" cy="144.57999999999998" r="9.5"/><text class="d-label d-label-xs" x="200" y="144.98">M</text></g><g class="d-hot" data-part="jack" data-name="3.5 mm headset jack" data-desc="Passes game audio and microphone through the controller. On several models in this range it stops working above a 250 Hz report rate, which is by design rather than a fault." tabindex="0" role="img" aria-label="3.5 mm headset jack. Passes game audio and microphone through the controller. On several models in this range it stops working above a 250 Hz report rate, which is by design rather than a fault."><title>3.5 mm headset jack</title><rect class="d-port" x="189" y="178.96" width="22" height="13" rx="5"/><circle class="d-part-inset" cx="200" cy="185.46" r="3.4"/></g>
</svg>
