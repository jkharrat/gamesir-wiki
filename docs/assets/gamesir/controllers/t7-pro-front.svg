.7 201.0 L 317.9 204.0 L 315.9 206.8 L 313.9 209.6 L 311.7 212.2"/></g><g class="d-hot" data-part="jack" data-name="3.5 mm headset jack" data-desc="Passes game audio and microphone through the controller. On several models in this range it stops working above a 250 Hz report rate, which is by design rather than a fault." tabindex="0" role="img" aria-label="3.5 mm headset jack. Passes game audio and microphone through the controller. On several models in this range it stops working above a 250 Hz report rate, which is by design rather than a fault."><title>3.5 mm headset jack</title><rect class="d-port" x="190.06796116504853" y="167.02213592233008" width="19.864077669902912" height="11.737864077669904" rx="5"/><circle class="d-part-inset" cx="200" cy="172.89106796116505" r="3.0699029126213593"/><text class="d-label d-label-xs" x="200" y="190.76">3.5 mm</text></g>
</svg>
