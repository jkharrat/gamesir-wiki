 cy="85.7864077669903" r="14.850485436893205"/><circle class="d-btn d-btn-warn" cx="290.06" cy="85.7864077669903" r="11.650485436893204"/><circle class="d-lit d-lit-bad" cx="316.2735922330097" cy="112" r="14.850485436893205"/><circle class="d-btn d-btn-bad" cx="316.2735922330097" cy="112" r="11.650485436893204"/><circle class="d-lit d-lit-good" cx="290.06" cy="138.2135922330097" r="14.850485436893205"/><circle class="d-btn d-btn-good" cx="290.06" cy="138.2135922330097" r="11.650485436893204"/><circle class="d-lit d-lit-info" cx="263.8464077669903" cy="112" r="14.850485436893205"/><circle class="d-btn d-btn-info" cx="263.8464077669903" cy="112" r="11.650485436893204"/></g><g class="d-hot" data-part="ls" data-name="Left stick" data-desc="Movement axis, and a digital click (LS/L3) when pressed. Sensor: Mag-Res TMR." tabindex="0" role="img" aria-label="Left stick. Movement axis, and a digital click (LS/L3) when pressed. Sensor: Mag-Res TMR."><title>Left stick</title><circle class="d-recess" cx="142.488" cy="172.2" r="24.271844660194176"/><circle class="d-part" cx="142.488" cy="172.2" r="15.271844660194176"/><circle class="d-part-inset" cx="142.488" cy="172.2" r="7.271844660194176"/><text class="d-label d-label-sm" x="142.488" y="172.7">LS</text></g><g class="d-hot" data-part="rs" data-name="Right stick" data-desc="Camera and aim axis, with a click (RS/R3). Same sensor assembly as the left stick. Measured centre error: 0.6% left / 1.0% right (cable); 1.7% left / 1.5% right (dongle)." tabindex="0" role="img" aria-label="Right stick. Camera and aim axis, with a click (RS/R3). Same sensor assembly as the left stick. Measured centre error: 0.6% left / 1.0% right (cable); 1.7% left / 1.5% right (dongle)."><title>Right stick</title><circle class="d-recess" cx="257.512" cy="172.2" r="24.271844660194176"/><circle class="d-part" cx="257.512" cy="172.2" r="15.271844660194176"/><circle class="d-part-inset" cx="257.512" cy="172.2" r="7.271844660194176"/><text class="d-label d-label-sm" x="257.512" y="172.7">RS</text></g><g class="d-hot" data-part="view" data-name="View button" data-desc="Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use." tabindex="0" role="img" aria-label="View button. Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use."><title>View button</title><circle class="d-btn-sm" cx="152.6" cy="90" r="9.70873786407767"/><g class="d-glyph"><rect x="146.6" y="85.5" width="7.5" height="6" rx="1.2"/><rect x="151.1" y="88.5" width="7.5" height="6" rx="1.2"/></g></g><g class="d-hot" data-part="menu" data-name="Menu button" data-desc="Pause and start. Held with View and the guide button it enters the calibration and reset sequences documented on this page." tabindex="0" role="img" aria-label="Menu button. Pause and start. Held with View and the guide button it enters the calibration and reset sequences documented on this page."><title>Menu button</title><circle class="d-btn-sm" cx="247.4" cy="90" r="9.70873786407767"/><g class="d-glyph d-glyph-stroke"><path d="M242.4 86.5h10M242.4 90h10M242.4 93.5h10"/></g></g><g class="d-hot" data-part="faceSwap" data-name="Rotating face-button gear" data-desc="A motorised internal gear physically rotates the ABXY cluster between the Xbox and Nintendo arrangements, visible through a window in the shell." tabindex="0" role="img" aria-label="Rotating face-button gear. A motorised internal gear physically rotates the ABXY cluster between the Xbox and Nintendo arrangements, visible through a window in the shell."><title>Rotating face-button gear</title><rect class="d-window" x="178.64077669902912" y="93.7242718446602" width="42.71844660194175" height="34.95145631067961" rx="8"/><circle class="d-gear" cx="200" cy="111.2" r="12.62135922330097"/><circle class="d-part-inset" cx="2