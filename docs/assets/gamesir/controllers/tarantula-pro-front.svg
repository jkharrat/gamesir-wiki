" x="257.512" y="172.7">RS</text></g><g class="d-hot" data-part="view" data-name="View button" data-desc="Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use." tabindex="0" role="img" aria-label="View button. Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use."><title>View button</title><circle class="d-btn-sm" cx="152.6" cy="90" r="9.70873786407767"/><g class="d-glyph"><rect x="146.6" y="85.5" width="7.5" height="6" rx="1.2"/><rect x="151.1" y="88.5" width="7.5" height="6" rx="1.2"/></g></g><g class="d-hot" data-part="menu" data-name="Menu button" data-desc="Pause and start. Held with View and the guide button it enters the calibration and reset sequences documented on this page." tabindex="0" role="img" aria-label="Menu button. Pause and start. Held with View and the guide button it enters the calibration and reset sequences documented on this page."><title>Menu button</title><circle class="d-btn-sm" cx="247.4" cy="90" r="9.70873786407767"/><g class="d-glyph d-glyph-stroke"><path d="M242.4 86.5h10M242.4 90h10M242.4 93.5h10"/></g></g><g class="d-hot" data-part="faceSwap" data-name="Rotating face-button gear" data-desc="A motorised internal gear physically rotates the ABXY cluster between the Xbox and Nintendo arrangements, visible through a window in the shell." tabindex="0" role="img" aria-label="Rotating face-button gear. A motorised internal gear physically rotates the ABXY cluster between the Xbox and Nintendo arrangements, visible through a window in the shell."><title>Rotating face-button gear</title><rect class="d-window" x="179.61165048543688" y="97.49514563106796" width="40.77669902912621" height="33.00970873786408" rx="8"/><circle class="d-gear" cx="200" cy="114" r="12.62135922330097"/><circle class="d-part-inset" cx="200"