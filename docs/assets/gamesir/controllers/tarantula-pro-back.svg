.2 67.8 L 294.4 69.2 L 298.4 70.7 L 302.4 72.4 L 306.3 74.3 L 310.1 76.4 L 313.8 78.6 L 318.1 80.0 L 328.1 74.5 L 328.1 74.5 L 330.2 63.1 L 326.4 59.0 L 321.8 56.2 L 317.0 53.6 L 312.1 51.2 L 307.1 49.1 L 302.1 47.2 L 297.1 45.5 L 292.0 44.1 L 286.8 42.8 L 281.7 41.7 L 276.5 40.9 L 271.4 40.1 L 266.3 39.6 L 261.2 39.2 L 256.1 39.0 L 251.0 40.0 L 246.1 50.4 Z"/><text class="d-label d-label-sm" x="288.97023547098655" y="55.311747789195465">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely." tabindex="0" role="img" aria-label="USB-C port. Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely."><title>USB-C port</title><rect class="d-port" x="182" y="51.5" width="36" height="15" rx="7.5"/><rect class="d-part-inset" x="188" y="56" width="24" height="6" rx="3"/><text class="d-label d-label-xs" x="200" y="79">USB-C</text></g><g class="d-hot" data-part="gear" data-name="Trigger stop switches" data-desc="Physical switches that shorten the trigger from full analog travel to a short click. Three states are documented by GameSir: Hall Effect analog mode (linear, for racing), Hall Effect hair-trigger mode (en…." tabindex="0" role="img" aria-label="Trigger stop switches. Physical switches that shorten the trigger from full analog travel to a short click. Three states are documented by GameSir: Hall Effect analog mode (linear, for racing), Hall Effect hair-trigger mode (en…."><title>Trigger stop switches</title><rect class="d-part-2" x="96.1" y="86.5" width="34" height="15" rx="7.5"/><rect class="d-accent-fill" x="99.1" y="89.5" width="12" height="9" rx="4.5"/><text class="d-label d-label-xs" x="113.1" y="114">stop</text></g><g class="d-hot" data-part="gear" data-name="Trigger stop switches" data-desc="Physical switches that shorten the trigger from full analog travel to 