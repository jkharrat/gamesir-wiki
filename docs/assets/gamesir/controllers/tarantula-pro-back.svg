65.9 L 295.0 67.3 L 299.2 68.9 L 303.2 70.6 L 307.2 72.6 L 311.1 74.7 L 315.2 76.5 L 320.3 77.0 L 329.9 72.2 L 329.9 72.2 L 331.4 61.4 L 328.2 56.2 L 323.7 52.8 L 318.7 50.1 L 313.7 47.7 L 308.6 45.5 L 303.4 43.5 L 298.2 41.8 L 293.0 40.3 L 287.7 39.0 L 282.4 37.9 L 277.1 37.0 L 271.8 36.3 L 266.6 35.7 L 261.4 35.3 L 256.2 35.7 L 251.1 38.0 L 246.1 47.5 Z"/><text class="d-label d-label-sm" x="289.7181865241654" y="52.49706890621284">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely." tabindex="0" role="img" aria-label="USB-C port. Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely."><title>USB-C port</title><rect class="d-port" x="182" y="51.5" width="36" height="15" rx="7.5"/><rect class="d-part-inset" x="188" y="56" width="24" height="6" rx="3"/><text class="d-label d-label-xs" x="200" y="79">USB-C</text></g><g class="d-hot" data-part="gear" data-name="Trigger stop switches" data-desc="Physical switches that shorten the trigger from full analog travel to a short click. Three states are documented by GameSir: Hall Effect analog mode (linear, for racing), Hall Effect hair-trigger mode (en…." tabindex="0" role="img" aria-label="Trigger stop switches. Physical switches that shorten the trigger from full analog travel to a short click. Three states are documented by GameSir: Hall Effect analog mode (linear, for racing), Hall Effect hair-trigger mode (en…."><title>Trigger stop switches</title><rect class="d-part-2" x="96.1" y="86.5" width="34" height="15" rx="7.5"/><rect class="d-accent-fill" x="99.1" y="89.5" width="12" height="9" rx="4.5"/><text class="d-label d-label-xs" x="113.1" y="114">stop</text></g><g class="d-hot" data-part="gear" data-name="Trigger stop switches" data-desc="Physical switches that shorten the trigger from full analog travel to a short click. Three states are documented by GameSir: Hall Effect analog mode (linear, for racing), Hall Effect hair-trigger mode (en…." tabindex="0" role="img" aria-label="Trigger stop switches. Physical switches that shorten the trigger from full analog travel to a short click. Three states are documented by GameSir: Hall Effect analog mode (linear, for racing), Hall Effect hair-trigger mode (en…."><title>Trigger stop switches</title><rect class="d-part-2" x="269.9" y="86.5" width="34" height="15" rx="7.5"/><rect class="d-accent-fill" x="288.9" y="89.5" width="12" height="9" rx="4.5"/><text class="d-label d-label-xs" x="286.9" y="114">stop</text></g><g class="d-hot" data-part="l4" data-name="Rear button L4" data-desc="Remappable paddle reached by the middle finger. Ships as a null input, so it does nothing until it is assigned." tabindex="0" role="img" aria-label="Rear button L4. Remappable paddle reached by the middle finger. Ships as a null input, so it does nothing until it is assigned."><title>Rear button L4</title><g transform="rotate(-15 98.09 214)"><rect class="d-part-2" x="85.09" y="189" width="26" height="50" rx="13"/></g><text class="d-label d-label-sm" x="98.09" y="214">L4</text></g><g class="d-hot" data-part="r4" data-name="Rear button R4" data-desc="Remappable paddle on the right grip, assigned the same way as L4." tabindex="0" role="img" aria-label="Rear button R4. Remappable paddle on the right grip, assigned the same way as L4."><title>Rear button R4</title><g transform="rotate(15 301.90999999999997 214)"><rect class="d-part-2" x="288.90999999999997" y="189" width="26" height="50" rx="13"/></g><text class="d-label d-label-sm" x="301.90999999999997" y="214">R4</text></g><g class="d-hot" data-part="latch" data-name="Back-button latches" data-desc="Sliders that mechanically disable the rear paddles, so a grip that keeps catching them can be locked out without unmapping anything." tabindex="0" role="img" aria-label="Back-button latches. Sliders that mechan