echanically disable the rear paddles, so a grip that keeps catching them can be locked out without unmapping anything."><title>Back-button latches</title><rect class="d-part-inset" x="138.2" y="187" width="13" height="26" rx="6"/><rect class="d-accent-fill" x="140.7" y="190" width="8" height="9" rx="4"/><text class="d-label d-label-xs" x="142.7" y="223">lock</text></g><g class="d-hot" data-part="latch" data-name="Back-button latches" data-desc="Sliders that mechanically disable the rear paddles, so a grip that keeps catching them can be locked out without unmapping anything." tabindex="0" role="img" aria-label="Back-button latches. Sliders that mechanically disable the rear paddles, so a grip that keeps catching them can be locked out without unmapping anything."><title>Back-button latches</title><rect class="d-part-inset" x="248.8" y="187" width="13" height="26" rx="6"/><rect class="d-accent-fill" x="251.3" y="190" width="8" height="9" rx="4"/><text class="d-label d-label-xs" x="257.3" y="223">lock</text></g><g class="d-hot" data-part="grip" data-name="Grip" data-desc="Textured grip. Documented weight for the whole controller: 263 g." tabindex="0" role="img" aria-label="Grip. Textured grip. Documented weight for the whole controller: 263 g."><title>Grip</title><path class="d-texture" d="M 59.7 183.2 L 60.5 186.0 L 61.4 188.7 L 62.3 191.4 L 63.3 194.0 L 64.3 196.7 L 65.4 199.2 L 66.6 201.8 L 67.8 204.3 L 69.1 206.8 L 70.5 209.2 L 71.9 211.5 L 73.3 213.8 L 74.9 216.1 L 76.5 218.3 L 78.2 220.4 L 79.9 222.4 L 81.7 224.4 L 83.5 226.3"/><path class="d-texture" d="M 73.2 179.4 L 73.9 181.9 L 74.7 184.3 L 75.5 186.7 L 76.4 189.0 L 77.3 191.3 L 78.3 193.6 L 79.3 195.8 L 80.3 198.0 L 81.4 200.1 L 82.6 202.2 L 83.8 204.2 L 85.0 206.1 L 86.3 208.0 L 87.6 209.8 L 89.0 211.5 L 90.4 213.2 L 91.8 214.8 L 93.3 216.3"/><path class="d-texture" d="M 340.3 183.2 L 339.5 186.0 L 338.6 188.7 L 337.7 191.4 L 336.7 194.0 L 335.7 196.7 L 334.6 199.2 L 333.4 201.8 L 332.2 204.3 L 330.9 206.8