0.5 64.5 L 326.9 60.2 L 322.3 57.1 L 317.6 54.2 L 312.7 51.6 L 307.8 49.3 L 302.8 47.1 L 297.7 45.3 L 292.5 43.6 L 287.3 42.2 L 282.1 41.0 L 276.9 40.0 L 271.7 39.2 L 266.5 38.6 L 261.3 38.1 L 256.2 37.8 L 251.1 38.9 L 246.0 50.0 Z"/><text class="d-label d-label-sm" x="288.9667479869187" y="55.55899668201449">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and power. This model is wired-only, so the cable is the connection rather than a charging option." tabindex="0" role="img" aria-label="USB-C port. Data and power. This model is wired-only, so the cable is the connection rather than a charging option."><title>USB-C port</title><rect class="d-port" x="182" y="51.71" width="36" height="15" rx="7.5"/><rect class="d-part-inset" x="188" y="56.21" width="24" height="6" rx="3"/><text class="d-label d-label-xs" x="200" y="79.21000000000001">USB-C</text></g><g class="d-hot" data-part="l4" data-name="Rear button L4" data-desc="Remappable paddle reached by the middle finger. Ships as a null input, so it does nothing until it is assigned." tabindex="0" role="img" aria-label="Rear button L4. Remappable paddle reached by the middle finger. Ships as a null input, so it does nothing until it is assigned."><title>Rear button L4</title><g transform="rotate(-15 99.38 225.06)"><rect class="d-part-2" x="86.38" y="200.06" width="26" height="50" rx="13"/></g><text class="d-label d-label-sm" x="99.38" y="225.06">L4</text></g><g class="d-hot" data-part="r4" data-name="Rear button R4" data-desc="Remappable paddle on the right grip, assigned the same way as L4." tabindex="0" role="img" aria-label="Rear button R4. Remappable paddle on the right grip, assigned the same way as L4."><title>Rear button R4</title><g transform="rotate(15 300.62 225.06)"><rect class="d-part-2" x="287.62" y="200.06" width="26" height="50" rx="13"/></g><text class="d-label d-label-sm" x="300.62" y="225.06">R4</text></g><g class="d-hot" data-part="grip" data-name="Grip" data-desc=