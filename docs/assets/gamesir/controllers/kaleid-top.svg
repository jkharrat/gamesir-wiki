<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="900" height="383" role="img" aria-label="GameSir Kaleid — top edge layout schematic">
  <title>GameSir Kaleid — top edge layout schematic</title>
  <desc>Original schematic diagram from the community-maintained GameSir Wiki. Not GameSir product photography.</desc>

  <style>
    :root { color-scheme: dark light; }
    svg { --ink:#f2f3f5; --muted:#a6aab3; --dim:#71757e; --line:#34343e;
          --s1:#121216; --s2:#17171d; --s3:#1e1e25; --inset:#0e0e12;
          --brand:#e5343c; --good:#35d07f; --warn:#ffc247; --bad:#ff6b6b; --info:#64a8ff; }
    @media (prefers-color-scheme: light) {
      svg { --ink:#16171a; --muted:#585d66; --dim:#80858d; --line:#cdced5;
            --s1:#fff; --s2:#fbfbfc; --s3:#f1f1f4; --inset:#f4f4f7;
            --brand:#d6272e; --good:#0f7a44; --warn:#8a5a00; --bad:#c02626; --info:#175fd0; }
    }
  </style>
  <style>
    .d-canvas{fill:var(--s1)}
    .d-body{fill:var(--s2);stroke:var(--line);stroke-width:2}
    .d-panel{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
    .d-part{fill:var(--s3);stroke:var(--line);stroke-width:1.4}
    .d-part-2{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-part-inset{fill:var(--inset);stroke:var(--line);stroke-width:1}
    .d-recess{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-port{fill:var(--inset);stroke:var(--muted);stroke-width:1.4}
    .d-plate{fill:var(--s3);stroke:var(--brand);stroke-width:1.6;opacity:.9}
    .d-btn,.d-btn-sm,.d-step{fill:var(--s3);stroke:var(--muted);stroke-width:1.3}
    .d-btn-good{fill:color-mix(in srgb,var(--good) 22%,transparent);stroke:var(--good)}
    .d-btn-bad{fill:color-mix(in srgb,var(--bad) 22%,transparent);stroke:var(--bad)}
    .d-btn-info{fill:color-mix(in srgb,var(--info) 22%,transparent);stroke:var(--info)}
    .d-btn-warn{fill:color-mix(in srgb,var(--warn) 22%,transparent);stroke:var(--warn)}
    .d-btn-letter{fill:var(--ink);font:700 12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-guide{fill:var(--s3);stroke:var(--muted);stroke-width:1.4}
    .d-guide-ring{fill:none;stroke:var(--line);stroke-width:1.2}
    .d-window{fill:var(--inset);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .d-gear{fill:var(--s3);stroke:var(--brand);stroke-width:1.4}
    .d-fence{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-glide-ring{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.7}
    .d-lit{fill:color-mix(in srgb,var(--brand) 26%,transparent);stroke:none;opacity:.55}
    .d-lit-good{fill:color-mix(in srgb,var(--good) 26%,transparent)}
    .d-lit-bad{fill:color-mix(in srgb,var(--bad) 26%,transparent)}
    .d-lit-info{fill:color-mix(in srgb,var(--info) 26%,transparent)}
    .d-lit-warn{fill:color-mix(in srgb,var(--warn) 26%,transparent)}
    .d-ring,.d-accent-ring{fill:none;stroke:var(--line);stroke-width:1.4}
    .d-accent-ring{stroke:var(--brand)}
    .d-swap-ring{fill:none;stroke:var(--brand);stroke-width:1.4;stroke-dasharray:5 4}
    .d-seam{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5}
    .d-rgb{fill:none;stroke:var(--brand);stroke-width:3.4;stroke-linecap:round;opacity:.75}
    .d-texture{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
    .d-ink{fill:none;stroke:var(--muted);stroke-width:1.6}
    .d-ink-thick{fill:none;stroke:var(--muted);stroke-width:3.4;stroke-linecap:round}
    .d-leader,.d-dim-stroke{fill:none;stroke:var(--dim);stroke-width:1.1}
    .d-travel{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
    .d-accent-stroke{fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round}
    .d-good-stroke{fill:none;stroke:var(--good);stroke-width:1.8}
    .d-warn-stroke{fill:none;stroke:var(--warn);stroke-width:1.8}
    .d-accent-fill{fill:var(--brand);stroke:none}
    .d-good-fill{fill:var(--good);stroke:none}
    .d-warn-fill{fill:var(--warn);stroke:none}
    .d-bad-fill{fill:var(--bad);stroke:none}
    .d-half-fill{fill:var(--muted);stroke:none}
    .d-dim-fill{fill:var(--dim);stroke:none}
    .d-deadzone{fill:color-mix(in srgb,var(--info) 26%,transparent);stroke:var(--info);stroke-width:1.2}
    .d-antideadzone{fill:color-mix(in srgb,var(--brand) 20%,transparent);stroke:var(--brand);stroke-width:1.2}
    .d-absent{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 3}
    .d-slash,.d-slash-line{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round}
    .d-lane{fill:var(--inset);stroke:var(--line);stroke-width:1.2}
    .d-lane.on{fill:color-mix(in srgb,var(--good) 12%,transparent);stroke:var(--good)}
    .d-lane-icon{color:var(--muted)}
    .d-glyph{fill:var(--muted);stroke:none}
    .d-glyph-stroke{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}
    .d-label{fill:var(--muted);font:600 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-label-sm{font-size:9px}
    .d-label-xs{font-size:8px;fill:var(--dim)}
    .d-label-left{text-anchor:start}
    .d-title{fill:var(--ink);font:700 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em;text-transform:uppercase}
    .d-accent-text{fill:var(--brand)}
    .d-good-text{fill:var(--good)}
    .d-dim-text{fill:var(--dim)}
    .d-on-accent{fill:#fff}
  </style>
  <rect class="d-canvas" x="0" y="0" width="400" height="170"/>
  <g class="d-hot" data-part="lt" data-name="Left trigger (LT)" data-desc="Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect analog." tabindex="0" role="img" aria-label="Left trigger (LT). Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect analog."><title>Left trigger (LT)</title><path class="d-part" d="M 130.1 28.1 L 128.7 41.7 L 125.6 46.0 L 121.9 48.0 L 118.0 49.4 L 114.2 50.9 L 110.4 52.5 L 106.7 54.3 L 103.1 56.2 L 99.6 58.3 L 96.2 60.5 L 92.8 62.8 L 89.6 65.2 L 86.5 67.8 L 83.5 70.5 L 80.7 73.3 L 77.3 75.7 L 72.2 76.6 L 59.3 72.3 L 59.3 72.3 L 52.2 60.5 L 53.2 54.2 L 56.3 49.6 L 60.2 45.7 L 64.3 42.0 L 68.5 38.6 L 72.9 35.3 L 77.3 32.2 L 81.9 29.3 L 86.6 26.6 L 91.3 24.0 L 96.1 21.7 L 101.0 19.5 L 106.0 17.5 L 111.1 15.7 L 116.4 14.9 L 122.4 16.7 L 130.1 28.1 Z"/><text class="d-label" x="90.75125074598607" y="43.78226433583373">LT</text></g><g class="d-hot" data-part="rt" data-name="Right trigger (RT)" data-desc="Analog trigger, normally fire or accelerate." tabindex="0" role="img" aria-label="Right trigger (RT). Analog trigger, normally fire or accelerate."><title>Right trigger (RT)</title><path class="d-part" d="M 269.9 28.1 L 271.3 41.7 L 274.4 46.0 L 278.1 48.0 L 282.0 49.4 L 285.8 50.9 L 289.6 52.5 L 293.3 54.3 L 296.9 56.2 L 300.4 58.3 L 303.8 60.5 L 307.2 62.8 L 310.4 65.2 L 313.5 67.8 L 316.5 70.5 L 319.3 73.3 L 322.7 75.7 L 327.8 76.6 L 340.7 72.3 L 340.7 72.3 L 347.8 60.5 L 346.8 54.2 L 343.7 49.6 L 339.8 45.7 L 335.7 42.0 L 331.5 38.6 L 327.1 35.3 L 322.7 32.2 L 318.1 29.3 L 313.4 26.6 L 308.7 24.0 L 303.9 21.7 L 299.0 19.5 L 294.0 17.5 L 288.9 15.7 L 283.6 14.9 L 277.6 16.7 L 269.9 28.1 Z"/><text class="d-label" x="309.24874925401394" y="43.78226433583373">RT</text></g><path class="d-body" d="M 74.1 135.0 C 55.2 130.7 44.0 113.5 51.5 92.2 C 64.7 60.0 98.4 36.5 136.0 30.0 L 264.0 30.0 C 301.6 36.5 335.3 60.0 348.5 92.2 C 356.0 113.5 344.8 130.7 325.9 135.0 C 264.0 150.0 136.0 150.0 74.1 135.0 Z"/><g class="d-hot" data-part="lb" data-name="Left bumper (LB)" data-desc="Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere." tabindex="0" role="img" aria-label="Left bumper (LB). Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 158.4 65.0 L 153.0 55.2 L 147.6 52.6 L 142.2 52.0 L 136.8 52.0 L 135.9 52.4 L 131.7 53.4 L 127.4 54.6 L 123.2 56.0 L 119.0 57.5 L 114.9 59.3 L 110.9 61.2 L 107.0 63.2 L 103.2 65.5 L 99.6 67.9 L 96.0 70.4 L 93.1 73.6 L 91.6 78.2 L 95.7 87.9 L 95.7 87.9 L 104.9 92.7 L 108.9 92.6 L 111.7 91.1 L 114.3 89.3 L 116.9 87.6 L 119.7 85.9 L 122.6 84.4 L 125.6 83.0 L 128.6 81.7 L 131.8 80.5 L 134.9 79.5 L 138.2 78.6 L 141.1 77.9 L 136.8 78.0 L 142.2 78.0 L 147.6 77.4 L 153.0 74.8 L 158.4 65.0 Z"/><text class="d-label" x="123.83713322155802" y="69.61900544412535">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 241.6 65.0 L 247.0 55.2 L 252.4 52.6 L 257.8 52.0 L 263.2 52.0 L 264.1 52.4 L 268.3 53.4 L 272.6 54.6 L 276.8 56.0 L 281.0 57.5 L 285.1 59.3 L 289.1 61.2 L 293.0 63.2 L 296.8 65.5 L 300.4 67.9 L 304.0 70.4 L 306.9 73.6 L 308.4 78.2 L 304.3 87.9 L 304.3 87.9 L 295.1 92.7 L 291.1 92.6 L 288.3 91.1 L 285.7 89.3 L 283.1 87.6 L 280.3 85.9 L 277.4 84.4 L 274.4 83.0 L 271.4 81.7 L 268.2 80.5 L 265.1 79.5 L 261.8 78.6 L 258.9 77.9 L 263.2 78.0 L 257.8 78.0 L 252.4 77.4 L 247.0 74.8 L 241.6 65.0 Z"/><text class="d-label" x="276.162866778442" y="69.61900544412535">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and power. This model is wired-only, so the cable is the connection rather than a charging option." tabindex="0" role="img" aria-label="USB-C port. Data and power. This model is wired-only, so the cable is the connection rather than a charging option."><title>USB-C port</title><rect class="d-port" x="184" y="22" width="32" height="16" rx="8"/><rect class="d-part-inset" x="190" y="26" width="20" height="8" rx="4"/><text class="d-label d-label-xs" x="200" y="50">USB-C</text></g>
</svg>
