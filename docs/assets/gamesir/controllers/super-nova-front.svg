e the left trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 154.0 50.1 L 149.5 61.2 L 145.0 62.6 L 140.6 62.9 L 136.1 63.3 L 131.7 63.8 L 127.4 64.5 L 123.1 65.3 L 118.8 66.2 L 114.6 67.4 L 110.5 68.7 L 106.5 70.2 L 102.5 71.8 L 98.6 73.7 L 94.8 75.7 L 91.1 77.9 L 87.6 80.2 L 83.3 81.7 L 72.8 76.1 L 72.8 76.1 L 69.7 64.3 L 73.4 60.0 L 78.0 57.0 L 82.7 54.1 L 87.5 51.6 L 92.5 49.2 L 97.5 47.2 L 102.6 45.3 L 107.7 43.7 L 112.9 42.3 L 118.1 41.1 L 123.3 40.1 L 128.5 39.3 L 133.6 38.7 L 138.8 38.3 L 143.9 38.0 L 149.0 39.1 L 154.0 50.1 Z"/><text class="d-label d-label-sm" x="111.17187084403433" y="55.52701895037407">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 246.0 50.1 L 250.5 61.2 L 255.0 62.6 L 259.4 62.9 L 263.9 63.3 L 268.3 63.8 L 272.6 64.5 L 276.9 65.3 L 281.2 66.2 L 285.4 67.4 L 289.5 68.7 L 293.5 70.2 L 297.5 71.8 L 301.4 73.7 L 305.2 75.7 L 308.9 77.9 L 312.4 80.2 L 316.7 81.7 L 327.2 76.1 L 327.2 76.1 L 330.3 64.3 L 326.6 60.0 L 322.0 57.0 L 317.3 54.1 L 312.5 51.6 L 307.5 49.2 L 302.5 47.2 L 297.4 45.3 L 292.3 43.7 L 287.1 42.3 L 281.9 41.1 L 276.7 40.1 L 271.5 39.3 L 266.4 38.7 L 261.2 38.3 L 256.1 38.0 L 251.0 39.1 L 246.0 50.1 Z"/><text class="d-label d-label-sm" x="288.8281291559657" y="55.52701895037407">RB</text></g><g class="d-hot" data-part="ls" data-name="Left stick" data-desc="Movement axis, and a digital click (LS/L3) when pressed. Sensor: Hall Effect." tabindex="0" role="img" aria-label="Left stick. Movement axis, and a digital click (LS/L3) when pressed. Sensor: Hall Effect."><title>Left stick</title><circle class="d-recess" cx="114.97999999999999" cy="