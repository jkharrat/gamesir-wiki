8640777 H 133.70687378640778 Z"/><circle class="d-part-inset" cx="143.216" cy="177.052" r="7.347961165048544"/><g class="d-glyph d-glyph-stroke"><path d="M143.216 161.712l-3.13 4.11h6.26zM143.216 192.392l-3.13 -4.11h6.26zM127.876 177.052l4.11 -3.13v6.26zM158.556 177.052l-4.11 -3.13v6.26z"/></g></g><g class="d-hot" data-part="rs" data-name="Right stick" data-desc="Camera and aim axis, with a click (RS/R3). Same sensor assembly as the left stick. Measured centre error on one tested unit: 0.0-2.3% left / 0.0-2.7% right across four test runs — this varies from unit to unit." tabindex="0" role="img" aria-label="Right stick. Camera and aim axis, with a click (RS/R3). Same sensor assembly as the left stick. Measured centre error on one tested unit: 0.0-2.3% left / 0.0-2.7% right across four test runs — this varies from unit to unit."><title>Right stick</title><circle class="d-recess" cx="254.912" cy="179.172" r="28.815533980582522"/><circle class="d-glide-ring" cx="254.912" cy="179.172" r="24.315533980582522"/><circle class="d-part" cx="254.912" cy="179.172" r="19.815533980582522"/><circle class="d-part-inset" cx="254.912" cy="179.172" r="11.815533980582522"/><text class="d-label d-label-sm" x="254.912" y="179.672">RS</text></g><g class="d-hot" data-part="view" data-name="View / Minus" data-desc="Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use." tabindex="0" role="img" aria-label="View / Minus. Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use."><title>View / Minus</title><circle class="d-btn-sm" cx="160.22" cy="104.548" r="10.805825242718447"/><g class="d-glyph d-glyph-stroke"><path d="M155.72 104.548h9"/></g></g><g class="d-hot" data-part="menu" data-name="Menu / Plus" data-desc="Pause and start. Held with View and the guide button i