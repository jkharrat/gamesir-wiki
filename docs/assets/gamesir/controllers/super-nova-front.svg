hout any software running."><title>M (Mode) button</title><circle class="d-btn-sm" cx="200" cy="147.16" r="9.776699029126213"/><text class="d-label d-label-xs" x="200" y="147.56">M</text></g><g class="d-hot" data-part="faceSwap" data-name="Detachable face buttons" data-desc="The ABXY caps pull off so the cluster can be rearranged by hand between the Xbox and Nintendo layouts. Swapping the reported values is a separate firmware toggle." tabindex="0" role="img" aria-label="Detachable face buttons. The ABXY caps pull off so the cluster can be rearranged by hand between the Xbox and Nintendo layouts. Swapping the reported values is a separate firmware toggle."><title>Detachable face buttons</title><circle class="d-swap-ring" cx="290.792" cy="117.47999999999999" r="43.22330097087379"/></g><g class="d-hot" data-part="rgb" data-name="RGB lighting" data-desc="Thin RGB strips on the front." tabindex="0" role="img" aria-label="RGB lighting. Thin RGB strips on the front."><title>RGB lighting</title><path class="d-rgb" d="M 55.5 167.1 L 56.0 171.2 L 56.6 175.2 L 57.3 179.3 L 58.1 183.3 L 59.0 187.3 L 59.9 191.3 L 61.0 195.2 L 62.2 199.1 L 63.5 202.9 L 64.9 206.7 L 66.4 210.5 L 68.0 214.1 L 69.8 217.7 L 71.6 221.2 L 73.6 224.6 L 75.7 227.9 L 78.0 231.1 L 80.3 234.1"/><path class="d-rgb" d="M 344.5 167.1 L 344.0 171.2 L 343.4 175.2 L 342.7 179.3 L 341.9 183.3 L 341.0 187.3 L 340.1 191.3 L 339.0 195.2 L 337.8 199.1 L 336.5 202.9 L 335.1 206.7 L 333.6 210.5 L 332.0 214.1 L 330.2 217.7 L 328.4 221.2 L 326.4 224.6 L 324.3 227.9 L 322.0 231.1 L 319.7 234.1"/></g>
