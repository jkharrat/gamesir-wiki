 trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 154.0 47.0 L 149.4 57.2 L 144.9 59.9 L 140.4 60.8 L 135.9 61.2 L 131.5 61.8 L 127.1 62.4 L 122.7 63.2 L 118.3 64.2 L 114.1 65.4 L 109.9 66.7 L 105.7 68.3 L 101.6 69.9 L 97.7 71.8 L 93.8 73.9 L 90.0 76.1 L 86.0 78.0 L 80.9 78.6 L 70.7 73.8 L 70.7 73.8 L 68.4 62.6 L 71.4 57.2 L 75.8 53.5 L 80.7 50.5 L 85.7 47.9 L 90.8 45.5 L 96.0 43.3 L 101.2 41.4 L 106.5 39.7 L 111.9 38.3 L 117.2 37.1 L 122.6 36.0 L 127.9 35.2 L 133.2 34.6 L 138.5 34.2 L 143.8 34.5 L 149.0 36.9 L 154.0 47.0 Z"/><text class="d-label d-label-sm" x="110.30302846870013" y="52.56457923216102">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 246.0 47.0 L 250.6 57.2 L 255.1 59.9 L 259.6 60.8 L 264.1 61.2 L 268.5 61.8 L 272.9 62.4 L 277.3 63.2 L 281.7 64.2 L 285.9 65.4 L 290.1 66.7 L 294.3 68.3 L 298.4 69.9 L 302.3 71.8 L 306.2 73.9 L 310.0 76.1 L 314.0 78.0 L 319.1 78.6 L 329.3 73.8 L 329.3 73.8 L 331.6 62.6 L 328.6 57.2 L 324.2 53.5 L 319.3 50.5 L 314.3 47.9 L 309.2 45.5 L 304.0 43.3 L 298.8 41.4 L 293.5 39.7 L 288.1 38.3 L 282.8 37.1 L 277.4 36.0 L 272.1 35.2 L 266.8 34.6 L 261.5 34.2 L 256.2 34.5 L 251.0 36.9 L 246.0 47.0 Z"/><text class="d-label d-label-sm" x="289.6969715312999" y="52.56457923216102">RB</text></g><g class="d-hot" data-part="ls" data-name="Left stick" data-desc="Movement axis, and a digital click (LS/L3) when pressed. Sensor: Hall Effect." tabindex="0" role="img" aria-label="Left stick. Movement axis, and a digital click (LS/L3) when pressed. Sensor: Hall Effect."><title>Left stick</title><circle class="d-recess" cx="114.97999999999999" cy="117.479999