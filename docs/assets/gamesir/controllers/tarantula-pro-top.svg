<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="900" height="383" role="img" aria-label="GameSir Tarantula Pro — top edge layout schematic">
  <title>GameSir Tarantula Pro — top edge layout schematic</title>
  <desc>Original schematic diagram from the community-maintained GameSir Wiki. Not GameSir product photography.</desc>

  <style>
    :root { color-scheme: dark light; }
    svg { --ink:#f2f3f5; --muted:#a6aab3; --dim:#71757e; --line:#34343e;
          --s1:#121216; --s2:#17171d; --s3:#1e1e25; --inset:#0e0e12;
          --brand:#e5343c; --good:#35d07f; --warn:#ffc247; --bad:#ff6b6b; --info:#64a8ff; }
    @media (prefers-color-scheme: light) {
      svg { --ink:#16171a; --muted:#585d66; --dim:#80858d; --line:#cdced5;
            --s1:#fff; --s2:#fbfbfc; --s3:#f1f1f4; --inset:#f4f4f7;
            --brand:#d6272e; --good:#0f7a44; --warn:#8a5a00; --bad:#c02626; --info:#175fd0; }
    }
  </style>
  <style>
    .d-canvas{fill:var(--s1)}
    .d-body{fill:var(--s2);stroke:var(--line);stroke-width:2}
    .d-panel{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
    .d-part{fill:var(--s3);stroke:var(--line);stroke-width:1.4}
    .d-part-2{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-part-inset{fill:var(--inset);stroke:var(--line);stroke-width:1}
    .d-recess{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-port{fill:var(--inset);stroke:var(--muted);stroke-width:1.4}
    .d-plate{fill:var(--s3);stroke:var(--brand);stroke-width:1.6;opacity:.9}
    .d-btn,.d-btn-sm,.d-step{fill:var(--s3);stroke:var(--muted);stroke-width:1.3}
    .d-btn-good{fill:color-mix(in srgb,var(--good) 22%,transparent);stroke:var(--good)}
    .d-btn-bad{fill:color-mix(in srgb,var(--bad) 22%,transparent);stroke:var(--bad)}
    .d-btn-info{fill:color-mix(in srgb,var(--info) 22%,transparent);stroke:var(--info)}
    .d-btn-warn{fill:color-mix(in srgb,var(--warn) 22%,transparent);stroke:var(--warn)}
    .d-btn-letter{fill:var(--ink);font:700 12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-guide{fill:var(--s3);stroke:var(--muted);stroke-width:1.4}
    .d-guide-ring{fill:none;stroke:var(--line);stroke-width:1.2}
    .d-window{fill:var(--inset);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .d-gear{fill:var(--s3);stroke:var(--brand);stroke-width:1.4}
    .d-fence{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-glide-ring{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.7}
    .d-lit{fill:color-mix(in srgb,var(--brand) 26%,transparent);stroke:none;opacity:.55}
    .d-lit-good{fill:color-mix(in srgb,var(--good) 26%,transparent)}
    .d-lit-bad{fill:color-mix(in srgb,var(--bad) 26%,transparent)}
    .d-lit-info{fill:color-mix(in srgb,var(--info) 26%,transparent)}
    .d-lit-warn{fill:color-mix(in srgb,var(--warn) 26%,transparent)}
    .d-ring,.d-accent-ring{fill:none;stroke:var(--line);stroke-width:1.4}
    .d-accent-ring{stroke:var(--brand)}
    .d-swap-ring{fill:none;stroke:var(--brand);stroke-width:1.4;stroke-dasharray:5 4}
    .d-seam{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5}
    .d-rgb{fill:none;stroke:var(--brand);stroke-width:3.4;stroke-linecap:round;opacity:.75}
    .d-texture{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
    .d-ink{fill:none;stroke:var(--muted);stroke-width:1.6}
    .d-ink-thick{fill:none;stroke:var(--muted);stroke-width:3.4;stroke-linecap:round}
    .d-leader,.d-dim-stroke{fill:none;stroke:var(--dim);stroke-width:1.1}
    .d-travel{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
    .d-accent-stroke{fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round}
    .d-good-stroke{fill:none;stroke:var(--good);stroke-width:1.8}
    .d-warn-stroke{fill:none;stroke:var(--warn);stroke-width:1.8}
    .d-accent-fill{fill:var(--brand);stroke:none}
    .d-good-fill{fill:var(--good);stroke:none}
    .d-warn-fill{fill:var(--warn);stroke:none}
    .d-bad-fill{fill:var(--bad);stroke:none}
    .d-half-fill{fill:var(--muted);stroke:none}
    .d-dim-fill{fill:var(--dim);stroke:none}
    .d-deadzone{fill:color-mix(in srgb,var(--info) 26%,transparent);stroke:var(--info);stroke-width:1.2}
    .d-antideadzone{fill:color-mix(in srgb,var(--brand) 20%,transparent);stroke:var(--brand);stroke-width:1.2}
    .d-absent{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 3}
    .d-slash,.d-slash-line{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round}
    .d-lane{fill:var(--inset);stroke:var(--line);stroke-width:1.2}
    .d-lane.on{fill:color-mix(in srgb,var(--good) 12%,transparent);stroke:var(--good)}
    .d-lane-icon{color:var(--muted)}
    .d-glyph{fill:var(--muted);stroke:none}
    .d-glyph-stroke{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}
    .d-label{fill:var(--muted);font:600 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-label-sm{font-size:9px}
    .d-label-xs{font-size:8px;fill:var(--dim)}
    .d-label-left{text-anchor:start}
    .d-title{fill:var(--ink);font:700 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em;text-transform:uppercase}
    .d-accent-text{fill:var(--brand)}
    .d-good-text{fill:var(--good)}
    .d-dim-text{fill:var(--dim)}
    .d-on-accent{fill:#fff}
  </style>
  <rect class="d-canvas" x="0" y="0" width="400" height="170"/>
  <g class="d-hot" data-part="lt" data-name="Left trigger (LT)" data-desc="Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + microswitch." tabindex="0" role="img" aria-label="Left trigger (LT). Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + microswitch."><title>Left trigger (LT)</title><path class="d-part" d="M 129.2 28.1 L 127.7 41.7 L 124.5 46.0 L 120.8 48.1 L 116.8 49.5 L 113.0 51.0 L 109.2 52.7 L 105.4 54.5 L 101.8 56.5 L 98.2 58.6 L 94.7 60.8 L 91.3 63.2 L 88.1 65.7 L 84.9 68.3 L 81.9 71.0 L 79.0 73.9 L 75.6 76.3 L 70.4 77.3 L 57.5 73.1 L 57.5 73.1 L 50.4 61.2 L 51.4 54.8 L 54.6 50.2 L 58.6 46.3 L 62.7 42.6 L 66.9 39.0 L 71.3 35.7 L 75.8 32.6 L 80.4 29.6 L 85.1 26.8 L 89.9 24.3 L 94.8 21.9 L 99.8 19.7 L 104.8 17.7 L 109.9 15.9 L 115.3 15.0 L 121.3 16.8 L 129.2 28.1 Z"/><text class="d-label" x="89.29930752326418" y="44.09790689133173">LT</text></g><g class="d-hot" data-part="rt" data-name="Right trigger (RT)" data-desc="Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click." tabindex="0" role="img" aria-label="Right trigger (RT). Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click."><title>Right trigger (RT)</title><path class="d-part" d="M 270.8 28.1 L 272.3 41.7 L 275.5 46.0 L 279.2 48.1 L 283.2 49.5 L 287.0 51.0 L 290.8 52.7 L 294.6 54.5 L 298.2 56.5 L 301.8 58.6 L 305.3 60.8 L 308.7 63.2 L 311.9 65.7 L 315.1 68.3 L 318.1 71.0 L 321.0 73.9 L 324.4 76.3 L 329.6 77.3 L 342.5 73.1 L 342.5 73.1 L 349.6 61.2 L 348.6 54.8 L 345.4 50.2 L 341.4 46.3 L 337.3 42.6 L 333.1 39.0 L 328.7 35.7 L 324.2 32.6 L 319.6 29.6 L 314.9 26.8 L 310.1 24.3 L 305.2 21.9 L 300.2 19.7 L 295.2 17.7 L 290.1 15.9 L 284.7 15.0 L 278.7 16.8 L 270.8 28.1 Z"/><text class="d-label" x="310.7006924767358" y="44.09790689133173">RT</text></g><path class="d-body" d="M 72.5 136.8 C 53.4 132.4 42.0 114.9 49.6 93.2 C 63.0 60.5 97.1 36.6 135.2 30.0 L 264.8 30.0 C 302.9 36.6 337.0 60.5 350.4 93.2 C 358.0 114.9 346.6 132.4 327.5 136.8 C 264.8 152.0 135.2 152.0 72.5 136.8 Z"/><g class="d-hot" data-part="lb" data-name="Left bumper (LB)" data-desc="Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere." tabindex="0" role="img" aria-label="Left bumper (LB). Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 157.8 65.0 L 152.4 55.2 L 146.9 52.6 L 141.4 52.0 L 136.0 52.0 L 135.1 52.4 L 130.7 53.5 L 126.4 54.7 L 122.1 56.1 L 117.9 57.7 L 113.7 59.4 L 109.6 61.4 L 105.7 63.5 L 101.8 65.8 L 98.1 68.2 L 94.5 70.8 L 91.5 74.0 L 90.0 78.7 L 94.1 88.5 L 94.1 88.5 L 103.4 93.1 L 107.4 93.0 L 110.3 91.5 L 112.9 89.6 L 115.6 87.8 L 118.4 86.1 L 121.4 84.6 L 124.4 83.1 L 127.5 81.8 L 130.7 80.6 L 133.9 79.6 L 137.2 78.6 L 140.3 77.9 L 136.0 78.0 L 141.4 78.0 L 146.9 77.4 L 152.4 74.8 L 157.8 65.0 Z"/><text class="d-label" x="122.68774715122184" y="69.74015740183341">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 242.2 65.0 L 247.6 55.2 L 253.1 52.6 L 258.6 52.0 L 264.0 52.0 L 264.9 52.4 L 269.3 53.5 L 273.6 54.7 L 277.9 56.1 L 282.1 57.7 L 286.3 59.4 L 290.4 61.4 L 294.3 63.5 L 298.2 65.8 L 301.9 68.2 L 305.5 70.8 L 308.5 74.0 L 310.0 78.7 L 305.9 88.5 L 305.9 88.5 L 296.6 93.1 L 292.6 93.0 L 289.7 91.5 L 287.1 89.6 L 284.4 87.8 L 281.6 86.1 L 278.6 84.6 L 275.6 83.1 L 272.5 81.8 L 269.3 80.6 L 266.1 79.6 L 262.8 78.6 L 259.7 77.9 L 264.0 78.0 L 258.6 78.0 L 253.1 77.4 L 247.6 74.8 L 242.2 65.0 Z"/><text class="d-label" x="277.31225284877814" y="69.74015740183341">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely." tabindex="0" role="img" aria-label="USB-C port. Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely."><title>USB-C port</title><rect class="d-port" x="184" y="22" width="32" height="16" rx="8"/><rect class="d-part-inset" x="190" y="26" width="20" height="8" rx="4"/><text class="d-label d-label-xs" x="200" y="50">USB-C</text></g>
</svg>
