<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="900" height="383" role="img" aria-label="GameSir Tarantula Pro — top edge layout schematic">
  <title>GameSir Tarantula Pro — top edge layout schematic</title>
  <desc>Original schematic diagram from the community-maintained GameSir Wiki. Not GameSir product photography.</desc>

  <style>
    :root { color-scheme: dark light; }
    svg { --ink:#f2f3f5; --muted:#a6aab3; --dim:#71757e; --line:#34343e;
          --s1:#121216; --s2:#17171d; --s3:#1e1e25; --inset:#0e0e12;
          --brand:#e5343c; --good:#35d07f; --warn:#ffc247; --bad:#ff6b6b; --info:#64a8ff; }
    @media (prefers-color-scheme: light) {
      svg { --ink:#16171a; --muted:#585d66; --dim:#80858d; --line:#cdced5;
            --s1:#fff; --s2:#fbfbfc; --s3:#f1f1f4; --inset:#f4f4f7;
            --brand:#d6272e; --good:#0f7a44; --warn:#8a5a00; --bad:#c02626; --info:#175fd0; }
    }
  </style>
  <style>
    .d-canvas{fill:var(--s1)}
    .d-body{fill:var(--s2);stroke:var(--line);stroke-width:2}
    .d-panel{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
    .d-part{fill:var(--s3);stroke:var(--line);stroke-width:1.4}
    .d-part-2{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-part-inset{fill:var(--inset);stroke:var(--line);stroke-width:1}
    .d-recess{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-port{fill:var(--inset);stroke:var(--muted);stroke-width:1.4}
    .d-plate{fill:var(--s3);stroke:var(--brand);stroke-width:1.6;opacity:.9}
    .d-btn,.d-btn-sm,.d-step{fill:var(--s3);stroke:var(--muted);stroke-width:1.3}
    .d-btn-good{fill:color-mix(in srgb,var(--good) 22%,transparent);stroke:var(--good)}
    .d-btn-bad{fill:color-mix(in srgb,var(--bad) 22%,transparent);stroke:var(--bad)}
    .d-btn-info{fill:color-mix(in srgb,var(--info) 22%,transparent);stroke:var(--info)}
    .d-btn-warn{fill:color-mix(in srgb,var(--warn) 22%,transparent);stroke:var(--warn)}
    .d-btn-letter{fill:var(--ink);font:700 12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-guide{fill:var(--s3);stroke:var(--muted);stroke-width:1.4}
    .d-guide-ring{fill:none;stroke:var(--line);stroke-width:1.2}
    .d-window{fill:var(--inset);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .d-gear{fill:var(--s3);stroke:var(--brand);stroke-width:1.4}
    .d-fence{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-glide-ring{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.7}
    .d-lit{fill:color-mix(in srgb,var(--brand) 26%,transparent);stroke:none;opacity:.55}
    .d-lit-good{fill:color-mix(in srgb,var(--good) 26%,transparent)}
    .d-lit-bad{fill:color-mix(in srgb,var(--bad) 26%,transparent)}
    .d-lit-info{fill:color-mix(in srgb,var(--info) 26%,transparent)}
    .d-lit-warn{fill:color-mix(in srgb,var(--warn) 26%,transparent)}
    .d-ring,.d-accent-ring{fill:none;stroke:var(--line);stroke-width:1.4}
    .d-accent-ring{stroke:var(--brand)}
    .d-swap-ring{fill:none;stroke:var(--brand);stroke-width:1.4;stroke-dasharray:5 4}
    .d-seam{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5}
    .d-rgb{fill:none;stroke:var(--brand);stroke-width:3.4;stroke-linecap:round;opacity:.75}
    .d-texture{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
    .d-ink{fill:none;stroke:var(--muted);stroke-width:1.6}
    .d-ink-thick{fill:none;stroke:var(--muted);stroke-width:3.4;stroke-linecap:round}
    .d-leader,.d-dim-stroke{fill:none;stroke:var(--dim);stroke-width:1.1}
    .d-travel{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
    .d-accent-stroke{fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round}
    .d-good-stroke{fill:none;stroke:var(--good);stroke-width:1.8}
    .d-warn-stroke{fill:none;stroke:var(--warn);stroke-width:1.8}
    .d-accent-fill{fill:var(--brand);stroke:none}
    .d-good-fill{fill:var(--good);stroke:none}
    .d-warn-fill{fill:var(--warn);stroke:none}
    .d-bad-fill{fill:var(--bad);stroke:none}
    .d-half-fill{fill:var(--muted);stroke:none}
    .d-dim-fill{fill:var(--dim);stroke:none}
    .d-deadzone{fill:color-mix(in srgb,var(--info) 26%,transparent);stroke:var(--info);stroke-width:1.2}
    .d-antideadzone{fill:color-mix(in srgb,var(--brand) 20%,transparent);stroke:var(--brand);stroke-width:1.2}
    .d-absent{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 3}
    .d-slash,.d-slash-line{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round}
    .d-lane{fill:var(--inset);stroke:var(--line);stroke-width:1.2}
    .d-lane.on{fill:color-mix(in srgb,var(--good) 12%,transparent);stroke:var(--good)}
    .d-lane-icon{color:var(--muted)}
    .d-glyph{fill:var(--muted);stroke:none}
    .d-glyph-stroke{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}
    .d-label{fill:var(--muted);font:600 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-label-sm{font-size:9px}
    .d-label-xs{font-size:8px;fill:var(--dim)}
    .d-label-left{text-anchor:start}
    .d-title{fill:var(--ink);font:700 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em;text-transform:uppercase}
    .d-accent-text{fill:var(--brand)}
    .d-good-text{fill:var(--good)}
    .d-dim-text{fill:var(--dim)}
    .d-on-accent{fill:#fff}
    .s-body{fill:none;stroke:var(--dim);stroke-width:3;opacity:.5}
    .s-shoulder{fill:none;stroke:var(--dim);stroke-width:3;opacity:.32}
    .s-ring,.s-part{fill:none;stroke:var(--dim);stroke-width:2.6;opacity:.42}
  </style>
  <rect class="d-canvas" x="0" y="0" width="400" height="170"/>
  <g class="d-hot" data-part="lt" data-name="Left trigger (LT)" data-desc="Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + microswitch." tabindex="0" role="img" aria-label="Left trigger (LT). Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + microswitch."><title>Left trigger (LT)</title><path class="d-part" d="M 147.3 28.0 L 142.2 45.9 L 137.1 48.0 L 134.6 48.3 L 131.4 49.2 L 127.2 50.3 L 123.0 51.6 L 118.9 53.0 L 114.8 54.6 L 110.8 56.3 L 106.9 58.2 L 103.1 60.3 L 99.4 62.5 L 95.8 64.9 L 92.4 67.4 L 89.0 70.1 L 85.8 72.8 L 81.3 74.3 L 65.1 65.3 L 65.1 65.3 L 56.0 48.9 L 58.9 43.2 L 63.5 39.3 L 68.3 35.5 L 73.2 32.0 L 78.2 28.6 L 83.3 25.6 L 88.6 22.7 L 94.0 20.1 L 99.4 17.7 L 105.0 15.5 L 110.6 13.5 L 116.3 11.8 L 122.0 10.3 L 129.1 8.9 L 137.1 8.0 L 142.2 10.1 L 147.3 28.0 Z"/><text class="d-label" x="97.33524411404943" y="27.32172856145199">LT</text></g><g class="d-hot" data-part="rt" data-name="Right trigger (RT)" data-desc="Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click." tabindex="0" role="img" aria-label="Right trigger (RT). Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click."><title>Right trigger (RT)</title><path class="d-part" d="M 252.7 28.0 L 257.8 45.9 L 262.9 48.0 L 265.4 48.3 L 268.6 49.2 L 272.8 50.3 L 277.0 51.6 L 281.1 53.0 L 285.2 54.6 L 289.2 56.3 L 293.1 58.2 L 296.9 60.3 L 300.6 62.5 L 304.2 64.9 L 307.6 67.4 L 311.0 70.1 L 314.2 72.8 L 318.7 74.3 L 334.9 65.3 L 334.9 65.3 L 344.0 48.9 L 341.1 43.2 L 336.5 39.3 L 331.7 35.5 L 326.8 32.0 L 321.8 28.6 L 316.7 25.6 L 311.4 22.7 L 306.0 20.1 L 300.6 17.7 L 295.0 15.5 L 289.4 13.5 L 283.7 11.8 L 278.0 10.3 L 270.9 8.9 L 262.9 8.0 L 257.8 10.1 L 252.7 28.0 Z"/><text class="d-label" x="302.66475588595057" y="27.32172856145199">RT</text></g><path class="d-body" d="M 72.5 136.8 C 53.4 132.4 42.0 114.9 49.6 93.2 C 63.0 60.5 97.1 36.6 135.2 30.0 L 264.8 30.0 C 302.9 36.6 337.0 60.5 350.4 93.2 C 358.0 114.9 346.6 132.4 327.5 136.8 C 264.8 152.0 135.2 152.0 72.5 136.8 Z"/><g class="d-hot" data-part="lb" data-name="Left bumper (LB)" data-desc="Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere." tabindex="0" role="img" aria-label="Left bumper (LB). Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 147.3 69.0 L 142.2 57.4 L 137.1 56.0 L 135.7 56.2 L 133.3 57.0 L 129.3 58.0 L 125.5 59.2 L 121.7 60.5 L 117.9 62.0 L 114.2 63.6 L 110.6 65.4 L 107.1 67.3 L 103.7 69.3 L 100.4 71.5 L 97.2 73.8 L 94.1 76.2 L 91.2 78.7 L 89.4 82.3 L 95.4 92.9 L 95.4 92.9 L 105.9 98.8 L 108.7 98.0 L 110.7 96.2 L 112.9 94.5 L 115.1 92.9 L 117.5 91.3 L 120.0 89.9 L 122.5 88.5 L 125.2 87.2 L 127.9 85.9 L 130.7 84.9 L 133.5 83.9 L 136.4 83.0 L 139.3 82.2 L 139.2 81.9 L 137.1 82.0 L 142.2 80.6 L 147.3 69.0 Z"/><text class="d-label" x="119.71035204008928" y="75.36629293695177">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 252.7 69.0 L 257.8 57.4 L 262.9 56.0 L 264.3 56.2 L 266.7 57.0 L 270.7 58.0 L 274.5 59.2 L 278.3 60.5 L 282.1 62.0 L 285.8 63.6 L 289.4 65.4 L 292.9 67.3 L 296.3 69.3 L 299.6 71.5 L 302.8 73.8 L 305.9 76.2 L 308.8 78.7 L 310.6 82.3 L 304.6 92.9 L 304.6 92.9 L 294.1 98.8 L 291.3 98.0 L 289.3 96.2 L 287.1 94.5 L 284.9 92.9 L 282.5 91.3 L 280.0 89.9 L 277.5 88.5 L 274.8 87.2 L 272.1 85.9 L 269.3 84.9 L 266.5 83.9 L 263.6 83.0 L 260.7 82.2 L 260.8 81.9 L 262.9 82.0 L 257.8 80.6 L 252.7 69.0 Z"/><text class="d-label" x="280.2896479599107" y="75.36629293695177">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely." tabindex="0" role="img" aria-label="USB-C port. Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely."><title>USB-C port</title><rect class="d-port" x="184" y="22" width="32" height="16" rx="8"/><rect class="d-part-inset" x="190" y="26" width="20" height="8" rx="4"/><text class="d-label d-label-xs" x="200" y="50">USB-C</text></g>
</svg>
