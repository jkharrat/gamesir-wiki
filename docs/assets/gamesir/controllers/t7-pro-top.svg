<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="900" height="383" role="img" aria-label="GameSir T7 Pro — top edge layout schematic">
  <title>GameSir T7 Pro — top edge layout schematic</title>
  <desc>Original schematic diagram from the community-maintained GameSir Wiki. Not GameSir product photography.</desc>

  <style>
    :root { color-scheme: dark light; }
    svg { --ink:#f2f3f5; --muted:#a6aab3; --dim:#71757e; --line:#34343e;
          --s1:#121216; --s2:#17171d; --s3:#1e1e25; --inset:#0e0e12;
          --brand:#e5343c; --good:#35d07f; --warn:#ffc247; --bad:#ff6b6b; --info:#64a8ff; }
    @media (prefers-color-scheme: light) {
      svg { --ink:#16171a; --muted:#585d66; --dim:#80858d; --line:#cdced5;
            --s1:#fff; --s2:#fbfbfc; --s3:#f1f1f4; --inset:#f4f4f7;
            --brand:#d6272e; --good:#0f7a44; --warn:#8a5a00; --bad:#c02626; --info:#175fd0; }
    }
  </style>
  <style>
    .d-canvas{fill:var(--s1)}
    .d-body{fill:var(--s2);stroke:var(--line);stroke-width:2}
    .d-panel{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
    .d-part{fill:var(--s3);stroke:var(--line);stroke-width:1.4}
    .d-part-2{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-part-inset{fill:var(--inset);stroke:var(--line);stroke-width:1}
    .d-recess{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-port{fill:var(--inset);stroke:var(--muted);stroke-width:1.4}
    .d-plate{fill:var(--s3);stroke:var(--brand);stroke-width:1.6;opacity:.9}
    .d-btn,.d-btn-sm,.d-step{fill:var(--s3);stroke:var(--muted);stroke-width:1.3}
    .d-btn-good{fill:color-mix(in srgb,var(--good) 22%,transparent);stroke:var(--good)}
    .d-btn-bad{fill:color-mix(in srgb,var(--bad) 22%,transparent);stroke:var(--bad)}
    .d-btn-info{fill:color-mix(in srgb,var(--info) 22%,transparent);stroke:var(--info)}
    .d-btn-warn{fill:color-mix(in srgb,var(--warn) 22%,transparent);stroke:var(--warn)}
    .d-btn-letter{fill:var(--ink);font:700 12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-guide{fill:var(--s3);stroke:var(--muted);stroke-width:1.4}
    .d-guide-ring{fill:none;stroke:var(--line);stroke-width:1.2}
    .d-window{fill:var(--inset);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .d-gear{fill:var(--s3);stroke:var(--brand);stroke-width:1.4}
    .d-fence{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-glide-ring{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.7}
    .d-lit{fill:color-mix(in srgb,var(--brand) 26%,transparent);stroke:none;opacity:.55}
    .d-lit-good{fill:color-mix(in srgb,var(--good) 26%,transparent)}
    .d-lit-bad{fill:color-mix(in srgb,var(--bad) 26%,transparent)}
    .d-lit-info{fill:color-mix(in srgb,var(--info) 26%,transparent)}
    .d-lit-warn{fill:color-mix(in srgb,var(--warn) 26%,transparent)}
    .d-ring,.d-accent-ring{fill:none;stroke:var(--line);stroke-width:1.4}
    .d-accent-ring{stroke:var(--brand)}
    .d-swap-ring{fill:none;stroke:var(--brand);stroke-width:1.4;stroke-dasharray:5 4}
    .d-seam{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5}
    .d-rgb{fill:none;stroke:var(--brand);stroke-width:3.4;stroke-linecap:round;opacity:.75}
    .d-texture{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
    .d-ink{fill:none;stroke:var(--muted);stroke-width:1.6}
    .d-ink-thick{fill:none;stroke:var(--muted);stroke-width:3.4;stroke-linecap:round}
    .d-leader,.d-dim-stroke{fill:none;stroke:var(--dim);stroke-width:1.1}
    .d-travel{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
    .d-accent-stroke{fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round}
    .d-good-stroke{fill:none;stroke:var(--good);stroke-width:1.8}
    .d-warn-stroke{fill:none;stroke:var(--warn);stroke-width:1.8}
    .d-accent-fill{fill:var(--brand);stroke:none}
    .d-good-fill{fill:var(--good);stroke:none}
    .d-warn-fill{fill:var(--warn);stroke:none}
    .d-bad-fill{fill:var(--bad);stroke:none}
    .d-half-fill{fill:var(--muted);stroke:none}
    .d-dim-fill{fill:var(--dim);stroke:none}
    .d-deadzone{fill:color-mix(in srgb,var(--info) 26%,transparent);stroke:var(--info);stroke-width:1.2}
    .d-antideadzone{fill:color-mix(in srgb,var(--brand) 20%,transparent);stroke:var(--brand);stroke-width:1.2}
    .d-absent{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 3}
    .d-slash,.d-slash-line{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round}
    .d-lane{fill:var(--inset);stroke:var(--line);stroke-width:1.2}
    .d-lane.on{fill:color-mix(in srgb,var(--good) 12%,transparent);stroke:var(--good)}
    .d-lane-icon{color:var(--muted)}
    .d-glyph{fill:var(--muted);stroke:none}
    .d-glyph-stroke{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}
    .d-label{fill:var(--muted);font:600 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-label-sm{font-size:9px}
    .d-label-xs{font-size:8px;fill:var(--dim)}
    .d-label-left{text-anchor:start}
    .d-title{fill:var(--ink);font:700 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em;text-transform:uppercase}
    .d-accent-text{fill:var(--brand)}
    .d-good-text{fill:var(--good)}
    .d-dim-text{fill:var(--dim)}
    .d-on-accent{fill:#fff}
    .s-body{fill:none;stroke:var(--dim);stroke-width:3;opacity:.5}
    .s-shoulder{fill:none;stroke:var(--dim);stroke-width:3;opacity:.32}
    .s-ring,.s-part{fill:none;stroke:var(--dim);stroke-width:2.6;opacity:.42}
  </style>
  <rect class="d-canvas" x="0" y="0" width="400" height="170"/>
  <g class="d-hot" data-part="lt" data-name="Left trigger (LT)" data-desc="Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + stops." tabindex="0" role="img" aria-label="Left trigger (LT). Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + stops."><title>Left trigger (LT)</title><path class="d-part" d="M 151.0 28.0 L 146.3 45.9 L 141.6 48.0 L 140.2 48.4 L 136.9 49.2 L 133.1 50.3 L 129.3 51.6 L 125.6 53.0 L 122.0 54.5 L 118.4 56.2 L 114.9 58.1 L 111.5 60.1 L 108.2 62.2 L 105.0 64.5 L 101.9 66.9 L 98.9 69.4 L 96.0 72.0 L 91.8 73.4 L 75.5 64.8 L 75.5 64.8 L 65.6 48.9 L 68.1 43.4 L 72.3 39.5 L 76.7 35.8 L 81.2 32.3 L 85.8 29.0 L 90.6 26.0 L 95.5 23.1 L 100.4 20.5 L 105.5 18.1 L 110.7 15.8 L 116.0 13.8 L 121.3 12.1 L 126.8 10.5 L 132.9 9.2 L 141.6 8.0 L 146.3 10.1 L 151.0 28.0 Z"/><text class="d-label" x="104.03527733078475" y="27.632644131498303">LT</text></g><g class="d-hot" data-part="rt" data-name="Right trigger (RT)" data-desc="Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click." tabindex="0" role="img" aria-label="Right trigger (RT). Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click."><title>Right trigger (RT)</title><path class="d-part" d="M 249.0 28.0 L 253.7 45.9 L 258.4 48.0 L 259.8 48.4 L 263.1 49.2 L 266.9 50.3 L 270.7 51.6 L 274.4 53.0 L 278.0 54.5 L 281.6 56.2 L 285.1 58.1 L 288.5 60.1 L 291.8 62.2 L 295.0 64.5 L 298.1 66.9 L 301.1 69.4 L 304.0 72.0 L 308.2 73.4 L 324.5 64.8 L 324.5 64.8 L 334.4 48.9 L 331.9 43.4 L 327.7 39.5 L 323.3 35.8 L 318.8 32.3 L 314.2 29.0 L 309.4 26.0 L 304.5 23.1 L 299.6 20.5 L 294.5 18.1 L 289.3 15.8 L 284.0 13.8 L 278.7 12.1 L 273.2 10.5 L 267.1 9.2 L 258.4 8.0 L 253.7 10.1 L 249.0 28.0 Z"/><text class="d-label" x="295.96472266921523" y="27.632644131498303">RT</text></g><path class="d-body" d="M 83.0 133.3 C 65.4 129.0 55.0 112.1 62.0 91.1 C 74.3 59.5 105.6 36.4 140.6 30.0 L 259.4 30.0 C 294.4 36.4 325.7 59.5 338.0 91.1 C 345.0 112.1 334.6 129.0 317.0 133.3 C 259.4 148.0 140.6 148.0 83.0 133.3 Z"/><g class="d-hot" data-part="lb" data-name="Left bumper (LB)" data-desc="Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere." tabindex="0" role="img" aria-label="Left bumper (LB). Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 151.0 69.0 L 146.3 57.4 L 141.6 56.0 L 141.7 56.2 L 138.9 57.0 L 135.4 58.0 L 132.0 59.1 L 128.6 60.4 L 125.3 61.8 L 122.0 63.4 L 118.8 65.1 L 115.7 66.9 L 112.6 68.8 L 109.7 70.9 L 106.9 73.1 L 104.2 75.4 L 101.6 77.8 L 100.2 81.2 L 106.8 91.2 L 106.8 91.2 L 117.2 97.1 L 119.8 96.4 L 121.5 94.8 L 123.3 93.3 L 125.2 91.8 L 127.2 90.4 L 129.3 89.1 L 131.4 87.8 L 133.6 86.6 L 135.9 85.5 L 138.3 84.5 L 140.7 83.6 L 143.1 82.8 L 145.5 82.1 L 146.4 81.7 L 141.6 82.0 L 146.3 80.6 L 151.0 69.0 Z"/><text class="d-label" x="127.80927553994236" y="74.99292613760923">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 249.0 69.0 L 253.7 57.4 L 258.4 56.0 L 258.3 56.2 L 261.1 57.0 L 264.6 58.0 L 268.0 59.1 L 271.4 60.4 L 274.7 61.8 L 278.0 63.4 L 281.2 65.1 L 284.3 66.9 L 287.4 68.8 L 290.3 70.9 L 293.1 73.1 L 295.8 75.4 L 298.4 77.8 L 299.8 81.2 L 293.2 91.2 L 293.2 91.2 L 282.8 97.1 L 280.2 96.4 L 278.5 94.8 L 276.7 93.3 L 274.8 91.8 L 272.8 90.4 L 270.7 89.1 L 268.6 87.8 L 266.4 86.6 L 264.1 85.5 L 261.7 84.5 L 259.3 83.6 L 256.9 82.8 L 254.5 82.1 L 253.6 81.7 L 258.4 82.0 L 253.7 80.6 L 249.0 69.0 Z"/><text class="d-label" x="272.1907244600576" y="74.99292613760923">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and power. This model is wired-only, so the cable is the connection rather than a charging option." tabindex="0" role="img" aria-label="USB-C port. Data and power. This model is wired-only, so the cable is the connection rather than a charging option."><title>USB-C port</title><rect class="d-port" x="184" y="22" width="32" height="16" rx="8"/><rect class="d-part-inset" x="190" y="26" width="20" height="8" rx="4"/><text class="d-label d-label-xs" x="200" y="50">USB-C</text></g>
</svg>
