<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="900" height="383" role="img" aria-label="GameSir T7 Pro — top edge layout schematic">
  <title>GameSir T7 Pro — top edge layout schematic</title>
  <desc>Original schematic diagram from the community-maintained GameSir Wiki. Not GameSir product photography.</desc>

  <style>
    :root { color-scheme: dark light; }
    svg { --ink:#f2f3f5; --muted:#a6aab3; --dim:#71757e; --line:#34343e;
          --s1:#121216; --s2:#17171d; --s3:#1e1e25; --inset:#0e0e12;
          --brand:#e5343c; --good:#35d07f; --warn:#ffc247; --bad:#ff6b6b; --info:#64a8ff; }
    @media (prefers-color-scheme: light) {
      svg { --ink:#16171a; --muted:#585d66; --dim:#80858d; --line:#cdced5;
            --s1:#fff; --s2:#fbfbfc; --s3:#f1f1f4; --inset:#f4f4f7;
            --brand:#d6272e; --good:#0f7a44; --warn:#8a5a00; --bad:#c02626; --info:#175fd0; }
    }
  </style>
  <style>
    .d-canvas{fill:var(--s1)}
    .d-body{fill:var(--s2);stroke:var(--line);stroke-width:2}
    .d-panel{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
    .d-part{fill:var(--s3);stroke:var(--line);stroke-width:1.4}
    .d-part-2{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-part-inset{fill:var(--inset);stroke:var(--line);stroke-width:1}
    .d-recess{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-port{fill:var(--inset);stroke:var(--muted);stroke-width:1.4}
    .d-plate{fill:var(--s3);stroke:var(--brand);stroke-width:1.6;opacity:.9}
    .d-btn,.d-btn-sm,.d-step{fill:var(--s3);stroke:var(--muted);stroke-width:1.3}
    .d-btn-good{fill:color-mix(in srgb,var(--good) 22%,transparent);stroke:var(--good)}
    .d-btn-bad{fill:color-mix(in srgb,var(--bad) 22%,transparent);stroke:var(--bad)}
    .d-btn-info{fill:color-mix(in srgb,var(--info) 22%,transparent);stroke:var(--info)}
    .d-btn-warn{fill:color-mix(in srgb,var(--warn) 22%,transparent);stroke:var(--warn)}
    .d-btn-letter{fill:var(--ink);font:700 12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-guide{fill:var(--s3);stroke:var(--muted);stroke-width:1.4}
    .d-guide-ring{fill:none;stroke:var(--line);stroke-width:1.2}
    .d-window{fill:var(--inset);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .d-gear{fill:var(--s3);stroke:var(--brand);stroke-width:1.4}
    .d-fence{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-glide-ring{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.7}
    .d-lit{fill:color-mix(in srgb,var(--brand) 26%,transparent);stroke:none;opacity:.55}
    .d-lit-good{fill:color-mix(in srgb,var(--good) 26%,transparent)}
    .d-lit-bad{fill:color-mix(in srgb,var(--bad) 26%,transparent)}
    .d-lit-info{fill:color-mix(in srgb,var(--info) 26%,transparent)}
    .d-lit-warn{fill:color-mix(in srgb,var(--warn) 26%,transparent)}
    .d-ring,.d-accent-ring{fill:none;stroke:var(--line);stroke-width:1.4}
    .d-accent-ring{stroke:var(--brand)}
    .d-swap-ring{fill:none;stroke:var(--brand);stroke-width:1.4;stroke-dasharray:5 4}
    .d-seam{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5}
    .d-rgb{fill:none;stroke:var(--brand);stroke-width:3.4;stroke-linecap:round;opacity:.75}
    .d-texture{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
    .d-ink{fill:none;stroke:var(--muted);stroke-width:1.6}
    .d-ink-thick{fill:none;stroke:var(--muted);stroke-width:3.4;stroke-linecap:round}
    .d-leader,.d-dim-stroke{fill:none;stroke:var(--dim);stroke-width:1.1}
    .d-travel{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
    .d-accent-stroke{fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round}
    .d-good-stroke{fill:none;stroke:var(--good);stroke-width:1.8}
    .d-warn-stroke{fill:none;stroke:var(--warn);stroke-width:1.8}
    .d-accent-fill{fill:var(--brand);stroke:none}
    .d-good-fill{fill:var(--good);stroke:none}
    .d-warn-fill{fill:var(--warn);stroke:none}
    .d-bad-fill{fill:var(--bad);stroke:none}
    .d-half-fill{fill:var(--muted);stroke:none}
    .d-dim-fill{fill:var(--dim);stroke:none}
    .d-deadzone{fill:color-mix(in srgb,var(--info) 26%,transparent);stroke:var(--info);stroke-width:1.2}
    .d-antideadzone{fill:color-mix(in srgb,var(--brand) 20%,transparent);stroke:var(--brand);stroke-width:1.2}
    .d-absent{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 3}
    .d-slash,.d-slash-line{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round}
    .d-lane{fill:var(--inset);stroke:var(--line);stroke-width:1.2}
    .d-lane.on{fill:color-mix(in srgb,var(--good) 12%,transparent);stroke:var(--good)}
    .d-lane-icon{color:var(--muted)}
    .d-glyph{fill:var(--muted);stroke:none}
    .d-glyph-stroke{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}
    .d-label{fill:var(--muted);font:600 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-label-sm{font-size:9px}
    .d-label-xs{font-size:8px;fill:var(--dim)}
    .d-label-left{text-anchor:start}
    .d-title{fill:var(--ink);font:700 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em;text-transform:uppercase}
    .d-accent-text{fill:var(--brand)}
    .d-good-text{fill:var(--good)}
    .d-dim-text{fill:var(--dim)}
    .d-on-accent{fill:#fff}
  </style>
  <rect class="d-canvas" x="0" y="0" width="400" height="170"/>
  <g class="d-hot" data-part="lt" data-name="Left trigger (LT)" data-desc="Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + stops." tabindex="0" role="img" aria-label="Left trigger (LT). Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + stops."><title>Left trigger (LT)</title><path class="d-part" d="M 134.1 28.3 L 133.2 41.8 L 130.5 46.1 L 127.1 48.1 L 123.5 49.5 L 120.0 51.0 L 116.6 52.7 L 113.2 54.4 L 109.9 56.3 L 106.7 58.4 L 103.6 60.5 L 100.6 62.8 L 97.6 65.2 L 94.8 67.7 L 92.1 70.3 L 89.6 73.0 L 86.5 75.3 L 81.5 76.2 L 68.6 72.2 L 68.6 72.2 L 61.0 60.8 L 61.6 54.7 L 64.4 50.2 L 68.0 46.4 L 71.7 42.7 L 75.6 39.3 L 79.6 36.0 L 83.8 32.9 L 88.0 30.0 L 92.4 27.2 L 96.8 24.7 L 101.3 22.3 L 106.0 20.1 L 110.7 18.0 L 115.5 16.2 L 120.6 15.3 L 126.3 17.0 L 134.1 28.3 Z"/><text class="d-label" x="97.35879030469522" y="44.169700819059294">LT</text></g><g class="d-hot" data-part="rt" data-name="Right trigger (RT)" data-desc="Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click." tabindex="0" role="img" aria-label="Right trigger (RT). Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click."><title>Right trigger (RT)</title><path class="d-part" d="M 265.9 28.3 L 266.8 41.8 L 269.5 46.1 L 272.9 48.1 L 276.5 49.5 L 280.0 51.0 L 283.4 52.7 L 286.8 54.4 L 290.1 56.3 L 293.3 58.4 L 296.4 60.5 L 299.4 62.8 L 302.4 65.2 L 305.2 67.7 L 307.9 70.3 L 310.4 73.0 L 313.5 75.3 L 318.5 76.2 L 331.4 72.2 L 331.4 72.2 L 339.0 60.8 L 338.4 54.7 L 335.6 50.2 L 332.0 46.4 L 328.3 42.7 L 324.4 39.3 L 320.4 36.0 L 316.2 32.9 L 312.0 30.0 L 307.6 27.2 L 303.2 24.7 L 298.7 22.3 L 294.0 20.1 L 289.3 18.0 L 284.5 16.2 L 279.4 15.3 L 273.7 17.0 L 265.9 28.3 Z"/><text class="d-label" x="302.6412096953048" y="44.169700819059294">RT</text></g><path class="d-body" d="M 83.0 133.3 C 65.4 129.0 55.0 112.1 62.0 91.1 C 74.3 59.5 105.6 36.4 140.6 30.0 L 259.4 30.0 C 294.4 36.4 325.7 59.5 338.0 91.1 C 345.0 112.1 334.6 129.0 317.0 133.3 C 259.4 148.0 140.6 148.0 83.0 133.3 Z"/><g class="d-hot" data-part="lb" data-name="Left bumper (LB)" data-desc="Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere." tabindex="0" role="img" aria-label="Left bumper (LB). Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 160.8 65.0 L 155.7 55.2 L 150.6 52.6 L 145.6 52.0 L 140.6 52.0 L 140.5 52.5 L 136.5 53.5 L 132.6 54.7 L 128.7 56.1 L 124.9 57.6 L 121.2 59.3 L 117.6 61.1 L 114.1 63.2 L 110.6 65.4 L 107.3 67.7 L 104.2 70.2 L 101.5 73.2 L 100.4 77.7 L 105.1 87.1 L 105.1 87.1 L 114.3 91.7 L 118.1 91.6 L 120.6 90.3 L 122.8 88.6 L 125.1 87.0 L 127.5 85.4 L 130.0 84.0 L 132.6 82.7 L 135.2 81.5 L 137.9 80.4 L 140.7 79.4 L 143.5 78.5 L 146.3 77.8 L 140.6 78.0 L 145.6 78.0 L 150.6 77.4 L 155.7 74.8 L 160.8 65.0 Z"/><text class="d-label" x="130.09347838108107" y="69.51745179555301">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 239.2 65.0 L 244.3 55.2 L 249.4 52.6 L 254.4 52.0 L 259.4 52.0 L 259.5 52.5 L 263.5 53.5 L 267.4 54.7 L 271.3 56.1 L 275.1 57.6 L 278.8 59.3 L 282.4 61.1 L 285.9 63.2 L 289.4 65.4 L 292.7 67.7 L 295.8 70.2 L 298.5 73.2 L 299.6 77.7 L 294.9 87.1 L 294.9 87.1 L 285.7 91.7 L 281.9 91.6 L 279.4 90.3 L 277.2 88.6 L 274.9 87.0 L 272.5 85.4 L 270.0 84.0 L 267.4 82.7 L 264.8 81.5 L 262.1 80.4 L 259.3 79.4 L 256.5 78.5 L 253.7 77.8 L 259.4 78.0 L 254.4 78.0 L 249.4 77.4 L 244.3 74.8 L 239.2 65.0 Z"/><text class="d-label" x="269.9065216189189" y="69.51745179555301">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and power. This model is wired-only, so the cable is the connection rather than a charging option." tabindex="0" role="img" aria-label="USB-C port. Data and power. This model is wired-only, so the cable is the connection rather than a charging option."><title>USB-C port</title><rect class="d-port" x="184" y="22" width="32" height="16" rx="8"/><rect class="d-part-inset" x="190" y="26" width="20" height="8" rx="4"/><text class="d-label d-label-xs" x="200" y="50">USB-C</text></g>
</svg>
