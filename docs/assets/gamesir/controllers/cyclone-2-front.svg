ody" d="M 200.0 56.0 C 179.3 56.0 154.6 52.1 128.1 56.0 C 101.7 59.9 77.1 71.7 60.1 95.1 C 46.8 114.9 42.1 138.4 44.9 161.9 C 47.7 191.3 58.2 222.9 78.9 242.4 C 95.9 258.1 118.7 262.0 135.7 250.3 C 149.0 241.4 154.6 228.6 158.3 209.1 C 161.3 202.7 167.9 194.8 181.1 193.0 C 187.7 192.0 194.4 192.0 200.0 192.0 C 205.6 192.0 212.3 192.0 218.9 193.0 C 232.1 194.8 238.7 202.7 241.7 209.1 C 245.4 228.6 251.0 241.4 264.3 250.3 C 281.3 262.0 304.1 258.1 321.1 242.4 C 341.8 222.9 352.3 191.3 355.1 161.9 C 357.9 138.4 353.2 114.9 339.9 95.1 C 322.9 71.7 298.3 59.9 271.9 56.0 C 245.4 52.1 220.7 56.0 200.0 56.0 Z"/><g class="d-hot" data-part="lb" data-name="Left bumper (LB)" data-desc="Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere." tabindex="0" role="img" aria-label="Left bumper (LB). Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 154.2 47.3 L 149.6 57.2 L 145.1 59.8 L 140.6 60.7 L 136.2 61.1 L 131.7 61.6 L 127.3 62.2 L 122.9 63.0 L 118.6 63.9 L 114.3 65.1 L 110.1 66.3 L 105.9 67.8 L 101.8 69.4 L 97.8 71.3 L 93.9 73.2 L 90.1 75.4 L 86.1 77.3 L 81.0 77.8 L 71.2 73.1 L 71.2 73.1 L 69.2 62.1 L 72.2 56.8 L 76.7 53.2 L 81.5 50.4 L 86.5 47.8 L 91.6 45.5 L 96.8 43.5 L 102.0 41.6 L 107.2 40.0 L 112.5 38.7 L 117.8 37.5 L 123.1 36.5 L 128.4 35.8 L 133.7 35.2 L 138.9 34.8 L 144.1 35.1 L 149.2 37.5 L 154.2 47.3 Z"/><text class="d-label d-label-sm" x="110.76969795806424" y="52.548897113886895">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 245.8 47.3 L 250.4 57.2 L 254.9 59.8 L 259.4 60.7 L 263.8 61.1 L 268.3 61.6 L 272.7 62.2 L 277.1 63.0 L 281.4 63.9 L 285.7 65.1 L 289.9 66.3 L 294.1 67.8 L 298.2 69.4 L 302.2 71.3 L 306.1 73.2 L 309.9 75.4 L 313.9 77.3 L 319.0 77.8 L 328.8 73.1 L 328.8 73.1 L 330.8 62.1 L 327.8 56.8 L 323.3 53.2 L 318.5 50.4 L 313.5 47.8 L 308.4 45.5 L 303.2 43.5 L 298.0 41.6 L 292.8 40.0 L 287.5 38.7 L 282.2 37.5 L 276.9 36.5 L 271.6 35.8 L 266.3 35.2 L 261.1 34.8 L 255.9 35.1 L 250.8 37.5 L 245.8 47.3 Z"/><text class="d-label d-label-sm" x="289.2303020419358" y="52.548897113886895">RB</text></g><g class="d-hot" data-part="ls" data-name="Left stick" data-desc="Movement axis, and a digital click (LS/L3) when pressed. Sensor: Mag-Res TMR." tabindex="0" role="img" aria-label="Left stick. Movement axis, and a digital click (LS/L3) when pressed. Sensor: Mag-Res TMR."><title>Left stick</title><circle class="d-recess" cx="114.97999999999999" cy="115.74" r="28"/><circle class="d-part" cx="114.97999999999999" cy="115.74" r="19"/><circle class="d-part-inset" cx="114.97999999999999" cy="115.74" r="11"/><text class="d-label d-label-sm" x="114.97999999999999" y="116.24">LS</text></g><g class="d-hot" data-part="face" data-name="ABXY face buttons" data-desc="The four primary action buttons. Micro-switch (esports-grade) ABXY rated to 5 million clicks, with light actuati…." tabindex="0" role="img" aria-label="ABXY face buttons. The four primary action buttons. Micro-switch (esports-grade) ABXY rated to 5 million clicks, with light actuati…."><title>ABXY face buttons</title><circle class="d-btn d-btn-warn" cx="290.792" cy="86.74" r="11.5"/><text class="d-btn-letter" x="290.792" y="87.24">Y</text><circle class="d-btn d-btn-bad" cx="319.792" cy="115.74" r="11.5"/><text class="d-btn-letter" x="319.792" y="116.24">B</text><circle class="d-btn d-btn-good" cx="290.792" cy="144.74" r="11.5"/><text class="d-btn-letter" x="290.792" y="145.24">A</text><circle class="d-btn d-btn-info" cx="261.792" cy="115.74" r="11.5"/><text class="d-btn-letter" x="261.792" y="116.24">X</text></g><g class="d-hot" data-part="dpad" data-name="D-pad" data-desc="Eight-way directional pad, used for menus and weapon or item wheels. Tactile switch." tabindex="0" role="img" aria-label="D-pad. Eight-way directional pad, used for menus and weapon or item wheels. Tactile switch."><title>D-pad</title><circle class="d-fence" cx="143.216" cy="173.62599999999998" r="27.3"/><rect class="d-part" x="136.286" y="158.296" width="13.860000000000001" height="13.02" rx="4.1664"/><rect class="d-part" x="145.526" y="166.69599999999997" width="13.02" height="13.860000000000001" rx="4.1664"/><rect class="d-part" x="136.286" y="175.93599999999998" width="13.860000000000001" height="13.02" rx="4.1664"/><rect class="d-part" x="127.88600000000001" y="166.69599999999997" width="13.02" height="13.860000000000001" rx="4.1664"/><circle class="d-part-inset" cx="143.216" cy="173.62599999999998" r="4.2"/><g class="d-glyph d-glyph-stroke"><path d="M143.216 158.71599999999998l-3.04 3.99h6.08zM143.216 188.53599999999997l-3.04 -3.99h6.08zM128.306 173.62599999999998l3.99 -3.04v6.08zM158.126 173.62599999999998l-3.99 -3.04v6.08z"/></g></g><g class="d-hot" data-part="rs" data-name="Right stick" data-desc="Camera and aim axis, with a click (RS/R3). Same sensor assembly as the left stick. Measured centre error: 3.5% left / 2.0% right (cable, XInput)." tabindex="0" role="img" aria-label="Right stick. Camera and aim axis, with a click (RS/R3). Same sensor assembly as the left stick. Measured centre error: 3.5% left / 2.0% right (cable, XInput)."><title>Right stick</title><circle class="d-recess" cx="254.912" cy="175.68599999999998" r="28"/><circle class="d-part" cx="254.912" cy="175.68599999999998" r="19"/><circle class="d-part-inset" cx="254.912" cy="175.68599999999998" r="11"/><text class="d-label d-label-sm" x="254.912" y="176.18599999999998">RS</text></g><g class="d-hot" data-part="view" data-name="View button" data-desc="Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use." tabindex="0" role="img" aria-label="View button. Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use."><title>View button</title><circle class="d-btn-sm" cx="160.22" cy="103.174" r="10.5"/><g class="d-glyph"><rect x="154.22" y="98.674" width="7.5" height="6" rx="1.2"/><rect x="158.72" y="101.674" width="7.5" height="6" rx="1.2"/></g></g><g class="d-hot" data-part="menu" data-name="Menu button" data-desc="Pause and start. Held with View and the guide button it enters the calibration and reset sequences documented on this page." tabindex="0" role="img" aria-label="Menu button. Pause and start. Held with View and the guide button it enters the calibration and reset sequences documented on this page."><title>Menu button</title><circle class="d-btn-sm" cx="239.78" cy="103.174" r="10.5"/><g class="d-glyph d-glyph-stroke"><path d="M234.78 99.674h10M234.78 103.174h10M234.78 106.674h10"/></g></g><g class="d-hot" data-part="guide" data-name="Home button" data-desc="Powers the controller and opens the connected platform's home screen. The surrounding indicator reports pairing and connection state." tabindex="0" role="img" aria-label="Home button. Powers the controller and opens the connected platform's home screen. The surrounding indicator reports pairing and connection state."><title>Home button</title><circle class="d-guide" cx="200" cy="81.544" r="16"/><circle class="d-guide-ring" cx="200" cy="81.544" r="11.5"/><circle class="d-accent-fill" cx="200" cy="81.544" r="4.6"/></g><g class="d-hot" data-part="profiles" data-name="Profile indicator" data-desc="4 illuminated segments showing which on-board profile is active. Profiles are stored in the controller, so they survive without the software running." tabindex="0" role="img" aria-label="Profile indicator. 4 illuminated segments showing which on-board profile is active. Profiles are stored in the controller, so they survive without the software running."><title>Profile indicator</title><rect class="d-part-inset" x="181" y="114.684" width="38" height="12" rx="6"/><rect class="d-accent-fill" x="185.5" y="117.684" width="4.5" height="6" rx="2.2"/><rect class="d-dim-fill" x="193" y="117.684" width="4.5" height="6" rx="2.2"/><rect class="d-dim-fill" x="200.5" y="117.684" width="4.5" height="6" rx="2.2"/><rect class="d-dim-fill" x="208" y="117.684" width="4.5" height="6" rx="2.2"/></g><g class="d-hot" data-part="mode" data-name="M (Mode) button" data-desc="The on-controller modifier. Held with another control it remaps the rear buttons, switches profile, toggles hair triggers and changes vibration strength without any software running." tabindex="0" role="img" aria-label="M (Mode) button. The on-controller modifier. Held with another control it remaps the rear buttons, switches profile, toggles hair triggers and changes vibration strength without any software running."><title>M (Mode) button</title><circle class="d-btn-sm" cx="200" cy="144.57999999999998" r="9.5"/><text class="d-label d-label-xs" x="200" y="144.98">M</text></g><g class="d-hot" data-part="rgb" data-name="RGB lighting" data-desc="RGB strip in each grip and around the centre button." tabindex="0" role="img" aria-label="RGB lighting. RGB strip in each grip and around the centre button."><title>RGB lighting</title><path class="d-rgb" d="M 60.5 124.6 L 59.4 129.1 L 58.5 133.6 L 57.8 138.1 L 57.4 142.7 L 57.2 147.4 L 57.2 152.0 L 57.5 156.7 L 58.0 161.5 L 58.6 166.6 L 59.3 171.5 L 60.1 176.3 L 61.2 181.1 L 62.3 185.8 L 63.6 190.5 L 65.1 195.1 L 66.8 199.6 L 68.5 204.1 L 70.5 208.4"/><path class="d-rgb" d="M 339.5 124.6 L 340.6 129.1 L 341.5 133.6 L 342.2 138.1 L 342.6 142.7 L 342.8 147.4 L 342.8 152.0 L 342.5 156.7 L 342.0 161.5 L 341.4 166.6 L 340.7 171.5 L 339.9 176.3 L 338.8 181.1 L 337.7 185.8 L 336.4 190.5 L 334.9 195.1 L 333.2 199.6 L 331.5 204.1 L 329.5 208.4"/></g><g class="d-hot" data-part="jack" data-name="3.5 mm headset jack" data-desc="Passes game audio and microphone through the controller. On several models in this range it stops working above a 250 Hz report rate, which is by design rather than a fault." tabindex="0" role="img" aria-label="3.5 mm headset jack. Passes game audio and microphone through the controller. On several models in this range it stops working above a 250 Hz report rate, which is by design rather than a fault."><title>3.5 mm headset jack</title><rect class="d-port" x="189" y="178.96" width="22" height="13" rx="5"/><circle class="d-part-inset" cx="200" cy="185.46" r="3.4"/></g>
</svg>
