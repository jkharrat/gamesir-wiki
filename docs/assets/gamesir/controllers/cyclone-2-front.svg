class="d-hot" data-part="dpad" data-name="D-pad" data-desc="Eight-way directional pad, used for menus and weapon or item wheels. Tactile switch." tabindex="0" role="img" aria-label="D-pad. Eight-way directional pad, used for menus and weapon or item wheels. Tactile switch."><title>D-pad</title><circle class="d-fence" cx="143.216" cy="173.62599999999998" r="27.3"/><rect class="d-part" x="135.656" y="153.676" width="15.12" height="17.64" rx="4.536"/><rect class="d-part" x="145.526" y="166.06599999999997" width="17.64" height="15.12" rx="4.536"/><rect class="d-part" x="135.656" y="175.93599999999998" width="15.12" height="17.64" rx="4.536"/><rect class="d-part" x="123.26600000000002" y="166.06599999999997" width="17.64" height="15.12" rx="4.536"/><circle class="d-part-inset" cx="143.216" cy="173.62599999999998" r="4.2"/><g class="d-glyph d-glyph-stroke"><path d="M143.216 158.71599999999998l-3.04 3.99h6.08zM143.216 188.53599999999997l-3.04 -3.99h6.08zM128.306 173.62599999999998l3.99 -3.04v6.08zM158.126 173.62599999999998l-3.99 -3.04v6.08z"/></g></g><g class="d-hot" data-part="rs" data-name="Right stick" data-desc="Camera and aim axis, with a click (RS/R3). Same sensor assembly as the left stick. Measured centre error: 3.5% left / 2.0% right (cable, XInput)." tabindex="0" role="img" aria-label="Right stick. Camera and aim axis, with a click (RS/R3). Same sensor assembly as the left stick. Measured centre error: 3.5% left / 2.0% right (cable, XInput)."><title>Right stick</title><circle class="d-recess" cx="254.912" cy="175.68599999999998" r="28"/><circle class="d-part" cx="254.912" cy="175.68599999999998" r="19"/><circle class="d-part-inset" cx="254.912" cy="175.68599999999998" r="11"/><text class="d-label d-label-sm" x="254.912" y="176.18599999999998">RS</text></g><g class="d-hot" data-part="view" data-name="View button" data-desc="Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use." tabindex="0" role="img" aria-label="View button. Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use."><title>View button</title><circle class="d-btn-sm" cx="160.22" cy="103.174" r="10.5"/><g class="d-glyph"><rect x="154.22" y="98.674" width="7.5" height="6" rx="1.2"/><rect x="158.72" y="101.674" width="7.5" height="6" rx="1.2"/></g></g><g class="d-hot" data-part="menu" data-name="Menu button" data-desc="Pause and start. Held with View and the guide button it enters the calibration and reset sequences documented on this page." tabindex="0" role="img" aria-label="Menu button. Pause and start. Held with View and the guide button it enters the calibration and reset sequences documented on this page."><title>Menu button</title><circle class="d-btn-sm" cx="239.78" cy="103.174" r="10.5"/><g class="d-glyph d-glyph-stroke"><path d="M234.78 99.674h10M234.78 103.174h10M234.78 106.674h10"/></g></g><g class="d-hot" data-part="guide" data-name="Home button" data-desc="Powers the controller and opens the connected platform's home screen. The surrounding indicator reports pairing and connection state." tabindex="0" role="img" aria-label="Home button. Powers the controller and opens the connected platform's home screen. The surrounding indicator reports pairing and connection state."><title>Home button</title><circle class="d-guide" cx="200" cy="81.544" r="16"/><circle class="d-guide-ring" cx="200" cy="81.544" r="11.5"/><circle class="d-accent-fill" cx="200" cy="81.544" r="4.6"/></g><g class="d-hot" data-part="profiles" data-name="Profile indicator" data-desc="4 illuminated segments showing which on-board profile is active. Profiles are stored in the controller, so they survive without the software running." tabindex="0" role="img" aria-label="Profile indicator. 4 illuminated segments showing which on-board profile is active. Profiles are stored in the controller, so they survive without the software running."><title>Profile indicator</title><rect class="d-part-inset" x="181" y="114.684" width="38" height="12" rx="6"/><rect class="d-accent-fill" x="185.5" y="117.684" width="4.5" height="6" rx="2.2"/><rect class="d-dim-fill" x="193" y="117.684" width="4.5" height="6" rx="2.2"/><rect class="d-dim-fill" x="200.5" y="117.684" width="4.5" height="6" rx="2.2"/><rect class="d-dim-fill" x="208" y="117.684" width="4.5" height="6" rx="2.2"/></g><g class="d-hot" data-part="mode" data-name="M (Mode) button" data-desc="The on-controller modifier. Held with another control it remaps the rear buttons, switches profile, toggles hair triggers and changes vibration strength without any software running." tabindex="0" role="img" aria-label="M (Mode) button. The on-controller modifier. Held with another control it remaps the rear buttons, switches profile, toggles hair triggers and changes vibration strength without any software running."><title>M (Mode) button</title><circle class="d-btn-sm" cx="200" cy="144.57999999999998" r="9.5"/><text class="d-label d-label-xs" x="200" y="144.98">M</text></g><g class="d-hot" data-part="rgb" data-name="RGB lighting" data-desc="RGB strip in each grip and around the centre button." tabindex="0" role="img" aria-label="RGB lighting. RGB strip in each grip and around the centre button."><title>RGB lighting</title><path class="d-rgb" d="M 55.2 164.0 L 55.7 168.0 L 56.3 172.0 L 57.0 175.9 L 57.8 179.8 L 58.7 183.7 L 59.7 187.6 L 60.8 191.4 L 62.0 195.1 L 63.3 198.9 L 64.7 202.5 L 66.2 206.2 L 67.8 209.7 L 69.6 213.2 L 71.4 216.6 L 73.4 219.8 L 75.5 223.0 L 77.7 226.1 L 80.1 229.0"/><path class="d-rgb" d="M 344.8 164.0 L 344.3 168.0 L 343.7 172.0 L 343.0 175.9 L 342.2 179.8 L 341.3 183.7 L 340.3 187.6 L 339.2 191.4 L 338.0 195.1 L 336.7 198.9 L 335.3 202.5 L 333.8 206.2 L 332.2 209.7 L 330.4 213.2 L 328.6 216.6 L 326.6 219.8 L 324.5 223.0 L 322.3 226.1 L 319.9 229.0"/></g><g class="d-hot" data-part="jack" data-name="3.5 mm headset jack" data-desc="Passes game audio and microphone through the controller. On several models in this range it stops working above a 250 Hz report rate, which is by design rather than a fault." tabindex="0" role="img" aria-label="3.5 mm headset jack. Passes game audio and microphone through the controller. On several models in this range it stops working above a 250 Hz report rate, which is by design rather than a fault."><title>3.5 mm headset jack</title><rect class="d-port" x="189" y="178.96" width="22" height="13" rx="5"/><circle class="d-part-inset" cx="200" cy="185.46" r="3.4"/></g>
