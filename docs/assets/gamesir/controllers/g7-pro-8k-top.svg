<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="900" height="383" role="img" aria-label="GameSir G7 Pro 8K — top edge layout schematic">
  <title>GameSir G7 Pro 8K — top edge layout schematic</title>
  <desc>Original schematic diagram from the community-maintained GameSir Wiki. Not GameSir product photography.</desc>

  <style>
    :root { color-scheme: dark light; }
    svg { --ink:#f2f3f5; --muted:#a6aab3; --dim:#71757e; --line:#34343e;
          --s1:#121216; --s2:#17171d; --s3:#1e1e25; --inset:#0e0e12;
          --brand:#e5343c; --good:#35d07f; --warn:#ffc247; --bad:#ff6b6b; --info:#64a8ff; }
    @media (prefers-color-scheme: light) {
      svg { --ink:#16171a; --muted:#585d66; --dim:#80858d; --line:#cdced5;
            --s1:#fff; --s2:#fbfbfc; --s3:#f1f1f4; --inset:#f4f4f7;
            --brand:#d6272e; --good:#0f7a44; --warn:#8a5a00; --bad:#c02626; --info:#175fd0; }
    }
  </style>
  <style>
    .d-canvas{fill:var(--s1)}
    .d-body{fill:var(--s2);stroke:var(--line);stroke-width:2}
    .d-panel{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
    .d-part{fill:var(--s3);stroke:var(--line);stroke-width:1.4}
    .d-part-2{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-part-inset{fill:var(--inset);stroke:var(--line);stroke-width:1}
    .d-recess{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-port{fill:var(--inset);stroke:var(--muted);stroke-width:1.4}
    .d-plate{fill:var(--s3);stroke:var(--brand);stroke-width:1.6;opacity:.9}
    .d-btn,.d-btn-sm,.d-step{fill:var(--s3);stroke:var(--muted);stroke-width:1.3}
    .d-btn-good{fill:color-mix(in srgb,var(--good) 22%,transparent);stroke:var(--good)}
    .d-btn-bad{fill:color-mix(in srgb,var(--bad) 22%,transparent);stroke:var(--bad)}
    .d-btn-info{fill:color-mix(in srgb,var(--info) 22%,transparent);stroke:var(--info)}
    .d-btn-warn{fill:color-mix(in srgb,var(--warn) 22%,transparent);stroke:var(--warn)}
    .d-btn-letter{fill:var(--ink);font:700 12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-guide{fill:var(--s3);stroke:var(--muted);stroke-width:1.4}
    .d-guide-ring{fill:none;stroke:var(--line);stroke-width:1.2}
    .d-window{fill:var(--inset);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .d-gear{fill:var(--s3);stroke:var(--brand);stroke-width:1.4}
    .d-fence{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-glide-ring{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.7}
    .d-lit{fill:color-mix(in srgb,var(--brand) 26%,transparent);stroke:none;opacity:.55}
    .d-lit-good{fill:color-mix(in srgb,var(--good) 26%,transparent)}
    .d-lit-bad{fill:color-mix(in srgb,var(--bad) 26%,transparent)}
    .d-lit-info{fill:color-mix(in srgb,var(--info) 26%,transparent)}
    .d-lit-warn{fill:color-mix(in srgb,var(--warn) 26%,transparent)}
    .d-ring,.d-accent-ring{fill:none;stroke:var(--line);stroke-width:1.4}
    .d-accent-ring{stroke:var(--brand)}
    .d-swap-ring{fill:none;stroke:var(--brand);stroke-width:1.4;stroke-dasharray:5 4}
    .d-seam{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5}
    .d-rgb{fill:none;stroke:var(--brand);stroke-width:3.4;stroke-linecap:round;opacity:.75}
    .d-texture{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
    .d-ink{fill:none;stroke:var(--muted);stroke-width:1.6}
    .d-ink-thick{fill:none;stroke:var(--muted);stroke-width:3.4;stroke-linecap:round}
    .d-leader,.d-dim-stroke{fill:none;stroke:var(--dim);stroke-width:1.1}
    .d-travel{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
    .d-accent-stroke{fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round}
    .d-good-stroke{fill:none;stroke:var(--good);stroke-width:1.8}
    .d-warn-stroke{fill:none;stroke:var(--warn);stroke-width:1.8}
    .d-accent-fill{fill:var(--brand);stroke:none}
    .d-good-fill{fill:var(--good);stroke:none}
    .d-warn-fill{fill:var(--warn);stroke:none}
    .d-bad-fill{fill:var(--bad);stroke:none}
    .d-half-fill{fill:var(--muted);stroke:none}
    .d-dim-fill{fill:var(--dim);stroke:none}
    .d-deadzone{fill:color-mix(in srgb,var(--info) 26%,transparent);stroke:var(--info);stroke-width:1.2}
    .d-antideadzone{fill:color-mix(in srgb,var(--brand) 20%,transparent);stroke:var(--brand);stroke-width:1.2}
    .d-absent{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 3}
    .d-slash,.d-slash-line{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round}
    .d-lane{fill:var(--inset);stroke:var(--line);stroke-width:1.2}
    .d-lane.on{fill:color-mix(in srgb,var(--good) 12%,transparent);stroke:var(--good)}
    .d-lane-icon{color:var(--muted)}
    .d-glyph{fill:var(--muted);stroke:none}
    .d-glyph-stroke{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}
    .d-label{fill:var(--muted);font:600 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-label-sm{font-size:9px}
    .d-label-xs{font-size:8px;fill:var(--dim)}
    .d-label-left{text-anchor:start}
    .d-title{fill:var(--ink);font:700 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em;text-transform:uppercase}
    .d-accent-text{fill:var(--brand)}
    .d-good-text{fill:var(--good)}
    .d-dim-text{fill:var(--dim)}
    .d-on-accent{fill:#fff}
  </style>
  <rect class="d-canvas" x="0" y="0" width="400" height="170"/>
  <g class="d-hot" data-part="lt" data-name="Left trigger (LT)" data-desc="Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + stops." tabindex="0" role="img" aria-label="Left trigger (LT). Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + stops."><title>Left trigger (LT)</title><path class="d-part" d="M 132.0 28.0 L 130.7 41.6 L 127.6 45.8 L 124.1 47.8 L 120.3 49.1 L 116.6 50.6 L 113.0 52.2 L 109.4 53.9 L 105.9 55.7 L 102.4 57.7 L 99.1 59.8 L 95.9 62.0 L 92.7 64.4 L 89.7 66.9 L 86.8 69.4 L 84.0 72.1 L 80.8 74.4 L 75.7 75.2 L 62.9 70.8 L 62.9 70.8 L 55.7 59.0 L 56.7 52.8 L 59.8 48.3 L 63.7 44.5 L 67.7 41.0 L 71.8 37.6 L 76.0 34.4 L 80.4 31.4 L 84.9 28.6 L 89.4 26.0 L 94.1 23.5 L 98.8 21.2 L 103.6 19.2 L 108.5 17.2 L 113.4 15.5 L 118.6 14.7 L 124.4 16.6 L 132.0 28.0 Z"/><text class="d-label" x="93.65691252227427" y="43.15346721047594">LT</text></g><g class="d-hot" data-part="rt" data-name="Right trigger (RT)" data-desc="Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click." tabindex="0" role="img" aria-label="Right trigger (RT). Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click."><title>Right trigger (RT)</title><path class="d-part" d="M 268.0 28.0 L 269.3 41.6 L 272.4 45.8 L 275.9 47.8 L 279.7 49.1 L 283.4 50.6 L 287.0 52.2 L 290.6 53.9 L 294.1 55.7 L 297.6 57.7 L 300.9 59.8 L 304.1 62.0 L 307.3 64.4 L 310.3 66.9 L 313.2 69.4 L 316.0 72.1 L 319.2 74.4 L 324.3 75.2 L 337.1 70.8 L 337.1 70.8 L 344.3 59.0 L 343.3 52.8 L 340.2 48.3 L 336.3 44.5 L 332.3 41.0 L 328.2 37.6 L 324.0 34.4 L 319.6 31.4 L 315.1 28.6 L 310.6 26.0 L 305.9 23.5 L 301.2 21.2 L 296.4 19.2 L 291.5 17.2 L 286.6 15.5 L 281.4 14.7 L 275.6 16.6 L 268.0 28.0 Z"/><text class="d-label" x="306.3430874777257" y="43.15346721047594">RT</text></g><path class="d-body" d="M 77.3 131.5 C 58.9 127.3 48.0 110.7 55.3 90.1 C 68.2 59.0 101.0 36.3 137.7 30.0 L 262.3 30.0 C 299.0 36.3 331.8 59.0 344.7 90.1 C 352.0 110.7 341.1 127.3 322.7 131.5 C 262.3 146.0 137.7 146.0 77.3 131.5 Z"/><g class="d-hot" data-part="lb" data-name="Left bumper (LB)" data-desc="Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere." tabindex="0" role="img" aria-label="Left bumper (LB). Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 159.5 65.0 L 154.3 55.2 L 149.1 52.6 L 143.8 52.0 L 138.6 52.0 L 137.6 52.4 L 133.7 53.3 L 129.5 54.5 L 125.4 55.8 L 121.4 57.3 L 117.4 58.9 L 113.5 60.8 L 109.7 62.7 L 106.1 64.9 L 102.5 67.2 L 99.1 69.6 L 96.2 72.7 L 94.8 77.2 L 99.0 86.9 L 99.0 86.9 L 108.1 91.8 L 112.0 91.7 L 114.7 90.4 L 117.1 88.7 L 119.6 87.0 L 122.3 85.5 L 125.1 84.0 L 127.9 82.7 L 130.9 81.5 L 133.9 80.4 L 136.9 79.4 L 140.0 78.5 L 142.7 77.9 L 138.6 78.0 L 143.8 78.0 L 149.1 77.4 L 154.3 74.8 L 159.5 65.0 Z"/><text class="d-label" x="126.13105337320962" y="69.37888460227319">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 240.5 65.0 L 245.7 55.2 L 250.9 52.6 L 256.2 52.0 L 261.4 52.0 L 262.4 52.4 L 266.3 53.3 L 270.5 54.5 L 274.6 55.8 L 278.6 57.3 L 282.6 58.9 L 286.5 60.8 L 290.3 62.7 L 293.9 64.9 L 297.5 67.2 L 300.9 69.6 L 303.8 72.7 L 305.2 77.2 L 301.0 86.9 L 301.0 86.9 L 291.9 91.8 L 288.0 91.7 L 285.3 90.4 L 282.9 88.7 L 280.4 87.0 L 277.7 85.5 L 274.9 84.0 L 272.1 82.7 L 269.1 81.5 L 266.1 80.4 L 263.1 79.4 L 260.0 78.5 L 257.3 77.9 L 261.4 78.0 L 256.2 78.0 L 250.9 77.4 L 245.7 74.8 L 240.5 65.0 Z"/><text class="d-label" x="273.8689466267904" y="69.37888460227319">RB</text></g><g class="d-hot" data-part="l5" data-name="Mini bumper (L5)" data-desc="Extra digital input inboard of LB. Ships as a null input and does nothing until it is mapped." tabindex="0" role="img" aria-label="Mini bumper (L5). Extra digital input inboard of LB. Ships as a null input and does nothing until it is mapped."><title>Mini bumper (L5)</title><path class="d-part-2" d="M 184.8 65.0 L 183.6 56.7 L 182.4 54.5 L 181.2 54.0 L 180.0 54.0 L 178.7 54.0 L 177.5 54.0 L 176.3 54.0 L 175.1 54.0 L 173.9 54.0 L 172.7 54.0 L 171.4 54.0 L 170.2 54.0 L 169.0 54.0 L 167.8 54.0 L 166.6 54.0 L 165.4 54.5 L 164.1 56.7 L 162.9 65.0 L 162.9 65.0 L 164.1 73.3 L 165.4 75.5 L 166.6 76.0 L 167.8 76.0 L 169.0 76.0 L 170.2 76.0 L 171.4 76.0 L 172.7 76.0 L 173.9 76.0 L 175.1 76.0 L 176.3 76.0 L 177.5 76.0 L 178.7 76.0 L 180.0 76.0 L 181.2 76.0 L 182.4 75.5 L 183.6 73.3 L 184.8 65.0 Z"/><text class="d-label d-label-xs" x="173.87534066561633" y="65">L5</text></g><g class="d-hot" data-part="r5" data-name="Mini bumper (R5)" data-desc="Extra digital input inboard of RB, mapped the same way as L5." tabindex="0" role="img" aria-label="Mini bumper (R5). Extra digital input inboard of RB, mapped the same way as L5."><title>Mini bumper (R5)</title><path class="d-part-2" d="M 215.2 65.0 L 216.4 56.7 L 217.6 54.5 L 218.8 54.0 L 220.0 54.0 L 221.3 54.0 L 222.5 54.0 L 223.7 54.0 L 224.9 54.0 L 226.1 54.0 L 227.3 54.0 L 228.6 54.0 L 229.8 54.0 L 231.0 54.0 L 232.2 54.0 L 233.4 54.0 L 234.6 54.5 L 235.9 56.7 L 237.1 65.0 L 237.1 65.0 L 235.9 73.3 L 234.6 75.5 L 233.4 76.0 L 232.2 76.0 L 231.0 76.0 L 229.8 76.0 L 228.6 76.0 L 227.3 76.0 L 226.1 76.0 L 224.9 76.0 L 223.7 76.0 L 222.5 76.0 L 221.3 76.0 L 220.0 76.0 L 218.8 76.0 L 217.6 75.5 L 216.4 73.3 L 215.2 65.0 Z"/><text class="d-label d-label-xs" x="226.12465933438367" y="65">R5</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely." tabindex="0" role="img" aria-label="USB-C port. Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely."><title>USB-C port</title><rect class="d-port" x="184" y="22" width="32" height="16" rx="8"/><rect class="d-part-inset" x="190" y="26" width="20" height="8" rx="4"/><text class="d-label d-label-xs" x="200" y="50">USB-C</text></g>
</svg>
