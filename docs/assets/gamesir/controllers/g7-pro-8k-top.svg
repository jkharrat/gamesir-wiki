<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="900" height="383" role="img" aria-label="GameSir G7 Pro 8K — top edge layout schematic">
  <title>GameSir G7 Pro 8K — top edge layout schematic</title>
  <desc>Original schematic diagram from the community-maintained GameSir Wiki. Not GameSir product photography.</desc>

  <style>
    :root { color-scheme: dark light; }
    svg { --ink:#f2f3f5; --muted:#a6aab3; --dim:#71757e; --line:#34343e;
          --s1:#121216; --s2:#17171d; --s3:#1e1e25; --inset:#0e0e12;
          --brand:#e5343c; --good:#35d07f; --warn:#ffc247; --bad:#ff6b6b; --info:#64a8ff; }
    @media (prefers-color-scheme: light) {
      svg { --ink:#16171a; --muted:#585d66; --dim:#80858d; --line:#cdced5;
            --s1:#fff; --s2:#fbfbfc; --s3:#f1f1f4; --inset:#f4f4f7;
            --brand:#d6272e; --good:#0f7a44; --warn:#8a5a00; --bad:#c02626; --info:#175fd0; }
    }
  </style>
  <style>
    .d-canvas{fill:var(--s1)}
    .d-body{fill:var(--s2);stroke:var(--line);stroke-width:2}
    .d-panel{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
    .d-part{fill:var(--s3);stroke:var(--line);stroke-width:1.4}
    .d-part-2{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-part-inset{fill:var(--inset);stroke:var(--line);stroke-width:1}
    .d-recess{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-port{fill:var(--inset);stroke:var(--muted);stroke-width:1.4}
    .d-plate{fill:var(--s3);stroke:var(--brand);stroke-width:1.6;opacity:.9}
    .d-btn,.d-btn-sm,.d-step{fill:var(--s3);stroke:var(--muted);stroke-width:1.3}
    .d-btn-good{fill:color-mix(in srgb,var(--good) 22%,transparent);stroke:var(--good)}
    .d-btn-bad{fill:color-mix(in srgb,var(--bad) 22%,transparent);stroke:var(--bad)}
    .d-btn-info{fill:color-mix(in srgb,var(--info) 22%,transparent);stroke:var(--info)}
    .d-btn-warn{fill:color-mix(in srgb,var(--warn) 22%,transparent);stroke:var(--warn)}
    .d-btn-letter{fill:var(--ink);font:700 12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-guide{fill:var(--s3);stroke:var(--muted);stroke-width:1.4}
    .d-guide-ring{fill:none;stroke:var(--line);stroke-width:1.2}
    .d-window{fill:var(--inset);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .d-gear{fill:var(--s3);stroke:var(--brand);stroke-width:1.4}
    .d-fence{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-glide-ring{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.7}
    .d-lit{fill:color-mix(in srgb,var(--brand) 26%,transparent);stroke:none;opacity:.55}
    .d-lit-good{fill:color-mix(in srgb,var(--good) 26%,transparent)}
    .d-lit-bad{fill:color-mix(in srgb,var(--bad) 26%,transparent)}
    .d-lit-info{fill:color-mix(in srgb,var(--info) 26%,transparent)}
    .d-lit-warn{fill:color-mix(in srgb,var(--warn) 26%,transparent)}
    .d-ring,.d-accent-ring{fill:none;stroke:var(--line);stroke-width:1.4}
    .d-accent-ring{stroke:var(--brand)}
    .d-swap-ring{fill:none;stroke:var(--brand);stroke-width:1.4;stroke-dasharray:5 4}
    .d-seam{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5}
    .d-rgb{fill:none;stroke:var(--brand);stroke-width:3.4;stroke-linecap:round;opacity:.75}
    .d-texture{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
    .d-ink{fill:none;stroke:var(--muted);stroke-width:1.6}
    .d-ink-thick{fill:none;stroke:var(--muted);stroke-width:3.4;stroke-linecap:round}
    .d-leader,.d-dim-stroke{fill:none;stroke:var(--dim);stroke-width:1.1}
    .d-travel{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
    .d-accent-stroke{fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round}
    .d-good-stroke{fill:none;stroke:var(--good);stroke-width:1.8}
    .d-warn-stroke{fill:none;stroke:var(--warn);stroke-width:1.8}
    .d-accent-fill{fill:var(--brand);stroke:none}
    .d-good-fill{fill:var(--good);stroke:none}
    .d-warn-fill{fill:var(--warn);stroke:none}
    .d-bad-fill{fill:var(--bad);stroke:none}
    .d-half-fill{fill:var(--muted);stroke:none}
    .d-dim-fill{fill:var(--dim);stroke:none}
    .d-deadzone{fill:color-mix(in srgb,var(--info) 26%,transparent);stroke:var(--info);stroke-width:1.2}
    .d-antideadzone{fill:color-mix(in srgb,var(--brand) 20%,transparent);stroke:var(--brand);stroke-width:1.2}
    .d-absent{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 3}
    .d-slash,.d-slash-line{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round}
    .d-lane{fill:var(--inset);stroke:var(--line);stroke-width:1.2}
    .d-lane.on{fill:color-mix(in srgb,var(--good) 12%,transparent);stroke:var(--good)}
    .d-lane-icon{color:var(--muted)}
    .d-glyph{fill:var(--muted);stroke:none}
    .d-glyph-stroke{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}
    .d-label{fill:var(--muted);font:600 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-label-sm{font-size:9px}
    .d-label-xs{font-size:8px;fill:var(--dim)}
    .d-label-left{text-anchor:start}
    .d-title{fill:var(--ink);font:700 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em;text-transform:uppercase}
    .d-accent-text{fill:var(--brand)}
    .d-good-text{fill:var(--good)}
    .d-dim-text{fill:var(--dim)}
    .d-on-accent{fill:#fff}
    .s-body{fill:none;stroke:var(--dim);stroke-width:3;opacity:.5}
    .s-shoulder{fill:none;stroke:var(--dim);stroke-width:3;opacity:.32}
    .s-ring,.s-part{fill:none;stroke:var(--dim);stroke-width:2.6;opacity:.42}
  </style>
  <rect class="d-canvas" x="0" y="0" width="400" height="170"/>
  <g class="d-hot" data-part="lt" data-name="Left trigger (LT)" data-desc="Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + stops." tabindex="0" role="img" aria-label="Left trigger (LT). Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + stops."><title>Left trigger (LT)</title><path class="d-part" d="M 149.4 28.0 L 144.6 45.9 L 139.7 48.0 L 137.2 48.3 L 134.3 49.1 L 130.2 50.1 L 126.2 51.3 L 122.3 52.6 L 118.4 54.1 L 114.6 55.8 L 110.9 57.6 L 107.2 59.5 L 103.7 61.6 L 100.3 63.9 L 96.9 66.2 L 93.7 68.7 L 90.7 71.3 L 86.3 72.6 L 70.2 63.4 L 70.2 63.4 L 61.1 47.1 L 64.0 41.5 L 68.5 37.7 L 73.1 34.1 L 77.8 30.8 L 82.7 27.6 L 87.7 24.7 L 92.8 21.9 L 98.0 19.4 L 103.2 17.1 L 108.6 15.1 L 114.0 13.2 L 119.5 11.6 L 125.1 10.2 L 132.1 8.8 L 139.7 8.0 L 144.6 10.1 L 149.4 28.0 Z"/><text class="d-label" x="101.29378063325001" y="26.699693057222152">LT</text></g><g class="d-hot" data-part="rt" data-name="Right trigger (RT)" data-desc="Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click." tabindex="0" role="img" aria-label="Right trigger (RT). Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click."><title>Right trigger (RT)</title><path class="d-part" d="M 250.6 28.0 L 255.4 45.9 L 260.3 48.0 L 262.8 48.3 L 265.7 49.1 L 269.8 50.1 L 273.8 51.3 L 277.7 52.6 L 281.6 54.1 L 285.4 55.8 L 289.1 57.6 L 292.8 59.5 L 296.3 61.6 L 299.7 63.9 L 303.1 66.2 L 306.3 68.7 L 309.3 71.3 L 313.7 72.6 L 329.8 63.4 L 329.8 63.4 L 338.9 47.1 L 336.0 41.5 L 331.5 37.7 L 326.9 34.1 L 322.2 30.8 L 317.3 27.6 L 312.3 24.7 L 307.2 21.9 L 302.0 19.4 L 296.8 17.1 L 291.4 15.1 L 286.0 13.2 L 280.5 11.6 L 274.9 10.2 L 267.9 8.8 L 260.3 8.0 L 255.4 10.1 L 250.6 28.0 Z"/><text class="d-label" x="298.70621936674996" y="26.699693057222152">RT</text></g><path class="d-body" d="M 77.3 131.5 C 58.9 127.3 48.0 110.7 55.3 90.1 C 68.2 59.0 101.0 36.3 137.7 30.0 L 262.3 30.0 C 299.0 36.3 331.8 59.0 344.7 90.1 C 352.0 110.7 341.1 127.3 322.7 131.5 C 262.3 146.0 137.7 146.0 77.3 131.5 Z"/><g class="d-hot" data-part="lb" data-name="Left bumper (LB)" data-desc="Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere." tabindex="0" role="img" aria-label="Left bumper (LB). Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 149.4 69.0 L 144.6 57.4 L 139.7 56.0 L 138.2 56.2 L 136.1 56.9 L 132.4 57.8 L 128.7 58.9 L 125.0 60.2 L 121.5 61.5 L 118.0 63.1 L 114.5 64.7 L 111.2 66.5 L 107.9 68.4 L 104.7 70.5 L 101.7 72.6 L 98.8 74.9 L 96.0 77.3 L 94.3 80.7 L 100.4 91.2 L 100.4 91.2 L 110.6 97.3 L 113.3 96.7 L 115.2 95.1 L 117.2 93.5 L 119.3 92.0 L 121.6 90.6 L 123.9 89.2 L 126.3 87.9 L 128.8 86.7 L 131.3 85.6 L 134.0 84.6 L 136.6 83.7 L 139.3 82.9 L 142.1 82.2 L 141.4 81.9 L 139.7 82.0 L 144.6 80.6 L 149.4 69.0 Z"/><text class="d-label" x="123.36493894879047" y="74.884211753415">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 250.6 69.0 L 255.4 57.4 L 260.3 56.0 L 261.8 56.2 L 263.9 56.9 L 267.6 57.8 L 271.3 58.9 L 275.0 60.2 L 278.5 61.5 L 282.0 63.1 L 285.5 64.7 L 288.8 66.5 L 292.1 68.4 L 295.3 70.5 L 298.3 72.6 L 301.2 74.9 L 304.0 77.3 L 305.7 80.7 L 299.6 91.2 L 299.6 91.2 L 289.4 97.3 L 286.7 96.7 L 284.8 95.1 L 282.8 93.5 L 280.7 92.0 L 278.4 90.6 L 276.1 89.2 L 273.7 87.9 L 271.2 86.7 L 268.7 85.6 L 266.0 84.6 L 263.4 83.7 L 260.7 82.9 L 257.9 82.2 L 258.6 81.9 L 260.3 82.0 L 255.4 80.6 L 250.6 69.0 Z"/><text class="d-label" x="276.6350610512095" y="74.884211753415">RB</text></g><g class="d-hot" data-part="l5" data-name="Mini bumper (L5)" data-desc="Extra digital input inboard of LB. Ships as a null input and does nothing until it is mapped." tabindex="0" role="img" aria-label="Mini bumper (L5). Extra digital input inboard of LB. Ships as a null input and does nothing until it is mapped."><title>Mini bumper (L5)</title><path class="d-part-2" d="M 181.5 69.0 L 180.2 59.1 L 179.0 58.0 L 177.8 58.0 L 176.6 58.0 L 175.4 58.0 L 174.2 58.0 L 172.9 58.0 L 171.7 58.0 L 170.5 58.0 L 169.3 58.0 L 168.1 58.0 L 166.9 58.0 L 165.6 58.0 L 164.4 58.0 L 163.2 58.0 L 162.0 58.0 L 160.8 59.1 L 159.5 69.0 L 159.5 69.0 L 160.8 78.9 L 162.0 80.0 L 163.2 80.0 L 164.4 80.0 L 165.6 80.0 L 166.9 80.0 L 168.1 80.0 L 169.3 80.0 L 170.5 80.0 L 171.7 80.0 L 172.9 80.0 L 174.2 80.0 L 175.4 80.0 L 176.6 80.0 L 177.8 80.0 L 179.0 80.0 L 180.2 78.9 L 181.5 69.0 Z"/><text class="d-label d-label-xs" x="170.5044168805346" y="69">L5</text></g><g class="d-hot" data-part="r5" data-name="Mini bumper (R5)" data-desc="Extra digital input inboard of RB, mapped the same way as L5." tabindex="0" role="img" aria-label="Mini bumper (R5). Extra digital input inboard of RB, mapped the same way as L5."><title>Mini bumper (R5)</title><path class="d-part-2" d="M 218.5 69.0 L 219.8 59.1 L 221.0 58.0 L 222.2 58.0 L 223.4 58.0 L 224.6 58.0 L 225.8 58.0 L 227.1 58.0 L 228.3 58.0 L 229.5 58.0 L 230.7 58.0 L 231.9 58.0 L 233.1 58.0 L 234.4 58.0 L 235.6 58.0 L 236.8 58.0 L 238.0 58.0 L 239.2 59.1 L 240.5 69.0 L 240.5 69.0 L 239.2 78.9 L 238.0 80.0 L 236.8 80.0 L 235.6 80.0 L 234.4 80.0 L 233.1 80.0 L 231.9 80.0 L 230.7 80.0 L 229.5 80.0 L 228.3 80.0 L 227.1 80.0 L 225.8 80.0 L 224.6 80.0 L 223.4 80.0 L 222.2 80.0 L 221.0 80.0 L 219.8 78.9 L 218.5 69.0 Z"/><text class="d-label d-label-xs" x="229.4955831194654" y="69">R5</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely." tabindex="0" role="img" aria-label="USB-C port. Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely."><title>USB-C port</title><rect class="d-port" x="184" y="22" width="32" height="16" rx="8"/><rect class="d-part-inset" x="190" y="26" width="20" height="8" rx="4"/><text class="d-label d-label-xs" x="200" y="50">USB-C</text></g>
</svg>
