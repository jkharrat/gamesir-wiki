<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="900" height="630" role="img" aria-label="GameSir Cyclone 2 — back layout schematic">
  <title>GameSir Cyclone 2 — back layout schematic</title>
  <desc>Original schematic diagram from the community-maintained GameSir Wiki. Not GameSir product photography.</desc>

  <style>
    :root { color-scheme: dark light; }
    svg { --ink:#f2f3f5; --muted:#a6aab3; --dim:#71757e; --line:#34343e;
          --s1:#121216; --s2:#17171d; --s3:#1e1e25; --inset:#0e0e12;
          --brand:#e5343c; --good:#35d07f; --warn:#ffc247; --bad:#ff6b6b; --info:#64a8ff; }
    @media (prefers-color-scheme: light) {
      svg { --ink:#16171a; --muted:#585d66; --dim:#80858d; --line:#cdced5;
            --s1:#fff; --s2:#fbfbfc; --s3:#f1f1f4; --inset:#f4f4f7;
            --brand:#d6272e; --good:#0f7a44; --warn:#8a5a00; --bad:#c02626; --info:#175fd0; }
    }
  </style>
  <style>
    .d-canvas{fill:var(--s1)}
    .d-body{fill:var(--s2);stroke:var(--line);stroke-width:2}
    .d-panel{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
    .d-part{fill:var(--s3);stroke:var(--line);stroke-width:1.4}
    .d-part-2{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-part-inset{fill:var(--inset);stroke:var(--line);stroke-width:1}
    .d-recess{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-port{fill:var(--inset);stroke:var(--muted);stroke-width:1.4}
    .d-plate{fill:var(--s3);stroke:var(--brand);stroke-width:1.6;opacity:.9}
    .d-btn,.d-btn-sm,.d-step{fill:var(--s3);stroke:var(--muted);stroke-width:1.3}
    .d-btn-good{fill:color-mix(in srgb,var(--good) 22%,transparent);stroke:var(--good)}
    .d-btn-bad{fill:color-mix(in srgb,var(--bad) 22%,transparent);stroke:var(--bad)}
    .d-btn-info{fill:color-mix(in srgb,var(--info) 22%,transparent);stroke:var(--info)}
    .d-btn-warn{fill:color-mix(in srgb,var(--warn) 22%,transparent);stroke:var(--warn)}
    .d-btn-letter{fill:var(--ink);font:700 12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-guide{fill:var(--s3);stroke:var(--muted);stroke-width:1.4}
    .d-guide-ring{fill:none;stroke:var(--line);stroke-width:1.2}
    .d-window{fill:var(--inset);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .d-gear{fill:var(--s3);stroke:var(--brand);stroke-width:1.4}
    .d-fence{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-glide-ring{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.7}
    .d-lit{fill:color-mix(in srgb,var(--brand) 26%,transparent);stroke:none;opacity:.55}
    .d-lit-good{fill:color-mix(in srgb,var(--good) 26%,transparent)}
    .d-lit-bad{fill:color-mix(in srgb,var(--bad) 26%,transparent)}
    .d-lit-info{fill:color-mix(in srgb,var(--info) 26%,transparent)}
    .d-lit-warn{fill:color-mix(in srgb,var(--warn) 26%,transparent)}
    .d-ring,.d-accent-ring{fill:none;stroke:var(--line);stroke-width:1.4}
    .d-accent-ring{stroke:var(--brand)}
    .d-swap-ring{fill:none;stroke:var(--brand);stroke-width:1.4;stroke-dasharray:5 4}
    .d-seam{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5}
    .d-rgb{fill:none;stroke:var(--brand);stroke-width:3.4;stroke-linecap:round;opacity:.75}
    .d-texture{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
    .d-ink{fill:none;stroke:var(--muted);stroke-width:1.6}
    .d-ink-thick{fill:none;stroke:var(--muted);stroke-width:3.4;stroke-linecap:round}
    .d-leader,.d-dim-stroke{fill:none;stroke:var(--dim);stroke-width:1.1}
    .d-travel{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
    .d-accent-stroke{fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round}
    .d-good-stroke{fill:none;stroke:var(--good);stroke-width:1.8}
    .d-warn-stroke{fill:none;stroke:var(--warn);stroke-width:1.8}
    .d-accent-fill{fill:var(--brand);stroke:none}
    .d-good-fill{fill:var(--good);stroke:none}
    .d-warn-fill{fill:var(--warn);stroke:none}
    .d-bad-fill{fill:var(--bad);stroke:none}
    .d-half-fill{fill:var(--muted);stroke:none}
    .d-dim-fill{fill:var(--dim);stroke:none}
    .d-deadzone{fill:color-mix(in srgb,var(--info) 26%,transparent);stroke:var(--info);stroke-width:1.2}
    .d-antideadzone{fill:color-mix(in srgb,var(--brand) 20%,transparent);stroke:var(--brand);stroke-width:1.2}
    .d-absent{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 3}
    .d-slash,.d-slash-line{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round}
    .d-lane{fill:var(--inset);stroke:var(--line);stroke-width:1.2}
    .d-lane.on{fill:color-mix(in srgb,var(--good) 12%,transparent);stroke:var(--good)}
    .d-lane-icon{color:var(--muted)}
    .d-glyph{fill:var(--muted);stroke:none}
    .d-glyph-stroke{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}
    .d-label{fill:var(--muted);font:600 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-label-sm{font-size:9px}
    .d-label-xs{font-size:8px;fill:var(--dim)}
    .d-label-left{text-anchor:start}
    .d-title{fill:var(--ink);font:700 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em;text-transform:uppercase}
    .d-accent-text{fill:var(--brand)}
    .d-good-text{fill:var(--good)}
    .d-dim-text{fill:var(--dim)}
    .d-on-accent{fill:#fff}
  </style>
  <rect class="d-canvas" x="0" y="0" width="400" height="280"/>
  <g class="d-hot" data-part="lt" data-name="Left trigger (LT)" data-desc="Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + microswitch." tabindex="0" role="img" aria-label="Left trigger (LT). Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + microswitch."><title>Left trigger (LT)</title><path class="d-part" d="M 147.3 22.3 L 142.8 33.1 L 138.3 36.1 L 133.7 37.2 L 129.0 37.7 L 124.2 38.4 L 119.5 39.2 L 114.7 40.2 L 110.0 41.4 L 105.2 42.7 L 100.6 44.2 L 95.9 45.9 L 91.3 47.8 L 86.8 49.9 L 82.3 52.2 L 77.9 54.7 L 73.3 56.9 L 67.5 57.6 L 56.7 52.6 L 56.7 52.6 L 55.0 40.5 L 58.5 34.7 L 63.5 30.8 L 68.9 27.6 L 74.5 24.8 L 80.1 22.2 L 85.7 19.8 L 91.4 17.8 L 97.1 15.9 L 102.8 14.3 L 108.5 12.9 L 114.2 11.7 L 119.9 10.7 L 125.5 9.9 L 130.9 9.3 L 136.4 9.5 L 141.8 11.9 L 147.3 22.3 Z"/><text class="d-label" x="101.17841828157188" y="29.314328520389385">LT</text></g><g class="d-hot" data-part="rt" data-name="Right trigger (RT)" data-desc="Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click." tabindex="0" role="img" aria-label="Right trigger (RT). Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click."><title>Right trigger (RT)</title><path class="d-part" d="M 252.7 22.3 L 257.2 33.1 L 261.7 36.1 L 266.3 37.2 L 271.0 37.7 L 275.8 38.4 L 280.5 39.2 L 285.3 40.2 L 290.0 41.4 L 294.8 42.7 L 299.4 44.2 L 304.1 45.9 L 308.7 47.8 L 313.2 49.9 L 317.7 52.2 L 322.1 54.7 L 326.7 56.9 L 332.5 57.6 L 343.3 52.6 L 343.3 52.6 L 345.0 40.5 L 341.5 34.7 L 336.5 30.8 L 331.1 27.6 L 325.5 24.8 L 319.9 22.2 L 314.3 19.8 L 308.6 17.8 L 302.9 15.9 L 297.2 14.3 L 291.5 12.9 L 285.8 11.7 L 280.1 10.7 L 274.5 9.9 L 269.1 9.3 L 263.6 9.5 L 258.2 11.9 L 252.7 22.3 Z"/><text class="d-label" x="298.8215817184281" y="29.314328520389385">RT</text></g><path class="d-body" d="M 200.0 56.0 C 179.3 56.0 154.6 52.1 128.1 56.0 C 101.7 59.9 77.1 71.7 60.1 95.1 C 46.8 114.9 42.1 138.4 44.9 161.9 C 47.7 191.3 58.2 222.9 78.9 242.4 C 95.9 258.1 118.7 262.0 135.7 250.3 C 149.0 241.4 154.6 228.6 158.3 209.1 C 161.3 202.7 167.9 194.8 181.1 193.0 C 187.7 192.0 194.4 192.0 200.0 192.0 C 205.6 192.0 212.3 192.0 218.9 193.0 C 232.1 194.8 238.7 202.7 241.7 209.1 C 245.4 228.6 251.0 241.4 264.3 250.3 C 281.3 262.0 304.1 258.1 321.1 242.4 C 341.8 222.9 352.3 191.3 355.1 161.9 C 357.9 138.4 353.2 114.9 339.9 95.1 C 322.9 71.7 298.3 59.9 271.9 56.0 C 245.4 52.1 220.7 56.0 200.0 56.0 Z"/><g class="d-hot" data-part="lb" data-name="Left bumper (LB)" data-desc="Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere." tabindex="0" role="img" aria-label="Left bumper (LB). Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 154.2 47.3 L 149.6 57.2 L 145.1 59.8 L 140.6 60.7 L 136.2 61.1 L 131.7 61.6 L 127.3 62.2 L 122.9 63.0 L 118.6 63.9 L 114.3 65.1 L 110.1 66.3 L 105.9 67.8 L 101.8 69.4 L 97.8 71.3 L 93.9 73.2 L 90.1 75.4 L 86.1 77.3 L 81.0 77.8 L 71.2 73.1 L 71.2 73.1 L 69.2 62.1 L 72.2 56.8 L 76.7 53.2 L 81.5 50.4 L 86.5 47.8 L 91.6 45.5 L 96.8 43.5 L 102.0 41.6 L 107.2 40.0 L 112.5 38.7 L 117.8 37.5 L 123.1 36.5 L 128.4 35.8 L 133.7 35.2 L 138.9 34.8 L 144.1 35.1 L 149.2 37.5 L 154.2 47.3 Z"/><text class="d-label d-label-sm" x="110.76969795806424" y="52.548897113886895">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 245.8 47.3 L 250.4 57.2 L 254.9 59.8 L 259.4 60.7 L 263.8 61.1 L 268.3 61.6 L 272.7 62.2 L 277.1 63.0 L 281.4 63.9 L 285.7 65.1 L 289.9 66.3 L 294.1 67.8 L 298.2 69.4 L 302.2 71.3 L 306.1 73.2 L 309.9 75.4 L 313.9 77.3 L 319.0 77.8 L 328.8 73.1 L 328.8 73.1 L 330.8 62.1 L 327.8 56.8 L 323.3 53.2 L 318.5 50.4 L 313.5 47.8 L 308.4 45.5 L 303.2 43.5 L 298.0 41.6 L 292.8 40.0 L 287.5 38.7 L 282.2 37.5 L 276.9 36.5 L 271.6 35.8 L 266.3 35.2 L 261.1 34.8 L 255.9 35.1 L 250.8 37.5 L 245.8 47.3 Z"/><text class="d-label d-label-sm" x="289.2303020419358" y="52.548897113886895">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely." tabindex="0" role="img" aria-label="USB-C port. Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely."><title>USB-C port</title><rect class="d-port" x="182" y="51.59" width="36" height="15" rx="7.5"/><rect class="d-part-inset" x="188" y="56.09" width="24" height="6" rx="3"/><text class="d-label d-label-xs" x="200" y="79.09">USB-C</text></g><g class="d-hot" data-part="gear" data-name="Trigger stop switches" data-desc="Physical switches that shorten the trigger from full analog travel to a short click. Physical trigger locks toggle between Hall Effect analog travel and mechanical micro-switch actuation." tabindex="0" role="img" aria-label="Trigger stop switches. Physical switches that shorten the trigger from full analog travel to a short click. Physical trigger locks toggle between Hall Effect analog travel and mechanical micro-switch actuation."><title>Trigger stop switches</title><rect class="d-part-2" x="97.19999999999999" y="87.64" width="34" height="15" rx="7.5"/><rect class="d-accent-fill" x="100.19999999999999" y="90.64" width="12" height="9" rx="4.5"/><text class="d-label d-label-xs" x="114.19999999999999" y="115.14">stop</text></g><g class="d-hot" data-part="gear" data-name="Trigger stop switches" data-desc="Physical switches that shorten the trigger from full analog travel to a short click. Physical trigger locks toggle between Hall Effect analog travel and mechanical micro-switch actuation." tabindex="0" role="img" aria-label="Trigger stop switches. Physical switches that shorten the trigger from full analog travel to a short click. Physical trigger locks toggle between Hall Effect analog travel and mechanical micro-switch actuation."><title>Trigger stop switches</title><rect class="d-part-2" x="268.8" y="87.64" width="34" height="15" rx="7.5"/><rect class="d-accent-fill" x="287.8" y="90.64" width="12" height="9" rx="4.5"/><text class="d-label d-label-xs" x="285.8" y="115.14">stop</text></g><g class="d-hot" data-part="l4" data-name="Rear button L4" data-desc="Remappable paddle reached by the middle finger. Ships as a null input, so it does nothing until it is assigned." tabindex="0" role="img" aria-label="Rear button L4. Remappable paddle reached by the middle finger. Ships as a null input, so it does nothing until it is assigned."><title>Rear button L4</title><g transform="rotate(-15 99.38 218.74)"><rect class="d-part-2" x="86.38" y="193.74" width="26" height="50" rx="13"/></g><text class="d-label d-label-sm" x="99.38" y="218.74">L4</text></g><g class="d-hot" data-part="r4" data-name="Rear button R4" data-desc="Remappable paddle on the right grip, assigned the same way as L4." tabindex="0" role="img" aria-label="Rear button R4. Remappable paddle on the right grip, assigned the same way as L4."><title>Rear button R4</title><g transform="rotate(15 300.62 218.74)"><rect class="d-part-2" x="287.62" y="193.74" width="26" height="50" rx="13"/></g><text class="d-label d-label-sm" x="300.62" y="218.74">R4</text></g><g class="d-hot" data-part="grip" data-name="Grip" data-desc="Textured grip. Documented weight for the whole controller: 229 g / 0.50 lbs." tabindex="0" role="img" aria-label="Grip. Textured grip. Documented weight for the whole controller: 229 g / 0.50 lbs."><title>Grip</title><path class="d-texture" d="M 61.6 187.0 L 62.4 189.9 L 63.3 192.7 L 64.2 195.4 L 65.1 198.2 L 66.2 200.9 L 67.3 203.6 L 68.4 206.2 L 69.6 208.8 L 70.9 211.4 L 72.2 213.9 L 73.6 216.4 L 75.1 218.8 L 76.6 221.1 L 78.2 223.4 L 79.9 225.6 L 81.6 227.8 L 83.4 229.8 L 85.3 231.8"/><path class="d-texture" d="M 75.1 183.4 L 75.8 185.9 L 76.6 188.4 L 77.4 190.9 L 78.3 193.4 L 79.2 195.8 L 80.2 198.2 L 81.2 200.5 L 82.2 202.8 L 83.3 205.0 L 84.5 207.2 L 85.7 209.3 L 86.9 211.3 L 88.2 213.3 L 89.5 215.2 L 90.9 217.0 L 92.3 218.8 L 93.8 220.4 L 95.3 222.0"/><path class="d-texture" d="M 338.4 187.0 L 337.6 189.9 L 336.7 192.7 L 335.8 195.4 L 334.9 198.2 L 333.8 200.9 L 332.7 203.6 L 331.6 206.2 L 330.4 208.8 L 329.1 211.4 L 327.8 213.9 L 326.4 216.4 L 324.9 218.8 L 323.4 221.1 L 321.8 223.4 L 320.1 225.6 L 318.4 227.8 L 316.6 229.8 L 314.7 231.8"/><path class="d-texture" d="M 324.9 183.4 L 324.2 185.9 L 323.4 188.4 L 322.6 190.9 L 321.7 193.4 L 320.8 195.8 L 319.8 198.2 L 318.8 200.5 L 317.8 202.8 L 316.7 205.0 L 315.5 207.2 L 314.3 209.3 L 313.1 211.3 L 311.8 213.3 L 310.5 215.2 L 309.1 217.0 L 307.7 218.8 L 306.2 220.4 L 304.7 222.0"/></g>
</svg>
