.5 L 272.4 64.2 L 276.7 64.9 L 281.0 65.9 L 285.2 67.0 L 289.3 68.2 L 293.4 69.7 L 297.4 71.3 L 301.3 73.1 L 305.1 75.0 L 308.8 77.1 L 312.4 79.4 L 316.7 80.9 L 326.9 75.4 L 326.9 75.4 L 329.6 63.7 L 325.9 59.6 L 321.3 56.6 L 316.6 53.9 L 311.7 51.4 L 306.8 49.2 L 301.8 47.2 L 296.8 45.4 L 291.7 43.9 L 286.5 42.6 L 281.4 41.4 L 276.2 40.5 L 271.1 39.7 L 266.0 39.2 L 260.9 38.7 L 255.8 38.5 L 250.7 39.6 L 245.8 50.3 Z"/><text class="d-label d-label-sm" x="288.416805911152" y="55.43626284030332">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely." tabindex="0" role="img" aria-label="USB-C port. Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely."><title>USB-C port</title><rect class="d-port" x="182" y="51.59" width="36" height="15" rx="7.5"/><rect class="d-part-inset" x="188" y="56.09" width="24" height="6" rx="3"/><text class="d-label d-label-xs" x="200" y="79.09">USB-C</text></g><g class="d-hot" data-part="gear" data-name="Trigger stop switches" data-desc="Physical switches that shorten the trigger from full analog travel to a short click. Physical trigger locks toggle between Hall Effect analog travel and mechanical micro-switch actuation." tabindex="0" role="img" aria-label="Trigger stop switches. Physical switches that shorten the trigger from full analog travel to a short click. Physical trigger locks toggle between Hall Effect analog travel and mechanical micro-switch actuation."><title>Trigger stop switches</title><rect class="d-part-2" x="97.19999999999999" y="87.64" width="34" height="15" rx="7.5"/><rect class="d-accent-fill" x="100.19999999999999" y="90.64" width="12" height="9" rx="4.5"/><text class="d-label d-label-xs" x="114.19999999999999" y="115.14">stop</text></g><g class="d-hot" data-part="gear" data-name="Trigger stop switches" data-desc="Physical switches that shorten the trigger from full analog travel to a short click. Physical trigger locks toggle between Hall Effect analog travel and mechanical micro-switch actuation." tabindex="0" role="img" aria-label="Trigger stop switches. Physical switches that shorten the trigger from full analog travel to a short click. Physical trigger locks toggle between Hall Effect analog travel and mechanical micro-switch actuation."><title>Trigger stop switches</title><rect class="d-part-2" x="268.8" y="87.64" width="34" height="15" rx="7.5"/><rect class="d-accent-fill" x="287.8" y="90.64" width="12" height="9" rx="4.5"/><text class="d-label d-label-xs" x="285.8" y="115.14">stop</text></g><g class="d-hot" data-part="l4" data-name="Rear button L4" data-desc="Remappable paddle reached by the middle finger. Ships as a null input, so it does nothing until it is assigned." tabindex="0" role="img" aria-label="Rear button L4. Remappable paddle reached by the middle finger. Ships as a null input, so it does nothing until it is assigned."><title>Rear button L4</title><g transform="rotate(-15 99.38 218.74)"><rect class="d-part-2" x="86.38" y="193.74" width="26" height="50" rx="13"/></g><text class="d-label d-label-sm" x="99.38" y="218.74">L4</text></g><g class="d-hot" data-part="r4" data-name="Rear button R4" data-desc="Remappable paddle on the right grip, assigned the same way as L4." tabindex="0" role="img" aria-label="Rear button R4. Remappable paddle on the right grip, assigned the same way as L4."><title>Rear button R4</title><g transform="rotate(15 300.62 218.74)"><rect class="d-part-2" x="287.62" y="193.74" width="26" height="50" rx="13"/></g><text class="d-label d-label-sm" x="300.62" y="218.74">R4</text></g><g class="d-hot" data-part="grip" data-name="Grip" data-desc="Textured grip. Documented weight for the whole controller: 229 g / 0.50 lbs." tabindex="0" role="img" aria-label="Grip. Textured grip. Documented weight for the whole controller: 229 g / 0.50 lbs."><ti