LS</text></g><g class="d-hot" data-part="face" data-name="ABXY face buttons" data-desc="The four primary action buttons. Microswitch ABXY rated by GameSir for a 3 million press lifespan, with clicky t…." tabindex="0" role="img" aria-label="ABXY face buttons. The four primary action buttons. Microswitch ABXY rated by GameSir for a 3 million press lifespan, with clicky t…."><title>ABXY face buttons</title><circle class="d-btn d-btn-warn" cx="288.464" cy="86.74" r="11.5"/><text class="d-btn-letter" x="288.464" y="87.24">Y</text><circle class="d-btn d-btn-bad" cx="317.464" cy="115.74" r="11.5"/><text class="d-btn-letter" x="317.464" y="116.24">B</text><circle class="d-btn d-btn-good" cx="288.464" cy="144.74" r="11.5"/><text class="d-btn-letter" x="288.464" y="145.24">A</text><circle class="d-btn d-btn-info" cx="259.464" cy="115.74" r="11.5"/><text class="d-btn-letter" x="259.464" y="116.24">X</text></g><g class="d-hot" data-part="dpad" data-name="D-pad" data-desc="Eight-way directional pad, used for menus and weapon or item wheels. Microswitch." tabindex="0" role="img" aria-label="D-pad. Eight-way directional pad, used for menus and weapon or item wheels. Microswitch."><title>D-pad</title><path class="d-part" d="M 135.432 152.62599999999998 H 153.912 V 164.38599999999997 H 165.672 V 182.86599999999999 H 153.912 V 194.62599999999998 H 135.432 V 182.86599999999999 H 123.672 V 164.38599999999997 H 135.432 Z"/><circle class="d-part-inset" cx="144.672" cy="173.62599999999998" r="7.140000000000001"/><g class="d-glyph d-glyph-stroke"><path d="M144.672 158.71599999999998l-3.04 3.99h6.08zM144.672 188.53599999999997l-3.04 -3.99h6.08zM129.762 173.62599999999998l3.99 -3.04v6.08zM159.582 173.62599999999998l-3.99 -3.04v6.08z"/></g></g><g class="d-hot" data-part="rs" data-name="Right stick" data-desc="Camera and aim axis, with a click (RS/R3). Same sensor assembly as the left stick." tabindex="0" role="img" aria-label="Right stick. Camera and aim axis, with a click (RS/R3). Same sensor assembly as the left stick."><title>Right stick</title><circle class="d-recess" cx="253.504" cy="175.68599999999998" r="28"/><circle class="d-part" cx="253.504" cy="175.68599999999998" r="19"/><circle class="d-part-inset" cx="253.504" cy="175.68599999999998" r="11"/><text class="d-label d-label-sm" x="253.504" y="176.18599999999998">RS</text></g><g class="d-hot" data-part="view" data-name="View button" data-desc="Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use." tabindex="0" role="img" aria-label="View button. Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use."><title>View button</title><circle class="d-btn-sm" cx="161.24" cy="103.174" r="10.5"/><g class="d-glyph"><rect x="155.24" y="98.674" width="7.5" height="6" rx="1.2"/><rect x="159.74" y="101.674" width="7.5" height="6" rx="1.2"/></g></g><g class="d-hot" data-part="menu" data-name="Menu button" data-desc="Pause and start. Held with View and the guide button it enters the calibration and reset sequences documented on this page." tabindex="0" role="img" aria-label="Menu button. Pause and start. Held with View and the guide button it enters the calibration and reset sequences documented on this page."><title>Menu button</title><circle class="d-btn-sm" cx="238.76" cy="103.174" r="10.5"/><g class="d-glyph d-glyph-stroke"><path d="M233.76 99.674h10M233.76 103.174h10M233.76 106.674h10"/></g></g><g class="d-hot" data-part="guide" data-name="Xbox guide button" data-desc="Powers the controller and opens the Xbox dashboard. Its indicator also reports connection state, the active profile slot and whether a mode switch succeeded." tabindex="0" role="img" aria-label="Xbox guide button. Powers the controller and opens the Xbox dashboard. Its indicator also reports connection state, the 