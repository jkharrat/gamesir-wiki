" data-desc="Unlike the G7 SE, this model has no mechanical lock for the rear paddles — they are always live. GameSir's own manual page still claims otherwise, which is a documentation error rather than a hardware difference." tabindex="0" role="img" aria-label="No back-button latches. Unlike the G7 SE, this model has no mechanical lock for the rear paddles — they are always live. GameSir's own manual page still claims otherwise, which is a documentation error rather than a hardware difference."><title>No back-button latches</title><rect class="d-absent" x="140.3" y="191.32" width="13" height="26" rx="6"/><path class="d-slash-line" d="M 140.3 217.32 L 153.3 191.32"/><text class="d-label d-label-xs d-dim-text" x="144.8" y="227.32">no lock</text></g><g class="d-hot" data-part="latch" data-name="No back-button latches" data-desc="Unlike the G7 SE, this model has no mechanical lock for the rear paddles — they are always live. GameSir's own manual page still claims otherwise, which is a documentation error rather than a hardware difference." tabindex="0" role="img" aria-label="No back-button latches. Unlike the G7 SE, this model has no mechanical lock for the rear paddles — they are always live. GameSir's own manual page still claims otherwise, which is a documentation error rather than a hardware difference."><title>No back-button latches</title><rect class="d-absent" x="246.7" y="191.32" width="13" height="26" rx="6"/><path class="d-slash-line" d="M 246.7 217.32 L 259.7 191.32"/><text class="d-label d-label-xs d-dim-text" x="255.2" y="227.32">no lock</text></g><g class="d-hot" data-part="grip" data-name="Grip" data-desc="Textured grip. Documented weight for the whole controller: 227 g." tabindex="0" role="img" aria-label="Grip. Textured grip. Documented weight for the whole controller: 227 g."><title>Grip</title><path class="d-texture" d="M 65.4 187.0 L 66.2 189.8 L 67.0 192.6 L 67.9 195.4 L 68.9 198.1 L 69.9 200.8 L 70.9 203.5 L 72.0 206.2 L 73.2 208.8 L 74.5 211.4 L 