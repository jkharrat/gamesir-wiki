ass="d-btn-letter" x="260.665786407767" y="118.56">X</text></g><g class="d-hot" data-part="dpad" data-name="D-pad" data-desc="Eight-way directional pad, used for menus and weapon or item wheels. Not documented." tabindex="0" role="img" aria-label="D-pad. Eight-way directional pad, used for menus and weapon or item wheels. Not documented."><title>D-pad</title><path class="d-part" d="M 134.70794174757282 156.37846601941746 H 151.7240582524272 V 169.6859417475728 H 165.03153398058254 V 186.70205825242718 H 151.7240582524272 V 200.00953398058252 H 134.70794174757282 V 186.70205825242718 H 121.40046601941748 V 169.6859417475728 H 134.70794174757282 Z"/><g class="d-glyph d-glyph-stroke"><path d="M143.216 162.70399999999998l-3.16 4.14h6.32zM143.216 193.684l-3.16 -4.14h6.32zM127.72600000000001 178.194l4.14 -3.16v6.32zM158.70600000000002 178.194l-4.14 -3.16v6.32z"/></g></g><g class="d-hot" data-part="rs" data-name="Right stick" data-desc="Camera and aim axis, with a click (RS/R3). Same sensor assembly as the left stick." tabindex="0" role="img" aria-label="Right stick. Camera and aim axis, with a click (RS/R3). Same sensor assembly as the left stick."><title>Right stick</title><circle class="d-recess" cx="254.912" cy="180.334" r="29.0873786407767"/><circle class="d-glide-ring" cx="254.912" cy="180.334" r="24.5873786407767"/><circle class="d-part" cx="254.912" cy="180.334" r="20.0873786407767"/><circle class="d-part-inset" cx="254.912" cy="180.334" r="12.087378640776699"/><text class="d-label d-label-sm" x="254.912" y="180.834">RS</text></g><g class="d-hot" data-part="view" data-name="View button" data-desc="Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use." tabindex="0" role="img" aria-label="View button. Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use."><title>View button</title><circle class="d-btn-sm" cx="160.22" cy="105.006" r="10.907766990291261"/><g class="d-glyph"><rect x="154.22" y="100.506" width="7.5" height="6" rx="1.2"/><rect x="158.72" y="103.506" width="7.5" height="6" rx="1.2"/></g></g><g class="d-hot" data-part="menu" data-name="Menu button" data-desc="Pause and start. Held with View and the guide button it enters the calibration and reset sequences documented on this page." tabindex="0" role="img" aria-label="Menu button. Pause and start. Held with View and the guide button it enters the calibration and reset sequences documented on this page."><title>Menu button</title><circle class="d-btn-sm" cx="239.78" cy="105.006" r="10.907766990291261"/><g class="d-glyph d-glyph-stroke"><path d="M234.78 101.506h10M234.78 105.006h10M234.78 108.506h10"/></g></g><g class="d-hot" data-part="guide" data-name="Xbox guide button" data-desc="Powers the controller and opens the Xbox dashboard. Its indicator also reports connection state, the active profile slot and whether a mode switch succeeded." tabindex="0" role="img" aria-label="Xbox guide button. Powers the controller and opens the Xbox dashboard. Its indicator also reports connection state, the active profile slot and whether a mode switch succeeded."><title>Xbox guide button</title><circle class="d-guide" cx="200" cy="82.536" r="16.62135922330097"/><circle class="d-guide-ring" cx="200" cy="82.536" r="12.12135922330097"/><circle class="d-accent-fill" cx="200" cy="82.536" r="4.6"/></g><g class="d-hot" data-part="share" data-name="Share button" data-desc="Captures a screenshot or a clip. Also used in the combinations that switch the controller between GIP and XInput." tabindex="0" role="img" aria-label="Share button. Captures a screenshot or a clip. Also used in the combinations that switch the controller between GIP and XInput."><title>Share button</title><circle class="d-btn-sm" cx="200" cy="123.196" r="8.83009708737864"/><g class="d-glyph d-g