0.5 64.5 L 326.9 60.2 L 322.3 57.1 L 317.6 54.2 L 312.7 51.6 L 307.8 49.3 L 302.8 47.1 L 297.7 45.3 L 292.5 43.6 L 287.3 42.2 L 282.1 41.0 L 276.9 40.0 L 271.7 39.2 L 266.5 38.6 L 261.3 38.1 L 256.2 37.8 L 251.1 38.9 L 246.0 50.0 Z"/><text class="d-label d-label-sm" x="288.9667479869187" y="55.55899668201449">RB</text></g><g class="d-hot" data-part="ls" data-name="Left stick" data-desc="Movement axis, and a digital click (LS/L3) when pressed. Sensor: Hall Effect." tabindex="0" role="img" aria-label="Left stick. Movement axis, and a digital click (LS/L3) when pressed. Sensor: Hall Effect."><title>Left stick</title><circle class="d-recess" cx="114.97999999999999" cy="118.06" r="29.0873786407767"/><circle class="d-glide-ring" cx="114.97999999999999" cy="118.06" r="24.5873786407767"/><circle class="d-part" cx="114.97999999999999" cy="118.06" r="20.0873786407767"/><circle class="d-part-inset" cx="114.97999999999999" cy="118.06" r="12.087378640776699"/><text class="d-label d-label-sm" x="114.97999999999999" y="118.56">LS</text></g><g class="d-hot" data-part="face" data-name="ABXY face buttons" data-desc="The four primary action buttons. Microswitch ABXY on the Kaleid — this is the headline difference from the Kalei…." tabindex="0" role="img" aria-label="ABXY face buttons. The four primary action buttons. Microswitch ABXY on the Kaleid — this is the headline difference from the Kalei…."><title>ABXY face buttons</title><circle class="d-btn d-btn-warn" cx="290.792" cy="87.933786407767" r="11.946601941747574"/><text class="d-btn-letter" x="290.792" y="88.433786407767">Y</text><circle class="d-btn d-btn-bad" cx="320.918213592233" cy="118.06" r="11.946601941747574"/><text class="d-btn-letter" x="320.918213592233" y="118.56">B</text><circle class="d-btn d-btn-good" cx="290.792" cy="148.186213592233" r="11.946601941747574"/><text class="d-btn-letter" x="290.792" y="148.686213592233">A</text><circle class="d-btn d-btn-info" cx="260.665786407767" cy="118.06" r="11.946601941747574"/><text class="d-btn-letter" x="260.665786407767" y="118.56">X</text></g><g class="d-hot" data-part="dpad" data-name="D-pad" data-desc="Eight-way directional pad, used for menus and weapon or item wheels. Not documented." tabindex="0" role="img" aria-label="D-pad. Eight-way directional pad, used for menus and weapon or item wheels. Not documented."><title>D-pad</title><path class="d-part" d="M 134.70794174757282 156.37846601941746 H 151.7240582524272 V 169.6859417475728 H 165.03153398058254 V 186.70205825242718 H 151.7240582524272 V 200.00953398058252 H 134.70794174757282 V 186.70205825242718 H 121.40046601941748 V 169.6859417475728 H 134.70794174757282 Z"/><g class="d-glyph d-glyph-stroke"><path d="M143.216 162.70399999999998l-3.16 4.14h6.32zM143.216 193.684l-3.16 -4.14h6.32zM127.72600000000001 178.194l4.14 -3.16v6.32zM158.70600000000002 178.194l-4.14 -3.16v6.32z"/></g></g><g class="d-hot" data-part="rs" data-name="Right stick" data-desc="Camera and aim axis, with a click (RS/R3). Same sensor assembly as the left stick." tabindex="0" role="img" aria-label="Right stick. Camera and aim axis, with a click (RS/R3). Same sensor assembly as the left stick."><title>Right stick</title><circle class="d-recess" cx="254.912" cy="180.334" r="29.0873786407767"/><circle class="d-glide-ring" cx="254.912" cy="180.334" r="24.5873786407767"/><circle class="d-part" cx="254.912" cy="180.334" r="20.0873786407767"/><circle class="d-part-inset" cx="254.912" cy="180.334" r="12.087378640776699"/><text class="d-label d-label-sm" x="254.912" y="180.834">RS</text></g><g class="d-hot" data-part="view" data-name="View button" data-desc="Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use." tabindex="0" role="img" aria-label="View button. Opens in-game maps and menus. It is also the first button in most of this family's calibration and reset combinations, so its position matters more than its everyday use."><title>View button</title><circle class="d-btn-sm" cx="160.22" cy="105.006" r="10.907766990291261"/><g class="d-glyph"><rect x="154.22" y="100.506" width="7.5" height="6" rx="1.2"/><rect x="158.72" y="103.506" width="7.5" height="6" rx="1.2"/></g></g><g class="d-hot" data-part="menu" data-name="Menu button" data-desc="Pause and start. Held with View and the guide button it enters the calibration and reset sequences documented on this page." tabindex="0" role="img" aria-label="Menu button. Pause and start. Held with View and the guide button it enters the calibration and reset sequences documented on this page."><title>Menu button</title><circle class="d-btn-sm" cx="239.78" cy="105.006" r="10.907766990291261"/><g class="d-glyph d-glyph-stroke"><path d="M234.78 101.506h10M234.78 105.006h10M234.78 108.506h10"/></g></g><g class="d-hot" data-part="guide" data-name="Xbox guide button" data-desc="Powers the controller and opens the Xbox dashboard. Its indicator also reports connection state, the active profile slot and whether a mode switch succeeded." tabindex="0" role="img" aria-label="Xbox guide button. Powers the controller and opens the Xbox dashboard. Its indicator also reports connection state, the active profile slot and whether a mode switch succeeded."><title>Xbox guide button</title><circle class="d-guide" cx="200" cy="82.536" r="16.62135922330097"/><circle class="d-guide-ring" cx="200" cy="82.536" r="12.12135922330097"/><circle class="d-accent-fill" cx="200" cy="82.536" r="4.6"/></g><g class="d-hot" data-part="share" data-name="Share button" data-desc="Captures a screenshot or a clip. Also used in the combinations that switch the controller between GIP and XInput." tabindex="0" role="img" aria-label="Share button. Captures a screenshot or a clip. Also used in the combinations that switch the controller between GIP and XInput."><title>Share button</title><circle class="d-btn-sm" cx="200" cy="123.196" r="8.83009708737864"/><g class="d-glyph d-glyph-stroke"><rect x="195" y="119.596" width="10" height="7.2" rx="1.4"/><path d="M198.2 119.596v-1.6h3.6v1.6"/></g></g><g class="d-hot" data-part="mode" data-name="M (Mode) button" data-desc="The on-controller modifier. Held with another control it remaps the rear buttons, switches profile, toggles hair triggers and changes vibration strength without any software running." tabindex="0" role="img" aria-label="M (Mode) button. The on-controller modifier. Held with another control it remaps the rear buttons, switches profile, toggles hair triggers and changes vibration strength without any software running."><title>M (Mode) button</title><circle class="d-btn-sm" cx="200" cy="148.01999999999998" r="9.868932038834952"/><text class="d-label d-label-xs" x="200" y="148.42">M</text></g><g class="d-hot" data-part="rgb" data-name="RGB lighting" data-desc="Two customisable RGB strips." tabindex="0" role="img" aria-label="RGB lighting. Two customisable RGB strips."><title>RGB lighting</title><path class="d-rgb" d="M 55.6 168.1 L 56.1 172.2 L 56.7 176.3 L 57.4 180.4 L 58.2 184.5 L 59.0 188.5 L 60.0 192.5 L 61.1 196.5 L 62.3 200.4 L 63.6 204.3 L 65.0 208.1 L 66.5 211.9 L 68.1 215.6 L 69.9 219.2 L 71.7 222.7 L 73.7 226.2 L 75.8 229.5 L 78.1 232.7 L 80.4 235.8"/><path class="d-rgb" d="M 344.4 168.1 L 343.9 172.2 L 343.3 176.3 L 342.6 180.4 L 341.8 184.5 L 341.0 188.5 L 340.0 192.5 L 338.9 196.5 L 337.7 200.4 L 336.4 204.3 L 335.0 208.1 L 333.5 211.9 L 331.9 215.6 L 330.1 219.2 L 328.3 222.7 L 326.3 226.2 L 324.2 229.5 L 321.9 232.7 L 319.6 235.8"/></g><g class="d-hot" data-part="jack" data-name="3.5 mm headset jack" data-desc="Passes game audio and microphone through the controller. On several models in this range it stops working above a 250 Hz report rate, which is by design rather than a fault." tabindex="0" role="img" aria-label="3.5 mm headset jack. Passes game audio and microphone through the controller. On several models in this range it stops working above a 250 Hz report rate, which is by design rather than a fault."><title>3.5 mm headset jack</title><rect class="d-port" x="188.5728155339806" y="183.73514563106798" width="22.854368932038835" height="13.504854368932039" rx="5"/><circle class="d-part-inset" cx="200" cy="190.48757281553398" r="3.532038834951456"/><text class="d-label d-label-xs" x="200" y="209.24">3.5 mm</text></g>
</svg>
