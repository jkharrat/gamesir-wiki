ate, which is by design rather than a fault."><title>3.5 mm headset jack</title><rect class="d-port" x="188.5728155339806" y="183.73514563106798" width="22.854368932038835" height="13.504854368932039" rx="5"/><circle class="d-part-inset" cx="200" cy="190.48757281553398" r="3.532038834951456"/></g>
