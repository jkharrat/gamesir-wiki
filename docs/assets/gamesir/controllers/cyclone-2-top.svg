<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="900" height="383" role="img" aria-label="GameSir Cyclone 2 — top edge layout schematic">
  <title>GameSir Cyclone 2 — top edge layout schematic</title>
  <desc>Original schematic diagram from the community-maintained GameSir Wiki. Not GameSir product photography.</desc>

  <style>
    :root { color-scheme: dark light; }
    svg { --ink:#f2f3f5; --muted:#a6aab3; --dim:#71757e; --line:#34343e;
          --s1:#121216; --s2:#17171d; --s3:#1e1e25; --inset:#0e0e12;
          --brand:#e5343c; --good:#35d07f; --warn:#ffc247; --bad:#ff6b6b; --info:#64a8ff; }
    @media (prefers-color-scheme: light) {
      svg { --ink:#16171a; --muted:#585d66; --dim:#80858d; --line:#cdced5;
            --s1:#fff; --s2:#fbfbfc; --s3:#f1f1f4; --inset:#f4f4f7;
            --brand:#d6272e; --good:#0f7a44; --warn:#8a5a00; --bad:#c02626; --info:#175fd0; }
    }
  </style>
  <style>
    .d-canvas{fill:var(--s1)}
    .d-body{fill:var(--s2);stroke:var(--line);stroke-width:2}
    .d-panel{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
    .d-part{fill:var(--s3);stroke:var(--line);stroke-width:1.4}
    .d-part-2{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-part-inset{fill:var(--inset);stroke:var(--line);stroke-width:1}
    .d-recess{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-port{fill:var(--inset);stroke:var(--muted);stroke-width:1.4}
    .d-plate{fill:var(--s3);stroke:var(--brand);stroke-width:1.6;opacity:.9}
    .d-btn,.d-btn-sm,.d-step{fill:var(--s3);stroke:var(--muted);stroke-width:1.3}
    .d-btn-good{fill:color-mix(in srgb,var(--good) 22%,transparent);stroke:var(--good)}
    .d-btn-bad{fill:color-mix(in srgb,var(--bad) 22%,transparent);stroke:var(--bad)}
    .d-btn-info{fill:color-mix(in srgb,var(--info) 22%,transparent);stroke:var(--info)}
    .d-btn-warn{fill:color-mix(in srgb,var(--warn) 22%,transparent);stroke:var(--warn)}
    .d-btn-letter{fill:var(--ink);font:700 12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-guide{fill:var(--s3);stroke:var(--muted);stroke-width:1.4}
    .d-guide-ring{fill:none;stroke:var(--line);stroke-width:1.2}
    .d-window{fill:var(--inset);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .d-gear{fill:var(--s3);stroke:var(--brand);stroke-width:1.4}
    .d-fence{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-glide-ring{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.7}
    .d-lit{fill:color-mix(in srgb,var(--brand) 26%,transparent);stroke:none;opacity:.55}
    .d-lit-good{fill:color-mix(in srgb,var(--good) 26%,transparent)}
    .d-lit-bad{fill:color-mix(in srgb,var(--bad) 26%,transparent)}
    .d-lit-info{fill:color-mix(in srgb,var(--info) 26%,transparent)}
    .d-lit-warn{fill:color-mix(in srgb,var(--warn) 26%,transparent)}
    .d-ring,.d-accent-ring{fill:none;stroke:var(--line);stroke-width:1.4}
    .d-accent-ring{stroke:var(--brand)}
    .d-swap-ring{fill:none;stroke:var(--brand);stroke-width:1.4;stroke-dasharray:5 4}
    .d-seam{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5}
    .d-rgb{fill:none;stroke:var(--brand);stroke-width:3.4;stroke-linecap:round;opacity:.75}
    .d-texture{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
    .d-ink{fill:none;stroke:var(--muted);stroke-width:1.6}
    .d-ink-thick{fill:none;stroke:var(--muted);stroke-width:3.4;stroke-linecap:round}
    .d-leader,.d-dim-stroke{fill:none;stroke:var(--dim);stroke-width:1.1}
    .d-travel{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
    .d-accent-stroke{fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round}
    .d-good-stroke{fill:none;stroke:var(--good);stroke-width:1.8}
    .d-warn-stroke{fill:none;stroke:var(--warn);stroke-width:1.8}
    .d-accent-fill{fill:var(--brand);stroke:none}
    .d-good-fill{fill:var(--good);stroke:none}
    .d-warn-fill{fill:var(--warn);stroke:none}
    .d-bad-fill{fill:var(--bad);stroke:none}
    .d-half-fill{fill:var(--muted);stroke:none}
    .d-dim-fill{fill:var(--dim);stroke:none}
    .d-deadzone{fill:color-mix(in srgb,var(--info) 26%,transparent);stroke:var(--info);stroke-width:1.2}
    .d-antideadzone{fill:color-mix(in srgb,var(--brand) 20%,transparent);stroke:var(--brand);stroke-width:1.2}
    .d-absent{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 3}
    .d-slash,.d-slash-line{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round}
    .d-lane{fill:var(--inset);stroke:var(--line);stroke-width:1.2}
    .d-lane.on{fill:color-mix(in srgb,var(--good) 12%,transparent);stroke:var(--good)}
    .d-lane-icon{color:var(--muted)}
    .d-glyph{fill:var(--muted);stroke:none}
    .d-glyph-stroke{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}
    .d-label{fill:var(--muted);font:600 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-label-sm{font-size:9px}
    .d-label-xs{font-size:8px;fill:var(--dim)}
    .d-label-left{text-anchor:start}
    .d-title{fill:var(--ink);font:700 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em;text-transform:uppercase}
    .d-accent-text{fill:var(--brand)}
    .d-good-text{fill:var(--good)}
    .d-dim-text{fill:var(--dim)}
    .d-on-accent{fill:#fff}
    .s-body{fill:none;stroke:var(--dim);stroke-width:3;opacity:.5}
    .s-shoulder{fill:none;stroke:var(--dim);stroke-width:3;opacity:.32}
    .s-ring,.s-part{fill:none;stroke:var(--dim);stroke-width:2.6;opacity:.42}
  </style>
  <rect class="d-canvas" x="0" y="0" width="400" height="170"/>
  <g class="d-hot" data-part="lt" data-name="Left trigger (LT)" data-desc="Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + microswitch." tabindex="0" role="img" aria-label="Left trigger (LT). Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + microswitch."><title>Left trigger (LT)</title><path class="d-part" d="M 147.4 28.0 L 142.3 45.9 L 137.3 48.0 L 135.4 48.4 L 131.8 49.3 L 127.7 50.5 L 123.6 51.8 L 119.5 53.4 L 115.6 55.0 L 111.7 56.9 L 107.8 58.9 L 104.1 61.0 L 100.5 63.3 L 97.0 65.8 L 93.6 68.4 L 90.3 71.1 L 87.2 74.0 L 82.7 75.5 L 66.3 67.1 L 66.3 67.1 L 56.7 51.0 L 59.4 45.2 L 63.9 41.1 L 68.6 37.2 L 73.4 33.5 L 78.3 30.1 L 83.4 26.8 L 88.6 23.8 L 93.9 21.1 L 99.3 18.5 L 104.8 16.2 L 110.4 14.1 L 116.1 12.2 L 121.8 10.6 L 128.4 9.2 L 137.3 8.0 L 142.3 10.1 L 147.4 28.0 Z"/><text class="d-label" x="97.4259085007677" y="28.22147250516601">LT</text></g><g class="d-hot" data-part="rt" data-name="Right trigger (RT)" data-desc="Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click." tabindex="0" role="img" aria-label="Right trigger (RT). Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click."><title>Right trigger (RT)</title><path class="d-part" d="M 252.6 28.0 L 257.7 45.9 L 262.7 48.0 L 264.6 48.4 L 268.2 49.3 L 272.3 50.5 L 276.4 51.8 L 280.5 53.4 L 284.4 55.0 L 288.3 56.9 L 292.2 58.9 L 295.9 61.0 L 299.5 63.3 L 303.0 65.8 L 306.4 68.4 L 309.7 71.1 L 312.8 74.0 L 317.3 75.5 L 333.7 67.1 L 333.7 67.1 L 343.3 51.0 L 340.6 45.2 L 336.1 41.1 L 331.4 37.2 L 326.6 33.5 L 321.7 30.1 L 316.6 26.8 L 311.4 23.8 L 306.1 21.1 L 300.7 18.5 L 295.2 16.2 L 289.6 14.1 L 283.9 12.2 L 278.2 10.6 L 271.6 9.2 L 262.7 8.0 L 257.7 10.1 L 252.6 28.0 Z"/><text class="d-label" x="302.5740914992323" y="28.22147250516601">RT</text></g><path class="d-body" d="M 74.1 140.3 C 55.2 135.7 44.0 117.7 51.5 95.3 C 64.7 61.5 98.4 36.8 136.0 30.0 L 264.0 30.0 C 301.6 36.8 335.3 61.5 348.5 95.3 C 356.0 117.7 344.8 135.7 325.9 140.3 C 264.0 156.0 136.0 156.0 74.1 140.3 Z"/><g class="d-hot" data-part="lb" data-name="Left bumper (LB)" data-desc="Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere." tabindex="0" role="img" aria-label="Left bumper (LB). Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 147.4 69.0 L 142.3 57.4 L 137.3 56.0 L 136.8 56.3 L 133.8 57.1 L 130.0 58.2 L 126.2 59.4 L 122.5 60.8 L 118.8 62.3 L 115.2 64.0 L 111.7 65.9 L 108.3 67.9 L 104.9 70.0 L 101.7 72.2 L 98.6 74.6 L 95.6 77.1 L 92.8 79.7 L 91.1 83.4 L 97.4 93.7 L 97.4 93.7 L 108.0 99.4 L 110.8 98.4 L 112.8 96.6 L 114.9 94.9 L 117.1 93.2 L 119.4 91.6 L 121.7 90.1 L 124.2 88.7 L 126.8 87.3 L 129.4 86.1 L 132.1 85.0 L 134.8 83.9 L 137.6 83.0 L 140.4 82.3 L 141.4 81.8 L 137.3 82.0 L 142.3 80.6 L 147.4 69.0 Z"/><text class="d-label" x="120.99577594815348" y="75.68455821187433">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 252.6 69.0 L 257.7 57.4 L 262.7 56.0 L 263.2 56.3 L 266.2 57.1 L 270.0 58.2 L 273.8 59.4 L 277.5 60.8 L 281.2 62.3 L 284.8 64.0 L 288.3 65.9 L 291.7 67.9 L 295.1 70.0 L 298.3 72.2 L 301.4 74.6 L 304.4 77.1 L 307.2 79.7 L 308.9 83.4 L 302.6 93.7 L 302.6 93.7 L 292.0 99.4 L 289.2 98.4 L 287.2 96.6 L 285.1 94.9 L 282.9 93.2 L 280.6 91.6 L 278.3 90.1 L 275.8 88.7 L 273.2 87.3 L 270.6 86.1 L 267.9 85.0 L 265.2 83.9 L 262.4 83.0 L 259.6 82.3 L 258.6 81.8 L 262.7 82.0 L 257.7 80.6 L 252.6 69.0 Z"/><text class="d-label" x="279.0042240518465" y="75.68455821187433">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely." tabindex="0" role="img" aria-label="USB-C port. Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely."><title>USB-C port</title><rect class="d-port" x="184" y="22" width="32" height="16" rx="8"/><rect class="d-part-inset" x="190" y="26" width="20" height="8" rx="4"/><text class="d-label d-label-xs" x="200" y="50">USB-C</text></g>
</svg>
