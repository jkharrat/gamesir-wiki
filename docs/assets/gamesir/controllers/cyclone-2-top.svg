<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="900" height="383" role="img" aria-label="GameSir Cyclone 2 — top edge layout schematic">
  <title>GameSir Cyclone 2 — top edge layout schematic</title>
  <desc>Original schematic diagram from the community-maintained GameSir Wiki. Not GameSir product photography.</desc>

  <style>
    :root { color-scheme: dark light; }
    svg { --ink:#f2f3f5; --muted:#a6aab3; --dim:#71757e; --line:#34343e;
          --s1:#121216; --s2:#17171d; --s3:#1e1e25; --inset:#0e0e12;
          --brand:#e5343c; --good:#35d07f; --warn:#ffc247; --bad:#ff6b6b; --info:#64a8ff; }
    @media (prefers-color-scheme: light) {
      svg { --ink:#16171a; --muted:#585d66; --dim:#80858d; --line:#cdced5;
            --s1:#fff; --s2:#fbfbfc; --s3:#f1f1f4; --inset:#f4f4f7;
            --brand:#d6272e; --good:#0f7a44; --warn:#8a5a00; --bad:#c02626; --info:#175fd0; }
    }
  </style>
  <style>
    .d-canvas{fill:var(--s1)}
    .d-body{fill:var(--s2);stroke:var(--line);stroke-width:2}
    .d-panel{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
    .d-part{fill:var(--s3);stroke:var(--line);stroke-width:1.4}
    .d-part-2{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-part-inset{fill:var(--inset);stroke:var(--line);stroke-width:1}
    .d-recess{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-port{fill:var(--inset);stroke:var(--muted);stroke-width:1.4}
    .d-plate{fill:var(--s3);stroke:var(--brand);stroke-width:1.6;opacity:.9}
    .d-btn,.d-btn-sm,.d-step{fill:var(--s3);stroke:var(--muted);stroke-width:1.3}
    .d-btn-good{fill:color-mix(in srgb,var(--good) 22%,transparent);stroke:var(--good)}
    .d-btn-bad{fill:color-mix(in srgb,var(--bad) 22%,transparent);stroke:var(--bad)}
    .d-btn-info{fill:color-mix(in srgb,var(--info) 22%,transparent);stroke:var(--info)}
    .d-btn-warn{fill:color-mix(in srgb,var(--warn) 22%,transparent);stroke:var(--warn)}
    .d-btn-letter{fill:var(--ink);font:700 12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-guide{fill:var(--s3);stroke:var(--muted);stroke-width:1.4}
    .d-guide-ring{fill:none;stroke:var(--line);stroke-width:1.2}
    .d-window{fill:var(--inset);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .d-gear{fill:var(--s3);stroke:var(--brand);stroke-width:1.4}
    .d-fence{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-glide-ring{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.7}
    .d-lit{fill:color-mix(in srgb,var(--brand) 26%,transparent);stroke:none;opacity:.55}
    .d-lit-good{fill:color-mix(in srgb,var(--good) 26%,transparent)}
    .d-lit-bad{fill:color-mix(in srgb,var(--bad) 26%,transparent)}
    .d-lit-info{fill:color-mix(in srgb,var(--info) 26%,transparent)}
    .d-lit-warn{fill:color-mix(in srgb,var(--warn) 26%,transparent)}
    .d-ring,.d-accent-ring{fill:none;stroke:var(--line);stroke-width:1.4}
    .d-accent-ring{stroke:var(--brand)}
    .d-swap-ring{fill:none;stroke:var(--brand);stroke-width:1.4;stroke-dasharray:5 4}
    .d-seam{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5}
    .d-rgb{fill:none;stroke:var(--brand);stroke-width:3.4;stroke-linecap:round;opacity:.75}
    .d-texture{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
    .d-ink{fill:none;stroke:var(--muted);stroke-width:1.6}
    .d-ink-thick{fill:none;stroke:var(--muted);stroke-width:3.4;stroke-linecap:round}
    .d-leader,.d-dim-stroke{fill:none;stroke:var(--dim);stroke-width:1.1}
    .d-travel{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
    .d-accent-stroke{fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round}
    .d-good-stroke{fill:none;stroke:var(--good);stroke-width:1.8}
    .d-warn-stroke{fill:none;stroke:var(--warn);stroke-width:1.8}
    .d-accent-fill{fill:var(--brand);stroke:none}
    .d-good-fill{fill:var(--good);stroke:none}
    .d-warn-fill{fill:var(--warn);stroke:none}
    .d-bad-fill{fill:var(--bad);stroke:none}
    .d-half-fill{fill:var(--muted);stroke:none}
    .d-dim-fill{fill:var(--dim);stroke:none}
    .d-deadzone{fill:color-mix(in srgb,var(--info) 26%,transparent);stroke:var(--info);stroke-width:1.2}
    .d-antideadzone{fill:color-mix(in srgb,var(--brand) 20%,transparent);stroke:var(--brand);stroke-width:1.2}
    .d-absent{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 3}
    .d-slash,.d-slash-line{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round}
    .d-lane{fill:var(--inset);stroke:var(--line);stroke-width:1.2}
    .d-lane.on{fill:color-mix(in srgb,var(--good) 12%,transparent);stroke:var(--good)}
    .d-lane-icon{color:var(--muted)}
    .d-glyph{fill:var(--muted);stroke:none}
    .d-glyph-stroke{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}
    .d-label{fill:var(--muted);font:600 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-label-sm{font-size:9px}
    .d-label-xs{font-size:8px;fill:var(--dim)}
    .d-label-left{text-anchor:start}
    .d-title{fill:var(--ink);font:700 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em;text-transform:uppercase}
    .d-accent-text{fill:var(--brand)}
    .d-good-text{fill:var(--good)}
    .d-dim-text{fill:var(--dim)}
    .d-on-accent{fill:#fff}
  </style>
  <rect class="d-canvas" x="0" y="0" width="400" height="170"/>
  <g class="d-hot" data-part="lt" data-name="Left trigger (LT)" data-desc="Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + microswitch." tabindex="0" role="img" aria-label="Left trigger (LT). Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + microswitch."><title>Left trigger (LT)</title><path class="d-part" d="M 129.3 28.4 L 128.1 42.0 L 125.0 46.3 L 121.3 48.4 L 117.4 49.9 L 113.6 51.5 L 109.9 53.3 L 106.2 55.2 L 102.6 57.3 L 99.1 59.4 L 95.7 61.8 L 92.4 64.2 L 89.3 66.8 L 86.2 69.5 L 83.2 72.3 L 80.4 75.2 L 77.2 77.8 L 72.0 78.9 L 58.9 75.1 L 58.9 75.1 L 51.5 63.4 L 52.3 57.0 L 55.4 52.3 L 59.2 48.3 L 63.2 44.4 L 67.3 40.8 L 71.6 37.3 L 76.0 34.1 L 80.5 31.0 L 85.2 28.1 L 89.9 25.4 L 94.8 22.8 L 99.7 20.5 L 104.7 18.4 L 109.8 16.4 L 115.2 15.5 L 121.2 17.1 L 129.3 28.4 Z"/><text class="d-label" x="89.84055085519243" y="45.20443265773032">LT</text></g><g class="d-hot" data-part="rt" data-name="Right trigger (RT)" data-desc="Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click." tabindex="0" role="img" aria-label="Right trigger (RT). Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click."><title>Right trigger (RT)</title><path class="d-part" d="M 270.7 28.4 L 271.9 42.0 L 275.0 46.3 L 278.7 48.4 L 282.6 49.9 L 286.4 51.5 L 290.1 53.3 L 293.8 55.2 L 297.4 57.3 L 300.9 59.4 L 304.3 61.8 L 307.6 64.2 L 310.7 66.8 L 313.8 69.5 L 316.8 72.3 L 319.6 75.2 L 322.8 77.8 L 328.0 78.9 L 341.1 75.1 L 341.1 75.1 L 348.5 63.4 L 347.7 57.0 L 344.6 52.3 L 340.8 48.3 L 336.8 44.4 L 332.7 40.8 L 328.4 37.3 L 324.0 34.1 L 319.5 31.0 L 314.8 28.1 L 310.1 25.4 L 305.2 22.8 L 300.3 20.5 L 295.3 18.4 L 290.2 16.4 L 284.8 15.5 L 278.8 17.1 L 270.7 28.4 Z"/><text class="d-label" x="310.1594491448076" y="45.20443265773032">RT</text></g><path class="d-body" d="M 74.1 140.3 C 55.2 135.7 44.0 117.7 51.5 95.3 C 64.7 61.5 98.4 36.8 136.0 30.0 L 264.0 30.0 C 301.6 36.8 335.3 61.5 348.5 95.3 C 356.0 117.7 344.8 135.7 325.9 140.3 C 264.0 156.0 136.0 156.0 74.1 140.3 Z"/><g class="d-hot" data-part="lb" data-name="Left bumper (LB)" data-desc="Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere." tabindex="0" role="img" aria-label="Left bumper (LB). Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 157.9 65.0 L 152.5 55.2 L 147.0 52.6 L 141.5 52.0 L 136.1 52.0 L 135.6 52.5 L 131.3 53.6 L 127.0 54.9 L 122.8 56.4 L 118.7 58.1 L 114.6 59.9 L 110.6 61.9 L 106.7 64.1 L 103.0 66.5 L 99.4 69.0 L 95.9 71.7 L 92.9 75.0 L 91.6 79.7 L 95.9 89.4 L 95.9 89.4 L 105.4 93.8 L 109.4 93.5 L 112.2 91.9 L 114.7 90.0 L 117.3 88.2 L 120.1 86.4 L 122.9 84.8 L 125.8 83.3 L 128.9 82.0 L 131.9 80.7 L 135.1 79.6 L 138.2 78.7 L 141.4 77.9 L 136.1 78.0 L 141.5 78.0 L 147.0 77.4 L 152.5 74.8 L 157.9 65.0 Z"/><text class="d-label" x="123.75239146980302" y="70.01363576552558">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 242.1 65.0 L 247.5 55.2 L 253.0 52.6 L 258.5 52.0 L 263.9 52.0 L 264.4 52.5 L 268.7 53.6 L 273.0 54.9 L 277.2 56.4 L 281.3 58.1 L 285.4 59.9 L 289.4 61.9 L 293.3 64.1 L 297.0 66.5 L 300.6 69.0 L 304.1 71.7 L 307.1 75.0 L 308.4 79.7 L 304.1 89.4 L 304.1 89.4 L 294.6 93.8 L 290.6 93.5 L 287.8 91.9 L 285.3 90.0 L 282.7 88.2 L 279.9 86.4 L 277.1 84.8 L 274.2 83.3 L 271.1 82.0 L 268.1 80.7 L 264.9 79.6 L 261.8 78.7 L 258.6 77.9 L 263.9 78.0 L 258.5 78.0 L 253.0 77.4 L 247.5 74.8 L 242.1 65.0 Z"/><text class="d-label" x="276.247608530197" y="70.01363576552558">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely." tabindex="0" role="img" aria-label="USB-C port. Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely."><title>USB-C port</title><rect class="d-port" x="184" y="22" width="32" height="16" rx="8"/><rect class="d-part-inset" x="190" y="26" width="20" height="8" rx="4"/><text class="d-label d-label-xs" x="200" y="50">USB-C</text></g>
</svg>
