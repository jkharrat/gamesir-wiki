<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 280" width="900" height="630" role="img" aria-label="GameSir T7 Pro — back layout schematic">
  <title>GameSir T7 Pro — back layout schematic</title>
  <desc>Original schematic diagram from the community-maintained GameSir Wiki. Not GameSir product photography.</desc>

  <style>
    :root { color-scheme: dark light; }
    svg { --ink:#f2f3f5; --muted:#a6aab3; --dim:#71757e; --line:#34343e;
          --s1:#121216; --s2:#17171d; --s3:#1e1e25; --inset:#0e0e12;
          --brand:#e5343c; --good:#35d07f; --warn:#ffc247; --bad:#ff6b6b; --info:#64a8ff; }
    @media (prefers-color-scheme: light) {
      svg { --ink:#16171a; --muted:#585d66; --dim:#80858d; --line:#cdced5;
            --s1:#fff; --s2:#fbfbfc; --s3:#f1f1f4; --inset:#f4f4f7;
            --brand:#d6272e; --good:#0f7a44; --warn:#8a5a00; --bad:#c02626; --info:#175fd0; }
    }
  </style>
  <style>
    .d-canvas{fill:var(--s1)}
    .d-body{fill:var(--s2);stroke:var(--line);stroke-width:2}
    .d-panel{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
    .d-part{fill:var(--s3);stroke:var(--line);stroke-width:1.4}
    .d-part-2{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-part-inset{fill:var(--inset);stroke:var(--line);stroke-width:1}
    .d-recess{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-port{fill:var(--inset);stroke:var(--muted);stroke-width:1.4}
    .d-plate{fill:var(--s3);stroke:var(--brand);stroke-width:1.6;opacity:.9}
    .d-btn,.d-btn-sm,.d-step{fill:var(--s3);stroke:var(--muted);stroke-width:1.3}
    .d-btn-good{fill:color-mix(in srgb,var(--good) 22%,transparent);stroke:var(--good)}
    .d-btn-bad{fill:color-mix(in srgb,var(--bad) 22%,transparent);stroke:var(--bad)}
    .d-btn-info{fill:color-mix(in srgb,var(--info) 22%,transparent);stroke:var(--info)}
    .d-btn-warn{fill:color-mix(in srgb,var(--warn) 22%,transparent);stroke:var(--warn)}
    .d-btn-letter{fill:var(--ink);font:700 12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-guide{fill:var(--s3);stroke:var(--muted);stroke-width:1.4}
    .d-guide-ring{fill:none;stroke:var(--line);stroke-width:1.2}
    .d-window{fill:var(--inset);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .d-gear{fill:var(--s3);stroke:var(--brand);stroke-width:1.4}
    .d-fence{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-glide-ring{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.7}
    .d-lit{fill:color-mix(in srgb,var(--brand) 26%,transparent);stroke:none;opacity:.55}
    .d-lit-good{fill:color-mix(in srgb,var(--good) 26%,transparent)}
    .d-lit-bad{fill:color-mix(in srgb,var(--bad) 26%,transparent)}
    .d-lit-info{fill:color-mix(in srgb,var(--info) 26%,transparent)}
    .d-lit-warn{fill:color-mix(in srgb,var(--warn) 26%,transparent)}
    .d-ring,.d-accent-ring{fill:none;stroke:var(--line);stroke-width:1.4}
    .d-accent-ring{stroke:var(--brand)}
    .d-swap-ring{fill:none;stroke:var(--brand);stroke-width:1.4;stroke-dasharray:5 4}
    .d-seam{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5}
    .d-rgb{fill:none;stroke:var(--brand);stroke-width:3.4;stroke-linecap:round;opacity:.75}
    .d-texture{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
    .d-ink{fill:none;stroke:var(--muted);stroke-width:1.6}
    .d-ink-thick{fill:none;stroke:var(--muted);stroke-width:3.4;stroke-linecap:round}
    .d-leader,.d-dim-stroke{fill:none;stroke:var(--dim);stroke-width:1.1}
    .d-travel{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
    .d-accent-stroke{fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round}
    .d-good-stroke{fill:none;stroke:var(--good);stroke-width:1.8}
    .d-warn-stroke{fill:none;stroke:var(--warn);stroke-width:1.8}
    .d-accent-fill{fill:var(--brand);stroke:none}
    .d-good-fill{fill:var(--good);stroke:none}
    .d-warn-fill{fill:var(--warn);stroke:none}
    .d-bad-fill{fill:var(--bad);stroke:none}
    .d-half-fill{fill:var(--muted);stroke:none}
    .d-dim-fill{fill:var(--dim);stroke:none}
    .d-deadzone{fill:color-mix(in srgb,var(--info) 26%,transparent);stroke:var(--info);stroke-width:1.2}
    .d-antideadzone{fill:color-mix(in srgb,var(--brand) 20%,transparent);stroke:var(--brand);stroke-width:1.2}
    .d-absent{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 3}
    .d-slash,.d-slash-line{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round}
    .d-lane{fill:var(--inset);stroke:var(--line);stroke-width:1.2}
    .d-lane.on{fill:color-mix(in srgb,var(--good) 12%,transparent);stroke:var(--good)}
    .d-lane-icon{color:var(--muted)}
    .d-glyph{fill:var(--muted);stroke:none}
    .d-glyph-stroke{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}
    .d-label{fill:var(--muted);font:600 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-label-sm{font-size:9px}
    .d-label-xs{font-size:8px;fill:var(--dim)}
    .d-label-left{text-anchor:start}
    .d-title{fill:var(--ink);font:700 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em;text-transform:uppercase}
    .d-accent-text{fill:var(--brand)}
    .d-good-text{fill:var(--good)}
    .d-dim-text{fill:var(--dim)}
    .d-on-accent{fill:#fff}
    .s-body{fill:none;stroke:var(--dim);stroke-width:3;opacity:.5}
    .s-shoulder{fill:none;stroke:var(--dim);stroke-width:3;opacity:.32}
    .s-ring,.s-part{fill:none;stroke:var(--dim);stroke-width:2.6;opacity:.42}
  </style>
  <rect class="d-canvas" x="0" y="0" width="400" height="280"/>
  <g class="d-hot" data-part="lt" data-name="Left trigger (LT)" data-desc="Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + stops." tabindex="0" role="img" aria-label="Left trigger (LT). Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + stops."><title>Left trigger (LT)</title><path class="d-part" d="M 151.7 41.9 L 148.6 66.2 L 145.1 69.3 L 141.6 69.6 L 138.0 69.9 L 134.6 70.4 L 131.1 71.0 L 127.8 71.6 L 124.4 72.4 L 121.1 73.3 L 117.9 74.3 L 114.7 75.5 L 111.6 76.7 L 108.6 78.1 L 105.6 79.5 L 102.7 81.1 L 99.9 82.8 L 95.6 82.4 L 77.9 65.2 L 77.9 65.2 L 67.5 42.8 L 70.6 37.3 L 75.5 34.3 L 80.5 31.5 L 85.5 29.1 L 90.6 26.8 L 95.7 24.7 L 100.8 22.9 L 106.0 21.3 L 111.1 19.9 L 116.3 18.7 L 121.4 17.7 L 126.5 16.8 L 131.6 16.1 L 136.5 15.6 L 141.4 15.2 L 146.4 17.8 L 151.7 41.9 Z"/><text class="d-label" x="109.25441181115869" y="32.590907710849606">LT</text></g><g class="d-hot" data-part="rt" data-name="Right trigger (RT)" data-desc="Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click." tabindex="0" role="img" aria-label="Right trigger (RT). Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click."><title>Right trigger (RT)</title><path class="d-part" d="M 248.3 41.9 L 251.4 66.2 L 254.9 69.3 L 258.4 69.6 L 262.0 69.9 L 265.4 70.4 L 268.9 71.0 L 272.2 71.6 L 275.6 72.4 L 278.9 73.3 L 282.1 74.3 L 285.3 75.5 L 288.4 76.7 L 291.4 78.1 L 294.4 79.5 L 297.3 81.1 L 300.1 82.8 L 304.4 82.4 L 322.1 65.2 L 322.1 65.2 L 332.5 42.8 L 329.4 37.3 L 324.5 34.3 L 319.5 31.5 L 314.5 29.1 L 309.4 26.8 L 304.3 24.7 L 299.2 22.9 L 294.0 21.3 L 288.9 19.9 L 283.7 18.7 L 278.6 17.7 L 273.5 16.8 L 268.4 16.1 L 263.5 15.6 L 258.6 15.2 L 253.6 17.8 L 248.3 41.9 Z"/><text class="d-label" x="290.7455881888413" y="32.590907710849606">RT</text></g><path class="d-body" d="M 200.0 56.0 C 180.7 56.0 157.8 52.5 133.2 56.0 C 108.7 59.5 85.7 70.1 69.9 91.3 C 57.6 109.2 53.3 130.4 55.9 151.6 C 58.5 178.2 68.2 206.7 87.5 224.3 C 103.3 238.5 124.5 242.0 140.3 231.4 C 152.6 223.4 157.8 211.9 161.3 194.2 C 164.0 188.4 170.1 181.4 182.5 179.7 C 188.5 178.8 194.8 178.8 200.0 178.8 C 205.2 178.8 211.5 178.8 217.5 179.7 C 229.9 181.4 236.0 188.4 238.7 194.2 C 242.2 211.9 247.4 223.4 259.7 231.4 C 275.5 242.0 296.7 238.5 312.5 224.3 C 331.8 206.7 341.5 178.2 344.1 151.6 C 346.7 130.4 342.4 109.2 330.1 91.3 C 314.3 70.1 291.4 59.5 266.8 56.0 C 242.2 52.5 219.3 56.0 200.0 56.0 Z"/><g class="d-hot" data-part="lb" data-name="Left bumper (LB)" data-desc="Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere." tabindex="0" role="img" aria-label="Left bumper (LB). Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 157.6 50.8 L 153.4 60.6 L 149.3 61.8 L 145.1 62.0 L 141.0 62.4 L 137.0 62.8 L 132.9 63.3 L 128.9 64.0 L 124.9 64.9 L 121.0 65.9 L 117.1 67.0 L 113.3 68.3 L 109.6 69.7 L 105.9 71.3 L 102.4 73.1 L 98.9 75.0 L 95.5 77.1 L 91.6 78.4 L 82.3 73.3 L 82.3 73.3 L 80.2 62.7 L 83.7 58.9 L 88.0 56.3 L 92.3 53.9 L 96.8 51.7 L 101.4 49.7 L 106.0 47.9 L 110.7 46.3 L 115.4 44.9 L 120.1 43.8 L 124.8 42.8 L 129.6 41.9 L 134.3 41.3 L 139.0 40.8 L 143.7 40.4 L 148.4 40.2 L 153.1 41.2 L 157.6 50.8 Z"/><text class="d-label d-label-sm" x="118.18668111548226" y="55.40017377990571">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 242.4 50.8 L 246.6 60.6 L 250.7 61.8 L 254.9 62.0 L 259.0 62.4 L 263.0 62.8 L 267.1 63.3 L 271.1 64.0 L 275.1 64.9 L 279.0 65.9 L 282.9 67.0 L 286.7 68.3 L 290.4 69.7 L 294.1 71.3 L 297.6 73.1 L 301.1 75.0 L 304.5 77.1 L 308.4 78.4 L 317.7 73.3 L 317.7 73.3 L 319.8 62.7 L 316.3 58.9 L 312.0 56.3 L 307.7 53.9 L 303.2 51.7 L 298.6 49.7 L 294.0 47.9 L 289.3 46.3 L 284.6 44.9 L 279.9 43.8 L 275.2 42.8 L 270.4 41.9 L 265.7 41.3 L 261.0 40.8 L 256.3 40.4 L 251.6 40.2 L 246.9 41.2 L 242.4 50.8 Z"/><text class="d-label d-label-sm" x="281.81331888451774" y="55.40017377990571">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and power. This model is wired-only, so the cable is the connection rather than a charging option." tabindex="0" role="img" aria-label="USB-C port. Data and power. This model is wired-only, so the cable is the connection rather than a charging option."><title>USB-C port</title><rect class="d-port" x="182" y="51.29" width="36" height="15" rx="7.5"/><rect class="d-part-inset" x="188" y="55.79" width="24" height="6" rx="3"/><text class="d-label d-label-xs" x="200" y="78.78999999999999">USB-C</text></g><g class="d-hot" data-part="gear" data-name="Trigger stop switches" data-desc="Physical switches that shorten the trigger from full analog travel to a short click. Two-stage physical trigger stops (long or short pull) selected with a gear switch; GameSir instructs you to gently pres…." tabindex="0" role="img" aria-label="Trigger stop switches. Physical switches that shorten the trigger from full analog travel to a short click. Two-stage physical trigger stops (long or short pull) selected with a gear switch; GameSir instructs you to gently pres…."><title>Trigger stop switches</title><rect class="d-part-2" x="103.25" y="83.84" width="34" height="15" rx="7.5"/><rect class="d-accent-fill" x="106.25" y="86.84" width="12" height="9" rx="4.5"/><text class="d-label d-label-xs" x="120.25" y="111.34">stop</text></g><g class="d-hot" data-part="gear" data-name="Trigger stop switches" data-desc="Physical switches that shorten the trigger from full analog travel to a short click. Two-stage physical trigger stops (long or short pull) selected with a gear switch; GameSir instructs you to gently pres…." tabindex="0" role="img" aria-label="Trigger stop switches. Physical switches that shorten the trigger from full analog travel to a short click. Two-stage physical trigger stops (long or short pull) selected with a gear switch; GameSir instructs you to gently pres…."><title>Trigger stop switches</title><rect class="d-part-2" x="262.75" y="83.84" width="34" height="15" rx="7.5"/><rect class="d-accent-fill" x="281.75" y="86.84" width="12" height="9" rx="4.5"/><text class="d-label d-label-xs" x="279.75" y="111.34">stop</text></g><g class="d-hot" data-part="l4" data-name="Rear button L4" data-desc="Remappable paddle reached by the middle finger. Ships as a null input, so it does nothing until it is assigned." tabindex="0" role="img" aria-label="Rear button L4. Remappable paddle reached by the middle finger. Ships as a null input, so it does nothing until it is assigned."><title>Rear button L4</title><g transform="rotate(-15 106.475 202.94)"><rect class="d-part-2" x="93.475" y="177.94" width="26" height="50" rx="13"/></g><text class="d-label d-label-sm" x="106.475" y="202.94">L4</text></g><g class="d-hot" data-part="r4" data-name="Rear button R4" data-desc="Remappable paddle on the right grip, assigned the same way as L4." tabindex="0" role="img" aria-label="Rear button R4. Remappable paddle on the right grip, assigned the same way as L4."><title>Rear button R4</title><g transform="rotate(15 293.525 202.94)"><rect class="d-part-2" x="280.525" y="177.94" width="26" height="50" rx="13"/></g><text class="d-label d-label-sm" x="293.525" y="202.94">R4</text></g><g class="d-hot" data-part="grip" data-name="Grip" data-desc="Textured grip. Documented weight for the whole controller: 217 g." tabindex="0" role="img" aria-label="Grip. Textured grip. Documented weight for the whole controller: 217 g."><title>Grip</title><path class="d-texture" d="M 72.2 174.1 L 72.9 176.6 L 73.7 179.1 L 74.6 181.6 L 75.5 184.0 L 76.4 186.5 L 77.4 188.8 L 78.5 191.2 L 79.6 193.5 L 80.8 195.8 L 82.0 198.0 L 83.3 200.2 L 84.6 202.3 L 86.0 204.4 L 87.5 206.4 L 89.0 208.4 L 90.5 210.3 L 92.2 212.1 L 93.8 213.8"/><path class="d-texture" d="M 85.7 170.3 L 86.3 172.5 L 87.0 174.8 L 87.8 176.9 L 88.6 179.1 L 89.4 181.2 L 90.3 183.3 L 91.2 185.3 L 92.1 187.3 L 93.1 189.2 L 94.1 191.1 L 95.2 192.9 L 96.3 194.7 L 97.5 196.4 L 98.7 198.0 L 99.9 199.6 L 101.1 201.1 L 102.4 202.5 L 103.7 203.9"/><path class="d-texture" d="M 327.8 174.1 L 327.1 176.6 L 326.3 179.1 L 325.4 181.6 L 324.5 184.0 L 323.6 186.5 L 322.6 188.8 L 321.5 191.2 L 320.4 193.5 L 319.2 195.8 L 318.0 198.0 L 316.7 200.2 L 315.4 202.3 L 314.0 204.4 L 312.5 206.4 L 311.0 208.4 L 309.5 210.3 L 307.8 212.1 L 306.2 213.8"/><path class="d-texture" d="M 314.3 170.3 L 313.7 172.5 L 313.0 174.8 L 312.2 176.9 L 311.4 179.1 L 310.6 181.2 L 309.7 183.3 L 308.8 185.3 L 307.9 187.3 L 306.9 189.2 L 305.9 191.1 L 304.8 192.9 L 303.7 194.7 L 302.5 196.4 L 301.3 198.0 L 300.1 199.6 L 298.9 201.1 L 297.6 202.5 L 296.3 203.9"/></g>
</svg>
