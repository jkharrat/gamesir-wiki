<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="900" height="383" role="img" aria-label="GameSir G7 SE — top edge layout schematic">
  <title>GameSir G7 SE — top edge layout schematic</title>
  <desc>Original schematic diagram from the community-maintained GameSir Wiki. Not GameSir product photography.</desc>

  <style>
    :root { color-scheme: dark light; }
    svg { --ink:#f2f3f5; --muted:#a6aab3; --dim:#71757e; --line:#34343e;
          --s1:#121216; --s2:#17171d; --s3:#1e1e25; --inset:#0e0e12;
          --brand:#e5343c; --good:#35d07f; --warn:#ffc247; --bad:#ff6b6b; --info:#64a8ff; }
    @media (prefers-color-scheme: light) {
      svg { --ink:#16171a; --muted:#585d66; --dim:#80858d; --line:#cdced5;
            --s1:#fff; --s2:#fbfbfc; --s3:#f1f1f4; --inset:#f4f4f7;
            --brand:#d6272e; --good:#0f7a44; --warn:#8a5a00; --bad:#c02626; --info:#175fd0; }
    }
  </style>
  <style>
    .d-canvas{fill:var(--s1)}
    .d-body{fill:var(--s2);stroke:var(--line);stroke-width:2}
    .d-panel{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
    .d-part{fill:var(--s3);stroke:var(--line);stroke-width:1.4}
    .d-part-2{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-part-inset{fill:var(--inset);stroke:var(--line);stroke-width:1}
    .d-recess{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-port{fill:var(--inset);stroke:var(--muted);stroke-width:1.4}
    .d-plate{fill:var(--s3);stroke:var(--brand);stroke-width:1.6;opacity:.9}
    .d-btn,.d-btn-sm,.d-step{fill:var(--s3);stroke:var(--muted);stroke-width:1.3}
    .d-btn-good{fill:color-mix(in srgb,var(--good) 22%,transparent);stroke:var(--good)}
    .d-btn-bad{fill:color-mix(in srgb,var(--bad) 22%,transparent);stroke:var(--bad)}
    .d-btn-info{fill:color-mix(in srgb,var(--info) 22%,transparent);stroke:var(--info)}
    .d-btn-warn{fill:color-mix(in srgb,var(--warn) 22%,transparent);stroke:var(--warn)}
    .d-btn-letter{fill:var(--ink);font:700 12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-guide{fill:var(--s3);stroke:var(--muted);stroke-width:1.4}
    .d-guide-ring{fill:none;stroke:var(--line);stroke-width:1.2}
    .d-window{fill:var(--inset);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .d-gear{fill:var(--s3);stroke:var(--brand);stroke-width:1.4}
    .d-fence{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-glide-ring{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.7}
    .d-lit{fill:color-mix(in srgb,var(--brand) 26%,transparent);stroke:none;opacity:.55}
    .d-lit-good{fill:color-mix(in srgb,var(--good) 26%,transparent)}
    .d-lit-bad{fill:color-mix(in srgb,var(--bad) 26%,transparent)}
    .d-lit-info{fill:color-mix(in srgb,var(--info) 26%,transparent)}
    .d-lit-warn{fill:color-mix(in srgb,var(--warn) 26%,transparent)}
    .d-ring,.d-accent-ring{fill:none;stroke:var(--line);stroke-width:1.4}
    .d-accent-ring{stroke:var(--brand)}
    .d-swap-ring{fill:none;stroke:var(--brand);stroke-width:1.4;stroke-dasharray:5 4}
    .d-seam{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5}
    .d-rgb{fill:none;stroke:var(--brand);stroke-width:3.4;stroke-linecap:round;opacity:.75}
    .d-texture{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
    .d-ink{fill:none;stroke:var(--muted);stroke-width:1.6}
    .d-ink-thick{fill:none;stroke:var(--muted);stroke-width:3.4;stroke-linecap:round}
    .d-leader,.d-dim-stroke{fill:none;stroke:var(--dim);stroke-width:1.1}
    .d-travel{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
    .d-accent-stroke{fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round}
    .d-good-stroke{fill:none;stroke:var(--good);stroke-width:1.8}
    .d-warn-stroke{fill:none;stroke:var(--warn);stroke-width:1.8}
    .d-accent-fill{fill:var(--brand);stroke:none}
    .d-good-fill{fill:var(--good);stroke:none}
    .d-warn-fill{fill:var(--warn);stroke:none}
    .d-bad-fill{fill:var(--bad);stroke:none}
    .d-half-fill{fill:var(--muted);stroke:none}
    .d-dim-fill{fill:var(--dim);stroke:none}
    .d-deadzone{fill:color-mix(in srgb,var(--info) 26%,transparent);stroke:var(--info);stroke-width:1.2}
    .d-antideadzone{fill:color-mix(in srgb,var(--brand) 20%,transparent);stroke:var(--brand);stroke-width:1.2}
    .d-absent{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 3}
    .d-slash,.d-slash-line{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round}
    .d-lane{fill:var(--inset);stroke:var(--line);stroke-width:1.2}
    .d-lane.on{fill:color-mix(in srgb,var(--good) 12%,transparent);stroke:var(--good)}
    .d-lane-icon{color:var(--muted)}
    .d-glyph{fill:var(--muted);stroke:none}
    .d-glyph-stroke{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}
    .d-label{fill:var(--muted);font:600 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-label-sm{font-size:9px}
    .d-label-xs{font-size:8px;fill:var(--dim)}
    .d-label-left{text-anchor:start}
    .d-title{fill:var(--ink);font:700 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em;text-transform:uppercase}
    .d-accent-text{fill:var(--brand)}
    .d-good-text{fill:var(--good)}
    .d-dim-text{fill:var(--dim)}
    .d-on-accent{fill:#fff}
    .s-body{fill:none;stroke:var(--dim);stroke-width:3;opacity:.5}
    .s-shoulder{fill:none;stroke:var(--dim);stroke-width:3;opacity:.32}
    .s-ring,.s-part{fill:none;stroke:var(--dim);stroke-width:2.6;opacity:.42}
  </style>
  <rect class="d-canvas" x="0" y="0" width="400" height="170"/>
  <g class="d-hot" data-part="lt" data-name="Left trigger (LT)" data-desc="Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect analog." tabindex="0" role="img" aria-label="Left trigger (LT). Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect analog."><title>Left trigger (LT)</title><path class="d-part" d="M 148.4 28.0 L 143.4 45.9 L 138.5 48.0 L 137.2 48.4 L 133.4 49.4 L 129.4 50.6 L 125.4 51.9 L 121.5 53.5 L 117.7 55.2 L 113.9 57.0 L 110.2 59.0 L 106.6 61.2 L 103.1 63.5 L 99.7 65.9 L 96.5 68.5 L 93.3 71.2 L 90.3 74.1 L 85.9 75.7 L 69.4 67.4 L 69.4 67.4 L 59.4 51.5 L 62.1 45.8 L 66.4 41.7 L 70.9 37.8 L 75.6 34.1 L 80.4 30.6 L 85.3 27.3 L 90.4 24.3 L 95.6 21.5 L 100.9 18.9 L 106.3 16.5 L 111.8 14.4 L 117.4 12.5 L 123.0 10.8 L 129.2 9.3 L 138.5 8.0 L 143.4 10.1 L 148.4 28.0 Z"/><text class="d-label" x="99.23259484483395" y="28.566613922465436">LT</text></g><g class="d-hot" data-part="rt" data-name="Right trigger (RT)" data-desc="Analog trigger, normally fire or accelerate." tabindex="0" role="img" aria-label="Right trigger (RT). Analog trigger, normally fire or accelerate."><title>Right trigger (RT)</title><path class="d-part" d="M 251.6 28.0 L 256.6 45.9 L 261.5 48.0 L 262.8 48.4 L 266.6 49.4 L 270.6 50.6 L 274.6 51.9 L 278.5 53.5 L 282.3 55.2 L 286.1 57.0 L 289.8 59.0 L 293.4 61.2 L 296.9 63.5 L 300.3 65.9 L 303.5 68.5 L 306.7 71.2 L 309.7 74.1 L 314.1 75.7 L 330.6 67.4 L 330.6 67.4 L 340.6 51.5 L 337.9 45.8 L 333.6 41.7 L 329.1 37.8 L 324.4 34.1 L 319.6 30.6 L 314.7 27.3 L 309.6 24.3 L 304.4 21.5 L 299.1 18.9 L 293.7 16.5 L 288.2 14.4 L 282.6 12.5 L 277.0 10.8 L 270.8 9.3 L 261.5 8.0 L 256.6 10.1 L 251.6 28.0 Z"/><text class="d-label" x="300.76740515516605" y="28.566613922465436">RT</text></g><path class="d-body" d="M 77.3 140.3 C 58.9 135.7 48.0 117.7 55.3 95.3 C 68.2 61.5 101.0 36.8 137.7 30.0 L 262.3 30.0 C 299.0 36.8 331.8 61.5 344.7 95.3 C 352.0 117.7 341.1 135.7 322.7 140.3 C 262.3 156.0 137.7 156.0 77.3 140.3 Z"/><g class="d-hot" data-part="lb" data-name="Left bumper (LB)" data-desc="Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere." tabindex="0" role="img" aria-label="Left bumper (LB). Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 148.4 69.0 L 143.4 57.4 L 138.5 56.0 L 138.8 56.3 L 135.5 57.1 L 131.8 58.2 L 128.2 59.5 L 124.6 60.9 L 121.0 62.4 L 117.6 64.1 L 114.2 66.0 L 110.9 67.9 L 107.7 70.1 L 104.6 72.3 L 101.6 74.7 L 98.7 77.1 L 96.0 79.7 L 94.4 83.4 L 101.0 93.5 L 101.0 93.5 L 111.6 99.0 L 114.4 98.1 L 116.2 96.4 L 118.2 94.6 L 120.3 93.0 L 122.4 91.4 L 124.7 89.9 L 127.1 88.5 L 129.5 87.2 L 131.9 86.0 L 134.5 84.9 L 137.1 83.9 L 139.7 83.0 L 142.3 82.2 L 144.0 81.7 L 138.5 82.0 L 143.4 80.6 L 148.4 69.0 Z"/><text class="d-label" x="123.5122058284514" y="75.66787306765988">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 251.6 69.0 L 256.6 57.4 L 261.5 56.0 L 261.2 56.3 L 264.5 57.1 L 268.2 58.2 L 271.8 59.5 L 275.4 60.9 L 279.0 62.4 L 282.4 64.1 L 285.8 66.0 L 289.1 67.9 L 292.3 70.1 L 295.4 72.3 L 298.4 74.7 L 301.3 77.1 L 304.0 79.7 L 305.6 83.4 L 299.0 93.5 L 299.0 93.5 L 288.4 99.0 L 285.6 98.1 L 283.8 96.4 L 281.8 94.6 L 279.7 93.0 L 277.6 91.4 L 275.3 89.9 L 272.9 88.5 L 270.5 87.2 L 268.1 86.0 L 265.5 84.9 L 262.9 83.9 L 260.3 83.0 L 257.7 82.2 L 256.0 81.7 L 261.5 82.0 L 256.6 80.6 L 251.6 69.0 Z"/><text class="d-label" x="276.4877941715486" y="75.66787306765988">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and power. This model is wired-only, so the cable is the connection rather than a charging option." tabindex="0" role="img" aria-label="USB-C port. Data and power. This model is wired-only, so the cable is the connection rather than a charging option."><title>USB-C port</title><rect class="d-port" x="184" y="22" width="32" height="16" rx="8"/><rect class="d-part-inset" x="190" y="26" width="20" height="8" rx="4"/><text class="d-label d-label-xs" x="200" y="50">USB-C</text></g>
</svg>
