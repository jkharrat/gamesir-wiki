 63.2 L 281.7 64.2 L 285.9 65.4 L 290.1 66.7 L 294.3 68.3 L 298.4 69.9 L 302.3 71.8 L 306.2 73.9 L 310.0 76.1 L 314.0 78.0 L 319.1 78.6 L 329.3 73.8 L 329.3 73.8 L 331.6 62.6 L 328.6 57.2 L 324.2 53.5 L 319.3 50.5 L 314.3 47.9 L 309.2 45.5 L 304.0 43.3 L 298.8 41.4 L 293.5 39.7 L 288.1 38.3 L 282.8 37.1 L 277.4 36.0 L 272.1 35.2 L 266.8 34.6 L 261.5 34.2 L 256.2 34.5 L 251.0 36.9 L 246.0 47.0 Z"/><text class="d-label d-label-sm" x="289.6969715312999" y="52.56457923216102">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely." tabindex="0" role="img" aria-label="USB-C port. Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely."><title>USB-C port</title><rect class="d-port" x="182" y="51.68" width="36" height="15" rx="7.5"/><rect class="d-part-inset" x="188" y="56.18" width="24" height="6" rx="3"/><text class="d-label d-label-xs" x="200" y="79.18">USB-C</text></g><g class="d-hot" data-part="gear" data-name="Trigger stop switches" data-desc="Physical switches that shorten the trigger from full analog travel to a short click. A physical trigger gear switch selects long-pull or short-pull position." tabindex="0" role="img" aria-label="Trigger stop switches. Physical switches that shorten the trigger from full analog travel to a short click. A physical trigger gear switch selects long-pull or short-pull position."><title>Trigger stop switches</title><rect class="d-part-2" x="97.19999999999999" y="88.78" width="34" height="15" rx="7.5"/><rect class="d-accent-fill" x="100.19999999999999" y="91.78" width="12" height="9" rx="4.5"/><text class="d-label d-label-xs" x="114.19999999999999" y="116.28">stop</text></g><g class="d-hot" data-part="gear" data-name="Trigger stop switches" data-desc="Physical switches that shorten the trigger from full analog travel to a short click. A physical trigger gear switch selects long-pull or short-pull position." tabindex="0" role="img" aria-label="Trigger stop switches. Physical switches that shorten the trigger from full analog travel to a short click. A physical trigger gear switch selects long-pull or short-pull position."><title>Trigger stop switches</title><rect class="d-part-2" x="268.8" y="88.78" width="34" height="15" rx="7.5"/><rect class="d-accent-fill" x="287.8" y="91.78" width="12" height="9" rx="4.5"/><text class="d-label d-label-xs" x="285.8" y="116.28">stop</text></g><g class="d-hot" data-part="l4" data-name="Rear button L4" data-desc="Remappable paddle reached by the middle finger. Ships as a null input, so it does nothing until it is assigned." tabindex="0" role="img" aria-label="Rear button L4. Remappable paddle reached by the middle finger. Ships as a null input, so it does nothing until it is assigned."><title>Rear button L4</title><g transform="rotate(-15 99.38 223.48000000000002)"><rect class="d-part-2" x="86.38" y="198.48000000000002" width="26" height="50" rx="13"/></g><text class="d-label d-label-sm" x="99.38" y="223.48000000000002">L4</text></g><g class="d-hot" data-part="r4" data-name="Rear button R4" data-desc="Remappable paddle on the right grip, assigned the same way as L4." tabindex="0" role="img" aria-label="Rear button R4. Remappable paddle on the right grip, assigned the same way as L4."><title>Rear button R4</title><g transform="rotate(15 300.62 223.48000000000002)"><rect class="d-part-2" x="287.62" y="198.48000000000002" width="26" height="50" rx="13"/></g><text class="d-label d-label-sm" x="300.62" y="223.48000000000002">R4</text></g><g class="d-hot" data-part="modeSwitch" data-name="Connection switch" data-desc="Three-position slider selecting 2.4 GHz, off, or Bluetooth. Because it is mechanical, the controller stays in the selected mode across a power cycle." tabindex="0" role="img" aria-label="Connection switch. Three-position slider selecting 2.4 GHz, off, or Bluetooth. Because it is mechanical, the controller stays in the selected mode across a power cycle."><title>Connection switch</title><rect class="d-part-inset" x="176" y="143.4" width="48" height="16" rx="8"/><rect class="d-accent-fill" x="179" y="146.4" width="13" height="10" rx="5"/><text class="d-label d-label-xs" x="200" y="171.4">2.4G / OFF / BT</text></g><g class="d-hot" data-part="grip" data-name="Grip" data-desc="Textured grip. Documented weight for the whole controller: 263 g / 0.58 lbs." tabindex="0" role="img" aria-label="Grip. Textured grip. Documented weight for the whole controller: 263 g / 0.58 lbs."><title>Grip</title><path class="d-texture" d="M 61.6 190.8 L 62.4 193.8 L 63.2 196.7 L 64.1 199.5 L 65.1 202.4 L 66.1 205.2 L 67.2 208.0 L 68.4 210.7 L 69.6 213.4 L 70.9 216.0 L 72.2 218.7 L 73.6 221.2 L 75.1 223.7 L 76.6 226.1 L 78.2 228.5 L 79.9 230.8 L 81.7 233.1 L 83.5 235.2 L 85.4 237.3"/><path class="d-texture" d="M 75.1 187.3 L 75.9 190.0 L 76.6 192.6 L 77.4 195.2 L 78.3 197.7 L 79.2 200.2 L 80.2 202.7 L 81.2 205.1 L 82.3 207.5 L 83.4 209.8 L 84.6 212.1 L 85.8 214.3 L 87.0 216.4 L 88.3 218.5 L 89.7 220.5 L 91.1 222.4 L 92.5 224.2 L 94.0 226.0 L 95.5 227.6"/><path class="d-texture" d="M 338.4 190.8 L 337.6 193.8 L 336.8 196.7 L 335.9 199.5 L 334.9 202.4 L 333.9 205.2 L 332.8 208.0 L 331.6 210.7 L 330.4 213.4 L 329.1 216.0 L 327.8 218.7 L 326.4 221.2 L 324.9 223.7 L 323.4 226.1 L 321.8 228.5 L 320.1 230.8 L 318.3 233.1 L 316.5 235.2 L 314.6 237.3"/><path class="d-texture" d="M 324.9 187.3 L 324.1 190.0 L 323.4 192.6 L 322.6 195.2 L 321.7 197.7 L 320.8 200.2 L 319.8 202.7 L 318.8 205.1 L 317.7 207.5 L 316.6 209.8 L 315.4 212.1 L 314.2 214.3 L 313.0 216.4 L 311.7 218.5 L 310.3 220.5 L 308.9 222.4 L 307.5 224.2 L 306.0 226.0 L 304.5 227.6"/></g>
</svg>
