.5 L 276.9 65.3 L 281.2 66.2 L 285.4 67.4 L 289.5 68.7 L 293.5 70.2 L 297.5 71.8 L 301.4 73.7 L 305.2 75.7 L 308.9 77.9 L 312.4 80.2 L 316.7 81.7 L 327.2 76.1 L 327.2 76.1 L 330.3 64.3 L 326.6 60.0 L 322.0 57.0 L 317.3 54.1 L 312.5 51.6 L 307.5 49.2 L 302.5 47.2 L 297.4 45.3 L 292.3 43.7 L 287.1 42.3 L 281.9 41.1 L 276.7 40.1 L 271.5 39.3 L 266.4 38.7 L 261.2 38.3 L 256.1 38.0 L 251.0 39.1 L 246.0 50.1 Z"/><text class="d-label d-label-sm" x="288.8281291559657" y="55.52701895037407">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely." tabindex="0" role="img" aria-label="USB-C port. Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely."><title>USB-C port</title><rect class="d-port" x="182" y="51.68" width="36" height="15" rx="7.5"/><rect class="d-part-inset" x="188" y="56.18" width="24" height="6" rx="3"/><text class="d-label d-label-xs" x="200" y="79.18">USB-C</text></g><g class="d-hot" data-part="gear" data-name="Trigger stop switches" data-desc="Physical switches that shorten the trigger from full analog travel to a short click. A physical trigger gear switch selects long-pull or short-pull position." tabindex="0" role="img" aria-label="Trigger stop switches. Physical switches that shorten the trigger from full analog travel to a short click. A physical trigger gear switch selects long-pull or short-pull position."><title>Trigger stop switches</title><rect class="d-part-2" x="97.19999999999999" y="88.78" width="34" height="15" rx="7.5"/><rect class="d-accent-fill" x="100.19999999999999" y="91.78" width="12" height="9" rx="4.5"/><text class="d-label d-label-xs" x="114.19999999999999" y="116.28">stop</text></g><g class="d-hot" data-part="gear" data-name="Trigger stop switches" data-desc="Physical switches that shorten the trigger from full analog travel to a short click. A physical trigger gear switch selects long-pull or short-pull position." tabindex="0" role="img" aria-label="Trigger stop switches. Physical switches that shorten the trigger from full analog travel to a short click. A physical trigger gear switch selects long-pull or short-pull position."><title>Trigger stop switches</title><rect class="d-part-2" x="268.8" y="88.78" width="34" height="15" rx="7.5"/><rect class="d-accent-fill" x="287.8" y="91.78" width="12" height="9" rx="4.5"/><text class="d-label d-label-xs" x="285.8" y="116.28">stop</text></g><g class="d-hot" data-part="l4" data-name="Rear button L4" data-desc="Remappable paddle reached by the middle finger. Ships as a null input, so it does nothing until it is assigned." tabindex="0" role="img" aria-label="Rear button L4. Remappable paddle reached by the middle finger. Ships as a null input, so it does nothing until it is assigned."><title>Rear button L4</title><g transform="rotate(-15 99.38 223.48000000000002)"><rect class="d-part-2" x="86.38" y="198.48000000000002" width="26" height="50" rx="13"/></g><text class="d-label d-label-sm" x="99.38" y="223.48000000000002">L4</text></g><g class="d-hot" data-part="r4" data-name="Rear button R4" data-desc="Remappable paddle on the right grip, assigned the same way as L4." tabindex="0" role="img" aria-label="Rear button R4. Remappable paddle on the right grip, assigned the same way as L4."><title>Rear button R4</title><g transform="rotate(15 300.62 223.48000000000002)"><rect class="d-part-2" x="287.62" y="198.48000000000002" width="26" height="50" rx="13"/></g><text class="d-label d-label-sm" x="300.62" y="223.48000000000002">R4</text></g><g class="d-hot" data-part="modeSwitch" data-name="Connection switch" data-desc="Three-position slider selecting 2.4 GHz, off, or Bluetooth. Because it is mechanical, the controller stays in the selected mode across a power cycle." tabindex="0" role="img" aria-label="Connection switch. Three-position slider selecting 2.4 