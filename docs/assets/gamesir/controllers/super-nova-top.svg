<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="900" height="383" role="img" aria-label="GameSir Super Nova — top edge layout schematic">
  <title>GameSir Super Nova — top edge layout schematic</title>
  <desc>Original schematic diagram from the community-maintained GameSir Wiki. Not GameSir product photography.</desc>

  <style>
    :root { color-scheme: dark light; }
    svg { --ink:#f2f3f5; --muted:#a6aab3; --dim:#71757e; --line:#34343e;
          --s1:#121216; --s2:#17171d; --s3:#1e1e25; --inset:#0e0e12;
          --brand:#e5343c; --good:#35d07f; --warn:#ffc247; --bad:#ff6b6b; --info:#64a8ff; }
    @media (prefers-color-scheme: light) {
      svg { --ink:#16171a; --muted:#585d66; --dim:#80858d; --line:#cdced5;
            --s1:#fff; --s2:#fbfbfc; --s3:#f1f1f4; --inset:#f4f4f7;
            --brand:#d6272e; --good:#0f7a44; --warn:#8a5a00; --bad:#c02626; --info:#175fd0; }
    }
  </style>
  <style>
    .d-canvas{fill:var(--s1)}
    .d-body{fill:var(--s2);stroke:var(--line);stroke-width:2}
    .d-panel{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
    .d-part{fill:var(--s3);stroke:var(--line);stroke-width:1.4}
    .d-part-2{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-part-inset{fill:var(--inset);stroke:var(--line);stroke-width:1}
    .d-recess{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-port{fill:var(--inset);stroke:var(--muted);stroke-width:1.4}
    .d-plate{fill:var(--s3);stroke:var(--brand);stroke-width:1.6;opacity:.9}
    .d-btn,.d-btn-sm,.d-step{fill:var(--s3);stroke:var(--muted);stroke-width:1.3}
    .d-btn-good{fill:color-mix(in srgb,var(--good) 22%,transparent);stroke:var(--good)}
    .d-btn-bad{fill:color-mix(in srgb,var(--bad) 22%,transparent);stroke:var(--bad)}
    .d-btn-info{fill:color-mix(in srgb,var(--info) 22%,transparent);stroke:var(--info)}
    .d-btn-warn{fill:color-mix(in srgb,var(--warn) 22%,transparent);stroke:var(--warn)}
    .d-btn-letter{fill:var(--ink);font:700 12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-guide{fill:var(--s3);stroke:var(--muted);stroke-width:1.4}
    .d-guide-ring{fill:none;stroke:var(--line);stroke-width:1.2}
    .d-window{fill:var(--inset);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .d-gear{fill:var(--s3);stroke:var(--brand);stroke-width:1.4}
    .d-fence{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-glide-ring{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.7}
    .d-lit{fill:color-mix(in srgb,var(--brand) 26%,transparent);stroke:none;opacity:.55}
    .d-lit-good{fill:color-mix(in srgb,var(--good) 26%,transparent)}
    .d-lit-bad{fill:color-mix(in srgb,var(--bad) 26%,transparent)}
    .d-lit-info{fill:color-mix(in srgb,var(--info) 26%,transparent)}
    .d-lit-warn{fill:color-mix(in srgb,var(--warn) 26%,transparent)}
    .d-ring,.d-accent-ring{fill:none;stroke:var(--line);stroke-width:1.4}
    .d-accent-ring{stroke:var(--brand)}
    .d-swap-ring{fill:none;stroke:var(--brand);stroke-width:1.4;stroke-dasharray:5 4}
    .d-seam{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5}
    .d-rgb{fill:none;stroke:var(--brand);stroke-width:3.4;stroke-linecap:round;opacity:.75}
    .d-texture{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
    .d-ink{fill:none;stroke:var(--muted);stroke-width:1.6}
    .d-ink-thick{fill:none;stroke:var(--muted);stroke-width:3.4;stroke-linecap:round}
    .d-leader,.d-dim-stroke{fill:none;stroke:var(--dim);stroke-width:1.1}
    .d-travel{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
    .d-accent-stroke{fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round}
    .d-good-stroke{fill:none;stroke:var(--good);stroke-width:1.8}
    .d-warn-stroke{fill:none;stroke:var(--warn);stroke-width:1.8}
    .d-accent-fill{fill:var(--brand);stroke:none}
    .d-good-fill{fill:var(--good);stroke:none}
    .d-warn-fill{fill:var(--warn);stroke:none}
    .d-bad-fill{fill:var(--bad);stroke:none}
    .d-half-fill{fill:var(--muted);stroke:none}
    .d-dim-fill{fill:var(--dim);stroke:none}
    .d-deadzone{fill:color-mix(in srgb,var(--info) 26%,transparent);stroke:var(--info);stroke-width:1.2}
    .d-antideadzone{fill:color-mix(in srgb,var(--brand) 20%,transparent);stroke:var(--brand);stroke-width:1.2}
    .d-absent{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 3}
    .d-slash,.d-slash-line{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round}
    .d-lane{fill:var(--inset);stroke:var(--line);stroke-width:1.2}
    .d-lane.on{fill:color-mix(in srgb,var(--good) 12%,transparent);stroke:var(--good)}
    .d-lane-icon{color:var(--muted)}
    .d-glyph{fill:var(--muted);stroke:none}
    .d-glyph-stroke{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}
    .d-label{fill:var(--muted);font:600 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-label-sm{font-size:9px}
    .d-label-xs{font-size:8px;fill:var(--dim)}
    .d-label-left{text-anchor:start}
    .d-title{fill:var(--ink);font:700 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em;text-transform:uppercase}
    .d-accent-text{fill:var(--brand)}
    .d-good-text{fill:var(--good)}
    .d-dim-text{fill:var(--dim)}
    .d-on-accent{fill:#fff}
    .s-body{fill:none;stroke:var(--dim);stroke-width:3;opacity:.5}
    .s-shoulder{fill:none;stroke:var(--dim);stroke-width:3;opacity:.32}
    .s-ring,.s-part{fill:none;stroke:var(--dim);stroke-width:2.6;opacity:.42}
  </style>
  <rect class="d-canvas" x="0" y="0" width="400" height="170"/>
  <g class="d-hot" data-part="lt" data-name="Left trigger (LT)" data-desc="Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + stops." tabindex="0" role="img" aria-label="Left trigger (LT). Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + stops."><title>Left trigger (LT)</title><path class="d-part" d="M 148.2 28.0 L 143.2 45.9 L 138.2 48.0 L 135.4 48.3 L 132.5 49.1 L 128.4 50.1 L 124.2 51.3 L 120.2 52.7 L 116.2 54.2 L 112.3 55.9 L 108.4 57.8 L 104.6 59.7 L 101.0 61.9 L 97.4 64.1 L 94.0 66.6 L 90.7 69.1 L 87.5 71.8 L 83.0 73.1 L 67.0 63.9 L 67.0 63.9 L 58.0 47.4 L 61.0 41.8 L 65.6 38.0 L 70.3 34.3 L 75.2 30.9 L 80.2 27.7 L 85.3 24.8 L 90.5 22.0 L 95.8 19.5 L 101.2 17.2 L 106.6 15.1 L 112.2 13.2 L 117.8 11.6 L 123.4 10.1 L 130.7 8.8 L 138.2 8.0 L 143.2 10.1 L 148.2 28.0 Z"/><text class="d-label" x="99.06801230566495" y="26.766695103781025">LT</text></g><g class="d-hot" data-part="rt" data-name="Right trigger (RT)" data-desc="Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click." tabindex="0" role="img" aria-label="Right trigger (RT). Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click."><title>Right trigger (RT)</title><path class="d-part" d="M 251.8 28.0 L 256.8 45.9 L 261.8 48.0 L 264.6 48.3 L 267.5 49.1 L 271.6 50.1 L 275.8 51.3 L 279.8 52.7 L 283.8 54.2 L 287.7 55.9 L 291.6 57.8 L 295.4 59.7 L 299.0 61.9 L 302.6 64.1 L 306.0 66.6 L 309.3 69.1 L 312.5 71.8 L 317.0 73.1 L 333.0 63.9 L 333.0 63.9 L 342.0 47.4 L 339.0 41.8 L 334.4 38.0 L 329.7 34.3 L 324.8 30.9 L 319.8 27.7 L 314.7 24.8 L 309.5 22.0 L 304.2 19.5 L 298.8 17.2 L 293.4 15.1 L 287.8 13.2 L 282.2 11.6 L 276.6 10.1 L 269.3 8.8 L 261.8 8.0 L 256.8 10.1 L 251.8 28.0 Z"/><text class="d-label" x="300.931987694335" y="26.766695103781025">RT</text></g><path class="d-body" d="M 74.1 133.3 C 55.2 129.0 44.0 112.1 51.5 91.1 C 64.7 59.5 98.4 36.4 136.0 30.0 L 264.0 30.0 C 301.6 36.4 335.3 59.5 348.5 91.1 C 356.0 112.1 344.8 129.0 325.9 133.3 C 264.0 148.0 136.0 148.0 74.1 133.3 Z"/><g class="d-hot" data-part="lb" data-name="Left bumper (LB)" data-desc="Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere." tabindex="0" role="img" aria-label="Left bumper (LB). Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 148.2 69.0 L 143.2 57.4 L 138.2 56.0 L 136.4 56.2 L 134.3 56.9 L 130.5 57.8 L 126.7 59.0 L 122.9 60.2 L 119.2 61.7 L 115.6 63.2 L 112.0 64.9 L 108.5 66.7 L 105.1 68.7 L 101.9 70.8 L 98.7 73.0 L 95.7 75.3 L 92.8 77.8 L 91.0 81.3 L 97.0 91.8 L 97.0 91.8 L 107.3 98.0 L 110.0 97.2 L 112.0 95.6 L 114.1 94.0 L 116.3 92.4 L 118.7 90.9 L 121.1 89.5 L 123.6 88.1 L 126.3 86.9 L 129.0 85.7 L 131.7 84.7 L 134.5 83.8 L 137.3 82.9 L 140.2 82.2 L 139.5 81.9 L 138.2 82.0 L 143.2 80.6 L 148.2 69.0 Z"/><text class="d-label" x="120.91084202417193" y="75.05382559421079">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 251.8 69.0 L 256.8 57.4 L 261.8 56.0 L 263.6 56.2 L 265.7 56.9 L 269.5 57.8 L 273.3 59.0 L 277.1 60.2 L 280.8 61.7 L 284.4 63.2 L 288.0 64.9 L 291.5 66.7 L 294.9 68.7 L 298.1 70.8 L 301.3 73.0 L 304.3 75.3 L 307.2 77.8 L 309.0 81.3 L 303.0 91.8 L 303.0 91.8 L 292.7 98.0 L 290.0 97.2 L 288.0 95.6 L 285.9 94.0 L 283.7 92.4 L 281.3 90.9 L 278.9 89.5 L 276.4 88.1 L 273.7 86.9 L 271.0 85.7 L 268.3 84.7 L 265.5 83.8 L 262.7 82.9 L 259.8 82.2 L 260.5 81.9 L 261.8 82.0 L 256.8 80.6 L 251.8 69.0 Z"/><text class="d-label" x="279.089157975828" y="75.05382559421079">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely." tabindex="0" role="img" aria-label="USB-C port. Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely."><title>USB-C port</title><rect class="d-port" x="184" y="22" width="32" height="16" rx="8"/><rect class="d-part-inset" x="190" y="26" width="20" height="8" rx="4"/><text class="d-label d-label-xs" x="200" y="50">USB-C</text></g>
</svg>
