<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 170" width="900" height="383" role="img" aria-label="GameSir Super Nova — top edge layout schematic">
  <title>GameSir Super Nova — top edge layout schematic</title>
  <desc>Original schematic diagram from the community-maintained GameSir Wiki. Not GameSir product photography.</desc>

  <style>
    :root { color-scheme: dark light; }
    svg { --ink:#f2f3f5; --muted:#a6aab3; --dim:#71757e; --line:#34343e;
          --s1:#121216; --s2:#17171d; --s3:#1e1e25; --inset:#0e0e12;
          --brand:#e5343c; --good:#35d07f; --warn:#ffc247; --bad:#ff6b6b; --info:#64a8ff; }
    @media (prefers-color-scheme: light) {
      svg { --ink:#16171a; --muted:#585d66; --dim:#80858d; --line:#cdced5;
            --s1:#fff; --s2:#fbfbfc; --s3:#f1f1f4; --inset:#f4f4f7;
            --brand:#d6272e; --good:#0f7a44; --warn:#8a5a00; --bad:#c02626; --info:#175fd0; }
    }
  </style>
  <style>
    .d-canvas{fill:var(--s1)}
    .d-body{fill:var(--s2);stroke:var(--line);stroke-width:2}
    .d-panel{fill:none;stroke:var(--line);stroke-width:1;stroke-dasharray:3 4}
    .d-part{fill:var(--s3);stroke:var(--line);stroke-width:1.4}
    .d-part-2{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-part-inset{fill:var(--inset);stroke:var(--line);stroke-width:1}
    .d-recess{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-port{fill:var(--inset);stroke:var(--muted);stroke-width:1.4}
    .d-plate{fill:var(--s3);stroke:var(--brand);stroke-width:1.6;opacity:.9}
    .d-btn,.d-btn-sm,.d-step{fill:var(--s3);stroke:var(--muted);stroke-width:1.3}
    .d-btn-good{fill:color-mix(in srgb,var(--good) 22%,transparent);stroke:var(--good)}
    .d-btn-bad{fill:color-mix(in srgb,var(--bad) 22%,transparent);stroke:var(--bad)}
    .d-btn-info{fill:color-mix(in srgb,var(--info) 22%,transparent);stroke:var(--info)}
    .d-btn-warn{fill:color-mix(in srgb,var(--warn) 22%,transparent);stroke:var(--warn)}
    .d-btn-letter{fill:var(--ink);font:700 12px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-guide{fill:var(--s3);stroke:var(--muted);stroke-width:1.4}
    .d-guide-ring{fill:none;stroke:var(--line);stroke-width:1.2}
    .d-window{fill:var(--inset);stroke:var(--muted);stroke-width:1.2;stroke-dasharray:4 3}
    .d-gear{fill:var(--s3);stroke:var(--brand);stroke-width:1.4}
    .d-fence{fill:var(--inset);stroke:var(--line);stroke-width:1.4}
    .d-glide-ring{fill:none;stroke:var(--dim);stroke-width:1.6;opacity:.7}
    .d-lit{fill:color-mix(in srgb,var(--brand) 26%,transparent);stroke:none;opacity:.55}
    .d-lit-good{fill:color-mix(in srgb,var(--good) 26%,transparent)}
    .d-lit-bad{fill:color-mix(in srgb,var(--bad) 26%,transparent)}
    .d-lit-info{fill:color-mix(in srgb,var(--info) 26%,transparent)}
    .d-lit-warn{fill:color-mix(in srgb,var(--warn) 26%,transparent)}
    .d-ring,.d-accent-ring{fill:none;stroke:var(--line);stroke-width:1.4}
    .d-accent-ring{stroke:var(--brand)}
    .d-swap-ring{fill:none;stroke:var(--brand);stroke-width:1.4;stroke-dasharray:5 4}
    .d-seam{fill:none;stroke:var(--line);stroke-width:1.2;stroke-dasharray:5 5}
    .d-rgb{fill:none;stroke:var(--brand);stroke-width:3.4;stroke-linecap:round;opacity:.75}
    .d-texture{fill:none;stroke:var(--line);stroke-width:1.6;stroke-linecap:round}
    .d-ink{fill:none;stroke:var(--muted);stroke-width:1.6}
    .d-ink-thick{fill:none;stroke:var(--muted);stroke-width:3.4;stroke-linecap:round}
    .d-leader,.d-dim-stroke{fill:none;stroke:var(--dim);stroke-width:1.1}
    .d-travel{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-dasharray:5 4}
    .d-accent-stroke{fill:none;stroke:var(--brand);stroke-width:1.8;stroke-linecap:round}
    .d-good-stroke{fill:none;stroke:var(--good);stroke-width:1.8}
    .d-warn-stroke{fill:none;stroke:var(--warn);stroke-width:1.8}
    .d-accent-fill{fill:var(--brand);stroke:none}
    .d-good-fill{fill:var(--good);stroke:none}
    .d-warn-fill{fill:var(--warn);stroke:none}
    .d-bad-fill{fill:var(--bad);stroke:none}
    .d-half-fill{fill:var(--muted);stroke:none}
    .d-dim-fill{fill:var(--dim);stroke:none}
    .d-deadzone{fill:color-mix(in srgb,var(--info) 26%,transparent);stroke:var(--info);stroke-width:1.2}
    .d-antideadzone{fill:color-mix(in srgb,var(--brand) 20%,transparent);stroke:var(--brand);stroke-width:1.2}
    .d-absent{fill:none;stroke:var(--dim);stroke-width:1.2;stroke-dasharray:4 3}
    .d-slash,.d-slash-line{fill:none;stroke:var(--bad);stroke-width:1.8;stroke-linecap:round}
    .d-lane{fill:var(--inset);stroke:var(--line);stroke-width:1.2}
    .d-lane.on{fill:color-mix(in srgb,var(--good) 12%,transparent);stroke:var(--good)}
    .d-lane-icon{color:var(--muted)}
    .d-glyph{fill:var(--muted);stroke:none}
    .d-glyph-stroke{fill:none;stroke:var(--muted);stroke-width:1.4;stroke-linecap:round}
    .d-label{fill:var(--muted);font:600 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central}
    .d-label-sm{font-size:9px}
    .d-label-xs{font-size:8px;fill:var(--dim)}
    .d-label-left{text-anchor:start}
    .d-title{fill:var(--ink);font:700 10px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;letter-spacing:.04em;text-transform:uppercase}
    .d-accent-text{fill:var(--brand)}
    .d-good-text{fill:var(--good)}
    .d-dim-text{fill:var(--dim)}
    .d-on-accent{fill:#fff}
  </style>
  <rect class="d-canvas" x="0" y="0" width="400" height="170"/>
  <g class="d-hot" data-part="lt" data-name="Left trigger (LT)" data-desc="Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + stops." tabindex="0" role="img" aria-label="Left trigger (LT). Analog trigger reporting how far it is pulled, not just whether it is pressed. Hall Effect + stops."><title>Left trigger (LT)</title><path class="d-part" d="M 130.4 28.0 L 128.9 41.6 L 125.7 45.8 L 122.1 47.8 L 118.2 49.2 L 114.4 50.7 L 110.6 52.3 L 106.9 54.0 L 103.3 55.9 L 99.8 57.9 L 96.3 60.1 L 93.0 62.3 L 89.7 64.7 L 86.6 67.3 L 83.6 69.9 L 80.7 72.7 L 77.4 75.0 L 72.3 75.9 L 59.4 71.4 L 59.4 71.4 L 52.4 59.5 L 53.4 53.2 L 56.7 48.7 L 60.6 44.8 L 64.7 41.2 L 69.0 37.8 L 73.3 34.6 L 77.8 31.6 L 82.4 28.7 L 87.0 26.1 L 91.8 23.6 L 96.6 21.3 L 101.5 19.2 L 106.5 17.3 L 111.5 15.5 L 116.8 14.7 L 122.7 16.6 L 130.4 28.0 Z"/><text class="d-label" x="91.06384752139115" y="43.32964663009126">LT</text></g><g class="d-hot" data-part="rt" data-name="Right trigger (RT)" data-desc="Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click." tabindex="0" role="img" aria-label="Right trigger (RT). Analog trigger, normally fire or accelerate. This model has trigger stops, so the travel can be shortened to a micro-switch click."><title>Right trigger (RT)</title><path class="d-part" d="M 269.6 28.0 L 271.1 41.6 L 274.3 45.8 L 277.9 47.8 L 281.8 49.2 L 285.6 50.7 L 289.4 52.3 L 293.1 54.0 L 296.7 55.9 L 300.2 57.9 L 303.7 60.1 L 307.0 62.3 L 310.3 64.7 L 313.4 67.3 L 316.4 69.9 L 319.3 72.7 L 322.6 75.0 L 327.7 75.9 L 340.6 71.4 L 340.6 71.4 L 347.6 59.5 L 346.6 53.2 L 343.3 48.7 L 339.4 44.8 L 335.3 41.2 L 331.0 37.8 L 326.7 34.6 L 322.2 31.6 L 317.6 28.7 L 313.0 26.1 L 308.2 23.6 L 303.4 21.3 L 298.5 19.2 L 293.5 17.3 L 288.5 15.5 L 283.2 14.7 L 277.3 16.6 L 269.6 28.0 Z"/><text class="d-label" x="308.93615247860885" y="43.32964663009126">RT</text></g><path class="d-body" d="M 74.1 133.3 C 55.2 129.0 44.0 112.1 51.5 91.1 C 64.7 59.5 98.4 36.4 136.0 30.0 L 264.0 30.0 C 301.6 36.4 335.3 59.5 348.5 91.1 C 356.0 112.1 344.8 129.0 325.9 133.3 C 264.0 148.0 136.0 148.0 74.1 133.3 Z"/><g class="d-hot" data-part="lb" data-name="Left bumper (LB)" data-desc="Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere." tabindex="0" role="img" aria-label="Left bumper (LB). Digital shoulder button above the left trigger. Reported as LB on Xbox and L1 elsewhere."><title>Left bumper (LB)</title><path class="d-part-2" d="M 158.6 65.0 L 153.2 55.2 L 147.8 52.6 L 142.5 52.0 L 137.1 52.0 L 135.9 52.4 L 131.9 53.3 L 127.6 54.5 L 123.3 55.9 L 119.2 57.4 L 115.1 59.1 L 111.1 60.9 L 107.1 62.9 L 103.3 65.1 L 99.7 67.5 L 96.1 70.0 L 93.1 73.1 L 91.6 77.7 L 95.6 87.5 L 95.6 87.5 L 104.8 92.3 L 108.8 92.3 L 111.6 90.9 L 114.1 89.1 L 116.8 87.4 L 119.6 85.8 L 122.5 84.3 L 125.5 82.9 L 128.6 81.6 L 131.7 80.5 L 134.9 79.4 L 138.1 78.6 L 140.7 77.9 L 137.1 78.0 L 142.5 78.0 L 147.8 77.4 L 153.2 74.8 L 158.6 65.0 Z"/><text class="d-label" x="123.86509424721262" y="69.49076363286812">LB</text></g><g class="d-hot" data-part="rb" data-name="Right bumper (RB)" data-desc="Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere." tabindex="0" role="img" aria-label="Right bumper (RB). Digital shoulder button above the right trigger. Reported as RB on Xbox and R1 elsewhere."><title>Right bumper (RB)</title><path class="d-part-2" d="M 241.4 65.0 L 246.8 55.2 L 252.2 52.6 L 257.5 52.0 L 262.9 52.0 L 264.1 52.4 L 268.1 53.3 L 272.4 54.5 L 276.7 55.9 L 280.8 57.4 L 284.9 59.1 L 288.9 60.9 L 292.9 62.9 L 296.7 65.1 L 300.3 67.5 L 303.9 70.0 L 306.9 73.1 L 308.4 77.7 L 304.4 87.5 L 304.4 87.5 L 295.2 92.3 L 291.2 92.3 L 288.4 90.9 L 285.9 89.1 L 283.2 87.4 L 280.4 85.8 L 277.5 84.3 L 274.5 82.9 L 271.4 81.6 L 268.3 80.5 L 265.1 79.4 L 261.9 78.6 L 259.3 77.9 L 262.9 78.0 L 257.5 78.0 L 252.2 77.4 L 246.8 74.8 L 241.4 65.0 Z"/><text class="d-label" x="276.1349057527874" y="69.49076363286812">RB</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely." tabindex="0" role="img" aria-label="USB-C port. Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely."><title>USB-C port</title><rect class="d-port" x="184" y="22" width="32" height="16" rx="8"/><rect class="d-part-inset" x="190" y="26" width="20" height="8" rx="4"/><text class="d-label d-label-xs" x="200" y="50">USB-C</text></g>
</svg>
