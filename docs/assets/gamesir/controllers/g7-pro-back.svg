 L 240.2 48.3 L 240.2 48.3 L 239.0 40.8 L 237.9 38.8 L 236.8 38.4 L 235.8 38.4 L 234.8 38.5 L 233.7 38.5 L 232.7 38.5 L 231.6 38.6 L 230.6 38.6 L 229.6 38.7 L 228.6 38.7 L 227.5 38.8 L 226.5 38.8 L 225.5 38.9 L 224.5 38.9 L 223.5 39.5 L 222.6 41.5 L 222.0 49.1 Z"/><text class="d-label d-label-xs" x="231.06360457289063" y="48.610068285681876">R5</text></g><g class="d-hot" data-part="usbc" data-name="USB-C port" data-desc="Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely." tabindex="0" role="img" aria-label="USB-C port. Data and charging. Also the connection to use when a wireless mode is misbehaving, since it bypasses pairing entirely."><title>USB-C port</title><rect class="d-port" x="182" y="51.59" width="36" height="15" rx="7.5"/><rect class="d-part-inset" x="188" y="56.09" width="24" height="6" rx="3"/><text class="d-label d-label-xs" x="200" y="79.09">USB-C</text></g><g class="d-hot" data-part="gear" data-name="Trigger stop switches" data-desc="Physical switches that shorten the trigger from full analog travel to a short click. Microswitch trigger stops allow switching from analog travel to a short mouse-click style actuation." tabindex="0" role="img" aria-label="Trigger stop switches. Physical switches that shorten the trigger from full analog travel to a short click. Microswitch trigger stops allow switching from analog travel to a short mouse-click style actuation."><title>Trigger stop switches</title><rect class="d-part-2" x="99.39999999999999" y="87.64" width="34" height="15" rx="7.5"/><rect class="d-accent-fill" x="102.39999999999999" y="90.64" width="12" height="9" rx="4.5"/><text class="d-label d-label-xs" x="116.39999999999999" y="115.14">stop</text></g><g class="d-hot" data-part="gear" data-name="Trigger stop switches" data-desc="Physical switches that shorten the trigger from full analog travel to a short click. Microswitch trigger stops allow switching from analog travel to a short mouse-click style actuation." tabindex="0" role="img" aria-label="Trigger stop switches. Physical switches that shorten the trigger from full analog travel to a short click. Microswitch trigger stops allow switching from analog travel to a short mouse-click style actuation."><title>Trigger stop switches</title><rect class="d-part-2" x="266.6" y="87.64" width="34" height="15" rx="7.5"/><rect class="d-accent-fill" x="285.6" y="90.64" width="12" height="9" rx="4.5"/><text class="d-label d-label-xs" x="283.6" y="115.14">stop</text></g><g class="d-hot" data-part="l4" data-name="Rear button L4" data-desc="Remappable paddle reached by the middle finger. Ships as a null input, so it does nothing until it is assigned." tabindex="0" role="img" aria-label="Rear button L4. Remappable paddle reached by the middle finger. Ships as a null input, so it does nothing until it is assigned."><title>Rear button L4</title><g transform="rotate(-15 101.96 218.74)"><rect class="d-part-2" x="88.96" y="193.74" width="26" height="50" rx="13"/></g><text class="d-label d-label-sm" x="101.96" y="218.74">L4</text></g><g class="d-hot" data-part="r4" data-name="Rear button R4" data-desc="Remappable paddle on the right grip, assigned the same way as L4." tabindex="0" role="img" aria-label="Rear button R4. Remappable paddle on the right grip, assigned the same way as L4."><title>Rear button R4</title><g transform="rotate(15 298.04 218.74)"><rect class="d-part-2" x="285.04" y="193.74" width="26" height="50" rx="13"/></g><text class="d-label d-label-sm" x="298.04" y="218.74">R4</text></g><g class="d-hot" data-part="grip" data-name="Grip" data-desc="Textured grip. Documented weight for the whole controller: 272 g." tabindex="0" role="img" aria-label="Grip. Textured grip. Documented weight for the whole controller: 272 g."><title>Grip</title><path class="d-texture" d="M 65.4 187.0 L 66.2 189.8 L 67.0 192.6 L 67.9 195.4 L 68.9 198.1 L 69.9 200.8 L 70.9 203.5 L 72.0 206.2 L 73.2 208.8 L 74.5 211.4 L 75.8 213.9 L 77.1 216.4 L 78.6 218.8 L 80.1 221.1 L 81.6 223.4 L 83.2 225.7 L 84.9 227.8 L 86.7 229.9 L 88.5 231.9"/><path class="d-texture" d="M 79.0 183.4 L 79.7 186.0 L 80.4 188.5 L 81.2 191.0 L 82.1 193.5 L 82.9 195.9 L 83.9 198.3 L 84.9 200.6 L 85.9 202.9 L 87.0 205.1 L 88.1 207.3 L 89.3 209.4 L 90.5 211.5 L 91.8 213.5 L 93.1 215.4 L 94.4 217.2 L 95.8 219.0 L 97.2 220.7 L 98.6 222.2"/><path class="d-texture" d="M 334.6 187.0 L 333.8 189.8 L 333.0 192.6 L 332.1 195.4 L 331.1 198.1 L 330.1 200.8 L 329.1 203.5 L 328.0 206.2 L 326.8 208.8 L 325.5 211.4 L 324.2 213.9 L 322.9 216.4 L 321.4 218.8 L 319.9 221.1 L 318.4 223.4 L 316.8 225.7 L 315.1 227.8 L 313.3 229.9 L 311.5 231.9"/><path class="d-texture" d="M 321.0 183.4 L 320.3 186.0 L 319.6 188.5 L 318.8 191.0 L 317.9 193.5 L 317.1 195.9 L 316.1 198.3 L 315.1 200.6 L 314.1 202.9 L 313.0 205.1 L 311.9 207.3 L 310.7 209.4 L 309.5 211.5 L 308.2 213.5 L 306.9 215.4 L 305.6 217.2 L 304.2 219.0 L 302.8 220.7 L 301.4 222.2"/></g>
